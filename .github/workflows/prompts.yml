name: Publish prompt index
on:
  push:
    branches: [main]
    paths: ['prompts/catalog.json', 'prompts/**/*.md', 'scripts/build-prompts.mjs', '.github/workflows/prompts.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prompt-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-prompts.mjs
      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompts/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update prompt index'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
