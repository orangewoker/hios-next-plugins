<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>拼图</title>
  <style>
    :root { color-scheme: dark; --bg:#15191f; --surface:#1d232b; --muted:#202832; --control:#27313c; --text:#edf2f7; --text-2:#b7c1cc; --text-3:#7f8b98; --border:#34404c; --accent:#2f91ff; --positive:#45b979; --negative:#ee6672; }
    :root[data-theme="light"] { color-scheme:light; --bg:#edf2f6; --surface:#f8fafc; --muted:#e6edf3; --control:#e3eaf0; --text:#263242; --text-2:#5e6b7a; --text-3:#8995a2; --border:#cbd5df; }
    * { box-sizing:border-box; } html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:var(--text); background:var(--bg); font:11px/1.35 "PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .app { height:100%; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; background:var(--surface); border-bottom:1px solid var(--border); }
    .title { min-width:0; display:flex; align-items:center; gap:8px; }.mark { width:25px; height:25px; display:grid; place-items:center; flex:none; color:var(--accent); background:color-mix(in srgb,var(--accent) 16%,transparent); border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border)); border-radius:8px; font-weight:800; }
    .title strong,.title small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.title strong { font-size:11px; }.title small { margin-top:2px; color:var(--text-3); font-size:8px; }
    .status { flex:none; display:inline-flex; align-items:center; gap:5px; padding:4px 7px; color:var(--text-3); background:var(--muted); border:1px solid var(--border); border-radius:999px; font-size:8px; }.status::before { width:6px; height:6px; content:""; background:currentColor; border-radius:50%; }.status.ok { color:var(--positive); }.status.error { color:var(--negative); }
    .body { min-height:0; display:grid; grid-template-rows:minmax(130px,1fr) auto; gap:8px; padding:9px 10px; overflow:hidden; }
    .preview { min-height:130px; display:grid; place-items:center; overflow:hidden; padding:7px; background:var(--muted); border:1px solid var(--border); border-radius:9px; }.preview canvas { display:block; width:100%; height:100%; object-fit:contain; image-rendering:auto; }.empty { color:var(--text-3); text-align:center; }.empty strong { display:block; color:var(--text-2); font-size:12px; }.empty span { display:block; margin-top:5px; font-size:9px; }
    .controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 9px; padding:9px 10px; background:var(--surface); border-top:1px solid var(--border); }.field { min-width:0; display:flex; align-items:center; gap:6px; }.field > span { flex:none; min-width:52px; color:var(--text-2); font-size:9px; }.field input[type="number"],.field input[type="text"],.field select { min-width:0; width:100%; height:26px; padding:4px 7px; color:var(--text); background:var(--control); border:1px solid var(--border); border-radius:6px; outline:none; }.field input:focus,.field select:focus { border-color:var(--accent); }.color { width:30px !important; min-width:30px; padding:2px !important; }.range { min-width:0; flex:1; accent-color:var(--accent); }.value { width:31px; color:var(--text-2); font-variant-numeric:tabular-nums; text-align:right; }.check { justify-content:flex-start; }.check input { accent-color:var(--accent); }.watermark-options { grid-column:1/-1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 9px; padding-top:2px; border-top:1px solid var(--border); }.watermark-options[hidden] { display:none; }.actions { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:8px; }.hint { min-width:0; color:var(--text-3); font-size:8px; }.output { min-height:28px; padding:0 13px; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:7px; font-size:9px; font-weight:700; }.output:hover { filter:brightness(1.08); }.output:disabled { cursor:not-allowed; opacity:.42; }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar"><div class="title"><span class="mark">拼</span><span><strong>拼图</strong><small>连接图片后合成为宫格 PNG</small></span></div><span id="status" class="status">等待输入</span></header>
    <section class="body"><div class="preview"><canvas id="preview" aria-label="拼图预览"></canvas><div id="empty" class="empty"><strong>连接图片节点</strong><span>选择布局后，将图片依次连接到对应输入口。</span></div></div><div class="controls">
      <label class="field"><span>布局</span><select id="layout"><option value="2">双图（2 × 1）</option><option value="4">四宫格（2 × 2）</option><option value="6">六宫格（3 × 2）</option><option value="9">九宫格（3 × 3）</option></select></label>
      <label class="field"><span>间隔</span><input id="gap" type="number" min="0" max="200" step="1" /><span>px</span></label>
      <label class="field"><span>间隔颜色</span><input id="gapColor" class="color" type="color" /><input id="gapColorText" type="text" aria-label="间隔颜色 HEX" /></label>
      <label class="field check"><input id="watermarkEnabled" type="checkbox" /><span>启用水印</span></label>
      <div id="watermarkOptions" class="watermark-options" hidden>
        <label class="field"><span>添加到</span><select id="watermarkScope"><option value="each">每个小图</option><option value="final">最终拼图</option></select></label>
        <label class="field"><span>水印文字</span><input id="watermarkText" type="text" maxlength="80" /></label>
        <label class="field"><span>位置</span><select id="watermarkPosition"><option value="top-left">左上</option><option value="top-center">顶部中间</option><option value="top-right">右上</option><option value="middle-left">左中</option><option value="center">居中</option><option value="middle-right">右中</option><option value="bottom-left">左下</option><option value="bottom-center">底部中间</option><option value="bottom-right">右下</option></select></label>
        <label class="field"><span>颜色</span><input id="watermarkColor" class="color" type="color" /><input id="watermarkColorText" type="text" aria-label="水印颜色 HEX" /></label>
        <label class="field"><span>透明度</span><input id="watermarkOpacity" class="range" type="range" min="5" max="100" step="1" /><output id="watermarkOpacityValue" class="value"></output></label>
        <label class="field"><span>字号</span><input id="watermarkSize" type="number" min="8" max="240" step="1" /><span>px</span></label>
      </div>
      <div class="actions"><span id="hint" class="hint">默认间隔 1px，白色；图片保持比例不裁剪。</span><button id="output" class="output" type="button" disabled>运行并输出</button></div>
    </div></section>
  </main>
  <script>
    (() => {
      'use strict';
      const PROTOCOL = 'hios-plugin-node/v1';
      const $ = (id) => document.getElementById(id);
      const layoutMap = { 2:{ cols:2, rows:1 }, 4:{ cols:2, rows:2 }, 6:{ cols:3, rows:2 }, 9:{ cols:3, rows:3 } };
      const defaults = { layout:4, gap:1, gapColor:'#ffffff', watermarkEnabled:false, watermarkScope:'final', watermarkText:'HIOS Next', watermarkPosition:'bottom-right', watermarkColor:'#ffffff', watermarkOpacity:60, watermarkSize:24 };
      const runtime = { nodeId:'', pluginId:'puzzle-grid', inputs:{}, sources:Array(9).fill(''), images:Array(9).fill(null), objectUrls:Array(9).fill(''), state:{ ...defaults }, previewFrame:0, ready:false };
      const preview = $('preview'), previewEmpty = $('empty'), status = $('status'), outputButton = $('output'), watermarkOptions = $('watermarkOptions');
      function post(type, payload = {}) { parent.postMessage({ protocol:PROTOCOL, nodeId:runtime.nodeId, pluginId:runtime.pluginId, type, payload }, '*'); }
      function clamp(value, min, max, fallback) { const number = Number(value); return Number.isFinite(number) ? Math.max(min, Math.min(max, number)) : fallback; }
      function setStatus(text, kind = '') { status.textContent = text; status.className = `status ${kind}`.trim(); }
      function sourceFrom(value) { if (Array.isArray(value)) return sourceFrom(value[0]); if (typeof value === 'string') return value.trim(); if (value && typeof value === 'object') return sourceFrom(value.source || value.dataUrl || value.url || value.value || ''); return ''; }
      function validColor(value, fallback) { return /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value) : fallback; }
      function normalizedState(next) { const input = next && typeof next === 'object' ? next : {}; return { layout: layoutMap[Number(input.layout)] ? Number(input.layout) : defaults.layout, gap:clamp(input.gap,0,200,defaults.gap), gapColor:validColor(input.gapColor,defaults.gapColor), watermarkEnabled:Boolean(input.watermarkEnabled), watermarkScope:input.watermarkScope === 'each' ? 'each' : 'final', watermarkText:String(input.watermarkText ?? defaults.watermarkText).slice(0,80), watermarkPosition:['top-left','top-center','top-right','middle-left','center','middle-right','bottom-left','bottom-center','bottom-right'].includes(input.watermarkPosition) ? input.watermarkPosition : defaults.watermarkPosition, watermarkColor:validColor(input.watermarkColor,defaults.watermarkColor), watermarkOpacity:clamp(input.watermarkOpacity,5,100,defaults.watermarkOpacity), watermarkSize:clamp(input.watermarkSize,8,240,defaults.watermarkSize) }; }
      function applyTheme(theme) { if (!theme || typeof theme !== 'object') return; document.documentElement.dataset.theme = theme.mode === 'light' ? 'light' : 'dark'; const tokens = theme.tokens && typeof theme.tokens === 'object' ? theme.tokens : {}; const names = { background:'--bg',surface:'--surface',muted:'--muted',control:'--control',text:'--text',textSecondary:'--text-2',textMuted:'--text-3',border:'--border',accent:'--accent',positive:'--positive',negative:'--negative' }; Object.entries(names).forEach(([key, css]) => { if (typeof tokens[key] === 'string' && tokens[key]) document.documentElement.style.setProperty(css,tokens[key]); }); }
      function revoke(index) { if (runtime.objectUrls[index]) URL.revokeObjectURL(runtime.objectUrls[index]); runtime.objectUrls[index] = ''; }
      async function loadSource(index, source) { revoke(index); runtime.sources[index] = source; runtime.images[index] = null; if (!source) return; try { const response = await fetch(source); if (!response.ok) throw new Error(`HTTP ${response.status}`); const blob = await response.blob(); const url = URL.createObjectURL(blob); runtime.objectUrls[index] = url; const image = new Image(); image.src = url; await image.decode(); runtime.images[index] = image; } catch { const image = new Image(); image.src = source; try { await image.decode(); runtime.images[index] = image; } catch { runtime.images[index] = null; } } }
      function syncControls() { const s = runtime.state; $('layout').value=String(s.layout); $('gap').value=String(s.gap); $('gapColor').value=s.gapColor; $('gapColorText').value=s.gapColor; $('watermarkEnabled').checked=s.watermarkEnabled; $('watermarkScope').value=s.watermarkScope; $('watermarkText').value=s.watermarkText; $('watermarkPosition').value=s.watermarkPosition; $('watermarkColor').value=s.watermarkColor; $('watermarkColorText').value=s.watermarkColor; $('watermarkOpacity').value=String(s.watermarkOpacity); $('watermarkOpacityValue').textContent=`${Math.round(s.watermarkOpacity)}%`; $('watermarkSize').value=String(s.watermarkSize); watermarkOptions.hidden=!s.watermarkEnabled; }
      function readControls() { const s = runtime.state; s.layout=Number($('layout').value); s.gap=clamp($('gap').value,0,200,1); s.gapColor=validColor($('gapColor').value,s.gapColor); s.watermarkEnabled=$('watermarkEnabled').checked; s.watermarkScope=$('watermarkScope').value === 'each' ? 'each' : 'final'; s.watermarkText=$('watermarkText').value.slice(0,80); s.watermarkPosition=$('watermarkPosition').value; s.watermarkColor=validColor($('watermarkColor').value,s.watermarkColor); s.watermarkOpacity=clamp($('watermarkOpacity').value,5,100,60); s.watermarkSize=clamp($('watermarkSize').value,8,240,24); syncControls(); post('state',{ state:{ ...s } }); schedulePreview(); }
      function metrics() { const layout=layoutMap[runtime.state.layout]; const images=runtime.images.slice(0,layout.cols*layout.rows).filter(Boolean); const maxWidth=Math.max(320,...images.map((image)=>image.naturalWidth||320)); const maxHeight=Math.max(240,...images.map((image)=>image.naturalHeight||240)); const cellWidth=Math.min(1600,Math.max(320,maxWidth)); const cellHeight=Math.min(1600,Math.max(240,maxHeight)); const gap=runtime.state.gap; return { ...layout, cellWidth, cellHeight, gap, width:layout.cols*cellWidth+(layout.cols+1)*gap, height:layout.rows*cellHeight+(layout.rows+1)*gap }; }
      function drawContained(context,image,x,y,width,height) { const scale=Math.min(width/image.naturalWidth,height/image.naturalHeight); const drawWidth=image.naturalWidth*scale, drawHeight=image.naturalHeight*scale; context.drawImage(image,x+(width-drawWidth)/2,y+(height-drawHeight)/2,drawWidth,drawHeight); }
      function watermarkPoint(position,x,y,width,height,padding) { const horizontal=position.endsWith('left')?'left':position.endsWith('right')?'right':'center'; const vertical=position.startsWith('top')?'top':position.startsWith('bottom')?'bottom':'middle'; return { x:horizontal==='left'?x+padding:horizontal==='right'?x+width-padding:x+width/2, y:vertical==='top'?y+padding:vertical==='bottom'?y+height-padding:y+height/2, align:horizontal==='left'?'left':horizontal==='right'?'right':'center', baseline:vertical==='top'?'top':vertical==='bottom'?'bottom':'middle' }; }
      function drawWatermark(context,text,x,y,width,height) { if (!text || !runtime.state.watermarkEnabled) return; const size=Math.max(8,runtime.state.watermarkSize); const padding=Math.max(8,size*.55); const point=watermarkPoint(runtime.state.watermarkPosition,x,y,width,height,padding); context.save(); context.globalAlpha=runtime.state.watermarkOpacity/100; context.font=`700 ${size}px "Microsoft YaHei",sans-serif`; context.textAlign=point.align; context.textBaseline=point.baseline; context.lineJoin='round'; context.strokeStyle='rgba(0,0,0,.45)'; context.lineWidth=Math.max(2,size*.12); context.strokeText(text,point.x,point.y); context.fillStyle=runtime.state.watermarkColor; context.fillText(text,point.x,point.y); context.restore(); }
      function renderInto(canvas) { const required=runtime.state.layout; const layout=layoutMap[required]; const metric=metrics(); canvas.width=metric.width; canvas.height=metric.height; const context=canvas.getContext('2d'); if (!context) throw new Error('无法创建图片输出画布'); context.fillStyle=runtime.state.gapColor; context.fillRect(0,0,metric.width,metric.height); for (let index=0; index<required; index += 1) { const image=runtime.images[index]; if (!image) continue; const column=index%layout.cols, row=Math.floor(index/layout.cols); const x=metric.gap+column*(metric.cellWidth+metric.gap), y=metric.gap+row*(metric.cellHeight+metric.gap); context.fillStyle=runtime.state.gapColor; context.fillRect(x,y,metric.cellWidth,metric.cellHeight); drawContained(context,image,x,y,metric.cellWidth,metric.cellHeight); if (runtime.state.watermarkScope==='each') { context.save(); context.beginPath(); context.rect(x,y,metric.cellWidth,metric.cellHeight); context.clip(); drawWatermark(context,runtime.state.watermarkText,x,y,metric.cellWidth,metric.cellHeight); context.restore(); } } if (runtime.state.watermarkScope==='final') drawWatermark(context,runtime.state.watermarkText,0,0,metric.width,metric.height); return { width:metric.width, height:metric.height }; }
      async function renderPreview() { if (!runtime.ready) { preview.hidden=true; previewEmpty.hidden=false; return; } const offscreen=document.createElement('canvas'); renderInto(offscreen); const width=Math.max(1,preview.clientWidth), height=Math.max(1,preview.clientHeight); preview.width=Math.round(width* Math.min(2,window.devicePixelRatio||1)); preview.height=Math.round(height* Math.min(2,window.devicePixelRatio||1)); const context=preview.getContext('2d'); if (!context) return; context.clearRect(0,0,preview.width,preview.height); const scale=Math.min(preview.width/offscreen.width,preview.height/offscreen.height); const drawWidth=offscreen.width*scale, drawHeight=offscreen.height*scale; context.drawImage(offscreen,(preview.width-drawWidth)/2,(preview.height-drawHeight)/2,drawWidth,drawHeight); preview.hidden=false; previewEmpty.hidden=true; }
      function schedulePreview() { cancelAnimationFrame(runtime.previewFrame); runtime.previewFrame=requestAnimationFrame(()=>void renderPreview()); }
      async function hydrate(payload) { runtime.nodeId=String(payload.nodeId||runtime.nodeId||''); runtime.pluginId=String(payload.pluginId||runtime.pluginId||'puzzle-grid'); runtime.inputs=payload.inputs&&typeof payload.inputs==='object'?payload.inputs:{}; runtime.state=normalizedState(payload.state); applyTheme(payload.theme); syncControls(); const jobs=[]; for (let index=0; index<9; index += 1) { const source=sourceFrom(runtime.inputs[`image${index+1}`]); if (source!==runtime.sources[index]) jobs.push(loadSource(index,source)); } await Promise.all(jobs); const required=runtime.state.layout; const available=runtime.images.slice(0,required).filter(Boolean).length; runtime.ready=available===required; outputButton.disabled=!runtime.ready; setStatus(runtime.ready?'拼图已就绪':available?`还差 ${required-available} 张图片`:'等待输入',runtime.ready?'ok':''); schedulePreview(); post('loaded',{ ready:runtime.ready }); }
      async function run() { outputButton.disabled=true; setStatus('正在生成拼图…'); try { if (!runtime.ready) throw new Error(`请连接 ${runtime.state.layout} 张图片`); const canvas=document.createElement('canvas'); const result=renderInto(canvas); const source=canvas.toDataURL('image/png'); post('output',{ output:{ kind:'image', portId:'image', source, dataUrl:source, name:`拼图-${runtime.state.layout}格.png`, mime:'image/png', width:result.width, height:result.height, metadata:{ layout:runtime.state.layout, gap:runtime.state.gap, gapColor:runtime.state.gapColor, watermarkEnabled:runtime.state.watermarkEnabled, watermarkScope:runtime.state.watermarkScope } } }); setStatus('输出已就绪','ok'); } catch (error) { const message=error instanceof Error?error.message:String(error); setStatus(message,'error'); post('error',{ message }); } finally { outputButton.disabled=!runtime.ready; } }
      ['layout','gap','watermarkEnabled','watermarkScope','watermarkText','watermarkPosition','watermarkOpacity','watermarkSize'].forEach((id)=>$(id).addEventListener('input',readControls));
      $('gapColor').addEventListener('input',()=>{ $('gapColorText').value=$('gapColor').value; readControls(); }); $('gapColorText').addEventListener('change',()=>{ runtime.state.gapColor=validColor($('gapColorText').value,runtime.state.gapColor); syncControls(); readControls(); });
      $('watermarkColor').addEventListener('input',()=>{ $('watermarkColorText').value=$('watermarkColor').value; readControls(); }); $('watermarkColorText').addEventListener('change',()=>{ runtime.state.watermarkColor=validColor($('watermarkColorText').value,runtime.state.watermarkColor); syncControls(); readControls(); });
      $('watermarkOpacity').addEventListener('input',()=>{ $('watermarkOpacityValue').textContent=`${Math.round(Number($('watermarkOpacity').value))}%`; readControls(); }); outputButton.addEventListener('click',()=>void run());
      window.addEventListener('message',(event)=>{ const message=event.data; if (!message||message.protocol!==PROTOCOL) return; if (message.type==='init') void hydrate(message.payload||{}); if (message.type==='run') void hydrate(message.payload||{}).then(run); }); window.addEventListener('resize',schedulePreview); window.addEventListener('beforeunload',()=>runtime.objectUrls.forEach((_,index)=>revoke(index)));
      runtime.state=normalizedState(defaults); syncControls(); post('ready',{ version:'0.1.0' });
    })();
  </script>
</body>
</html>
