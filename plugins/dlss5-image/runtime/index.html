<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DLSS 5 图片增强</title>
  <style>
    :root { color-scheme:light; --bg:#edf2f6; --surface:#f8fafc; --muted:#e8eef3; --control:#e7edf2; --text:#253143; --text-2:#5f6c7e; --border:#cbd6df; --accent:#5768f2; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#18212c; --surface:#202c39; --muted:#17212b; --control:#253240; --text:#edf3f8; --text-2:#b6c1cd; --border:#344352; --accent:#5768f2; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:var(--text); background:var(--muted); font:12px/1.45 system-ui,"Microsoft YaHei",sans-serif; }
    .wrap { height:100%; min-height:0; padding:12px; display:flex; flex-direction:column; gap:9px; }
    .headline { display:flex; align-items:center; gap:7px; color:var(--text); font-weight:600; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
    .settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end; }
    label { display:flex; flex-direction:column; gap:4px; color:var(--text-2); }
    select { min-width:0; width:100%; padding:6px 7px; color:var(--text); background:var(--control); border:1px solid var(--border); border-radius:6px; font:inherit; }
    input[type="range"] { width:100%; margin:4px 0 2px; accent-color:var(--accent); }
    .status { margin-top:auto; padding:8px 9px; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:7px; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="headline"><span class="dot"></span><span>本机图片增强</span></div>
    <div class="settings">
      <label>增强风格
        <select id="style">
          <option value="natural">自然</option>
          <option value="default">默认</option>
          <option value="cinematic">电影感</option>
        </select>
      </label>
      <label>增强强度 <span id="strength-value">1.0</span>
        <input id="strength" type="range" min="0" max="2" step="0.1" value="1">
      </label>
    </div>
    <div class="status" id="status">等待连接图片</div>
  </div>
  <script>
    const protocol = 'hios-plugin-node/v1', pluginId = 'dlss5-image';
    const pending = new Map();
    const styleInput = document.getElementById('style');
    const strengthInput = document.getElementById('strength');
    let nodeId = '', hasInput = false;
    function post(type, payload = {}) { parent.postMessage({ protocol, pluginId, nodeId, type, payload }, '*'); }
    function settings() { return { style:styleInput.value, strength:Number(strengthInput.value) }; }
    function request() {
      const requestId = crypto.randomUUID();
      post('dlss5-image-request', { requestId, ...settings() });
      return new Promise((resolve, reject) => pending.set(requestId, { resolve, reject }));
    }
    function set(text) { document.getElementById('status').textContent = text; }
    function updateStrengthLabel() { document.getElementById('strength-value').textContent = Number(strengthInput.value).toFixed(1); }
    function saveSettings() { updateStrengthLabel(); post('state', { state:settings() }); }
    function applyTheme(theme) {
      if (!theme || typeof theme !== 'object') return;
      document.documentElement.dataset.theme = theme.mode === 'dark' ? 'dark' : 'light';
      const names = { background:'--bg', surface:'--surface', muted:'--muted', control:'--control', text:'--text', textSecondary:'--text-2', border:'--border', accent:'--accent' };
      const tokens = theme.tokens && typeof theme.tokens === 'object' ? theme.tokens : {};
      for (const [key, css] of Object.entries(names)) if (typeof tokens[key] === 'string' && tokens[key]) document.documentElement.style.setProperty(css, tokens[key]);
    }
    function hydrate(payload, syncSettings = false) {
      nodeId = payload.nodeId || nodeId;
      applyTheme(payload.theme);
      if (syncSettings && payload.state && typeof payload.state === 'object') {
        if (['natural','default','cinematic'].includes(payload.state.style)) styleInput.value = payload.state.style;
        if (Number.isFinite(Number(payload.state.strength))) strengthInput.value = String(Math.max(0, Math.min(2, Number(payload.state.strength))));
        updateStrengthLabel();
      }
      const connected = payload.inputs?.image;
      hasInput = typeof connected === 'string' ? Boolean(connected) : Array.isArray(connected) && Boolean(connected[0]);
      if (!hasInput) set('等待连接图片');
      else if (document.getElementById('status').textContent === '等待连接图片') set('图片已连接，点击节点运行');
    }
    styleInput.addEventListener('change', saveSettings);
    strengthInput.addEventListener('input', saveSettings);
    window.addEventListener('message', (event) => {
      if (event.source !== parent || event.data?.protocol !== protocol) return;
      const { type, payload = {} } = event.data;
      if (type === 'init') hydrate(payload, true);
      if (type === 'dlss5-image-result') {
        const item = pending.get(payload.requestId);
        if (!item) return;
        pending.delete(payload.requestId);
        payload.error ? item.reject(new Error(payload.error)) : item.resolve(payload.result);
      }
      if (type === 'run') {
        hydrate(payload);
        set('正在调用本机显卡处理…');
        request().then((result) => {
          set('增强完成，已在右侧生成结果图片');
          post('output', { output: { kind:'image', portId:'image', source:result.source, name:result.name, mime:'image/png', metadata:{ addToCanvas:true, ...settings() } } });
        }).catch((error) => {
          const message = String(error.message || error);
          set(message);
          post('error', { message });
        });
      }
    });
    post('ready');
  </script>
</body>
</html>
