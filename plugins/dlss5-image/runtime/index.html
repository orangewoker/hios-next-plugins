<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLSS 5 图片增强</title><style>*{box-sizing:border-box}body{margin:0;background:#1e2630;color:#eef3f7;font:13px system-ui,'Microsoft YaHei',sans-serif}.wrap{height:100vh;padding:14px;display:flex;flex-direction:column;gap:10px}p{margin:0;color:#a9b6c4}img{min-height:0;flex:1;max-width:100%;object-fit:contain;border-radius:8px;background:#151b22}.state{white-space:pre-wrap;word-break:break-word;color:#9eb1c2}</style></head><body><div class="wrap"><strong>本机图片增强</strong><p>连接图片后，点击画布节点的运行按钮。</p><img id="preview" hidden alt="增强预览"><div class="state" id="state">等待输入图片</div></div><script>
const protocol='hios-plugin-node/v1',pluginId='dlss5-image';let nodeId='',source='';const pending=new Map();function post(type,payload={}){parent.postMessage({protocol,pluginId,nodeId,type,payload},'*')}function request(source){const requestId=crypto.randomUUID();post('dlss5-image-request',{requestId,source});return new Promise((resolve,reject)=>pending.set(requestId,{resolve,reject}))}function set(text){document.getElementById('state').textContent=text}function hydrate(p){nodeId=p.nodeId||nodeId;const value=p.inputs?.image;source=typeof value==='string'?value:Array.isArray(value)&&typeof value[0]==='string'?value[0]:'';if(!source)set('等待连接 HIOS 本地图片')}window.addEventListener('message',e=>{if(e.source!==parent||e.data?.protocol!==protocol)return;const m=e.data;if(m.type==='init')hydrate(m.payload||{});if(m.type==='dlss5-image-result'){const p=m.payload||{},item=pending.get(p.requestId);if(item){pending.delete(p.requestId);p.error?item.reject(new Error(p.error)):item.resolve(p.result)}}if(m.type==='run'){hydrate(m.payload||{});if(!source){set('请先连接图片');post('error',{message:'请先连接图片'});return}set('正在调用本机显卡处理…');request(source).then(r=>{document.getElementById('preview').src=r.source;document.getElementById('preview').hidden=false;set('增强完成');post('output',{output:{kind:'image',portId:'image',source:r.source,name:r.name,mime:'image/png'}})}).catch(err=>{set(String(err.message||err));post('error',{message:String(err.message||err)})})}});post('ready');
</script></body></html>
