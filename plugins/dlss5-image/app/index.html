<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DLSS 5 图片增强</title>
  <style>
    :root { color-scheme:light; --bg:#edf2f6; --surface:#f8fafc; --muted:#e8eef3; --control:#e7edf2; --text:#253143; --text-2:#5f6c7e; --border:#cbd6df; --accent:#5768f2; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#18212c; --surface:#202c39; --muted:#17212b; --control:#253240; --text:#edf3f8; --text-2:#b6c1cd; --border:#344352; --accent:#5768f2; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { color:var(--text); background:var(--bg); font:13px/1.55 system-ui,"Microsoft YaHei",sans-serif; }
    main { width:100%; max-width:1160px; height:100%; min-height:0; margin:auto; padding:24px; overflow:auto; }
    h1 { margin:0 0 5px; font-size:23px; line-height:1.35; }
    h2 { margin:0 0 12px; font-size:16px; }
    p { margin:0 0 14px; color:var(--text-2); }
    .bar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:18px 0; }
    .bar span { min-width:200px; flex:1; color:var(--text-2); }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .cards section { min-width:0; min-height:280px; padding:18px; border:1px solid var(--border); border-radius:13px; background:var(--surface); }
    .settings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:18px 0; }
    .settings label { display:flex; flex-direction:column; gap:6px; color:var(--text-2); }
    .settings select { width:100%; padding:8px 9px; color:var(--text); background:var(--control); border:1px solid var(--border); border-radius:7px; font:inherit; }
    .settings input[type="range"] { width:100%; margin:7px 0; accent-color:var(--accent); }
    .effect-controls { margin:12px 0; padding:12px; border:1px solid var(--border); border-radius:9px; background:var(--muted); }
    .effect-controls[hidden] { display:none; }
    .effect-controls .settings { margin:0; }
    .effect-controls input[type="range"] { width:100%; accent-color:var(--accent); }
    .preview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .preview-grid figure { margin:0; min-width:0; }
    .preview-grid figcaption { margin-bottom:6px; color:var(--text-2); }
    .preview-grid[hidden] { display:none; }
    button { padding:9px 14px; border:1px solid transparent; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:hover:not(:disabled) { filter:brightness(1.06); }
    button:disabled { opacity:.48; cursor:not-allowed; }
    button.ghost { color:var(--text); background:var(--control); border-color:var(--border); }
    .status { margin-bottom:12px; padding:10px 12px; border-radius:8px; color:var(--text-2); background:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; }
    img { display:block; max-width:100%; max-height:min(55vh,520px); margin:0 auto; border-radius:8px; object-fit:contain; }
    img[hidden] { display:none; }
    small { color:var(--text-2); }
    a { color:var(--accent); }
    .footer { margin-top:16px; }
    @media (max-width:760px) { main{padding:16px}.cards,.preview-grid{grid-template-columns:1fr}.cards section{min-height:180px} }
  </style>
</head>
<body>
  <main>
    <h1>DLSS 5 图片增强</h1>
    <p>使用本机 NVIDIA 显卡和独立安装的 Visual Enhancer CLI。实验性图片效果不等同于游戏内 3D 引导渲染。</p>
    <div class="bar">
      <button id="runtime">选择 VE_CLI.exe</button>
      <button class="ghost" id="check">检测设备</button>
      <span id="gpu">检测中…</span>
    </div>
    <div class="cards">
      <section>
        <h2>输入图片</h2>
        <p id="filename">尚未导入图片</p>
        <button id="choose">导入 PNG / JPG / WEBP</button>
        <div class="settings">
          <label>处理模式
            <select id="mode">
              <option value="standard">基础增强</option>
              <option value="light-material">光影材质增强</option>
            </select>
          </label>
          <label>增强风格
            <select id="style">
              <option value="natural">自然</option>
              <option value="default">默认</option>
              <option value="cinematic">电影感</option>
            </select>
          </label>
          <label>增强强度 <span id="strength-value">1.0</span>
            <input id="strength" type="range" min="0" max="2" step="0.1" value="1">
          </label>
        </div>
        <div class="effect-controls" id="effect-controls" hidden>
          <div class="settings">
            <label>阴影层次 <span id="shadows-value">45%</span><input id="shadows" type="range" min="0" max="100" step="1" value="45"></label>
            <label>光照层次 <span id="lighting-value">42%</span><input id="lighting" type="range" min="0" max="100" step="1" value="42"></label>
            <label>材质细节 <span id="texture-value">38%</span><input id="texture" type="range" min="0" max="100" step="1" value="38"></label>
            <label>已有反射 <span id="reflections-value">32%</span><input id="reflections" type="range" min="0" max="100" step="1" value="32"></label>
          </div>
          <small>只增强图片中已有的明暗和高光，不生成真实的新投影或镜面内容。</small>
        </div>
        <p><small>默认自然风格、强度 1.0；在 RTX 4060 上不自动高倍放大。</small></p>
        <button id="render" disabled>开始增强</button>
      </section>
      <section>
        <h2>增强结果</h2>
        <div class="status" id="status">等待图片</div>
        <div class="preview-grid" id="preview-grid" hidden>
          <figure id="before-figure" hidden><figcaption>基础增强</figcaption><img id="before" alt="基础增强结果"></figure>
          <figure><figcaption id="after-label">增强结果</figcaption><img id="preview" alt="最终增强结果"></figure>
        </div>
        <button class="ghost" id="download" hidden>下载最终图片</button>
      </section>
    </div>
    <p class="footer"><small>运行库需单独安装：<a href="https://github.com/Merserk/dlss5-visual-enhancer" target="_blank">Visual Enhancer</a>。HIOS 安装包不包含第三方运行库。</small></p>
  </main>
  <script src="../effects/light-material.js"></script>
  <script>
    const protocol = 'hios-plugin-app/v1', pluginId = 'dlss5-image', appId = 'dlss5-image';
    const pending = new Map();
    const $ = (id) => document.getElementById(id);
    let token = '', configured = false, busy = false, lastOutput = null;

    function post(type, payload = {}) { parent.postMessage({ protocol, pluginId, appId, type, payload }, '*'); }
    function request(action, extra = {}) {
      const requestId = crypto.randomUUID();
      post('dlss5-image-request', { requestId, action, ...extra });
      return new Promise((resolve, reject) => pending.set(requestId, { resolve, reject }));
    }
    function applyTheme(theme) {
      if (!theme || typeof theme !== 'object') return;
      document.documentElement.dataset.theme = theme.mode === 'dark' ? 'dark' : 'light';
      const names = { background:'--bg', surface:'--surface', muted:'--muted', control:'--control', text:'--text', textSecondary:'--text-2', border:'--border', accent:'--accent' };
      const tokens = theme.tokens && typeof theme.tokens === 'object' ? theme.tokens : {};
      for (const [key, css] of Object.entries(names)) if (typeof tokens[key] === 'string' && tokens[key]) document.documentElement.style.setProperty(css, tokens[key]);
    }
    const effectKeys = Object.keys(DlssLightMaterial.DEFAULTS);
    function settings() {
      return { mode:$('mode').value, style:$('style').value, strength:Number($('strength').value),
        ...Object.fromEntries(effectKeys.map((key) => [key, Number($(key).value)])) };
    }
    function saveSettings() {
      const value = settings();
      $('strength-value').textContent = value.strength.toFixed(1);
      $('effect-controls').hidden = value.mode !== 'light-material';
      for (const key of effectKeys) $(`${key}-value`).textContent = `${value[key]}%`;
      post('state', { state:value });
    }
    $('mode').addEventListener('change', saveSettings);
    $('style').addEventListener('change', saveSettings);
    $('strength').addEventListener('input', saveSettings);
    for (const key of effectKeys) $(key).addEventListener('input', saveSettings);
    function message(text) { $('status').textContent = text; }
    function update() { $('render').disabled = !token || !configured || busy; }
    async function check() {
      try {
        const state = await request('status');
        configured = Boolean(state.configured && state.compatible);
        $('gpu').textContent = state.gpu
          ? `${state.gpu} · 驱动 ${state.driver} · ${state.memoryMiB} MiB${configured ? ' · GPU 已兼容' : state.configured ? ' · GPU 不兼容' : ' · 尚未配置运行库'}`
          : '未检测到 NVIDIA GPU';
        if (state.cliError) message(`运行库设备检测失败：${state.cliError}`);
        update();
      } catch (error) { message(String(error.message || error)); }
    }
    window.addEventListener('message', (event) => {
      if (event.source !== parent || event.data?.protocol !== protocol) return;
      const { type, payload = {} } = event.data;
      if (type === 'init') {
        applyTheme(payload.theme);
        if (['standard','light-material'].includes(payload.state?.mode)) $('mode').value = payload.state.mode;
        if (['natural','default','cinematic'].includes(payload.state?.style)) $('style').value = payload.state.style;
        if (Number.isFinite(Number(payload.state?.strength))) $('strength').value = String(Math.max(0, Math.min(2, Number(payload.state.strength))));
        const effect = DlssLightMaterial.settings(payload.state);
        for (const key of effectKeys) $(key).value = String(effect[key]);
        saveSettings();
        void check();
      }
      if (type === 'theme') applyTheme(payload.theme);
      if (type === 'dlss5-image-result') {
        const item = pending.get(payload.requestId);
        if (!item) return;
        pending.delete(payload.requestId);
        payload.error ? item.reject(new Error(payload.error)) : item.resolve(payload.result);
      }
    });
    $('check').onclick = check;
    $('runtime').onclick = async () => { try { await request('choose-runtime'); await check(); } catch (error) { message(String(error.message || error)); } };
    $('choose').onclick = async () => {
      try {
        const result = await request('choose-image');
        if (!result) return;
        token = result.token;
        $('filename').textContent = result.name;
        message('图片已就绪'); update();
      } catch (error) { message(String(error.message || error)); }
    };
    $('download').onclick = () => {
      if (!lastOutput) return;
      const link = document.createElement('a');
      link.href = lastOutput.source;
      link.download = lastOutput.name;
      document.body.append(link);
      link.click();
      link.remove();
    };
    $('render').onclick = async () => {
      busy = true; lastOutput = null;
      $('preview-grid').hidden = true;
      $('download').hidden = true;
      update(); message('正在本机增强图片，请稍候…');
      try {
        const selected = settings();
        const result = await request('render', { token, style:selected.style, strength:selected.strength });
        token = '';
        $('filename').textContent = '处理完成，可继续导入图片';
        $('before').src = result.source;
        $('before-figure').hidden = selected.mode !== 'light-material';
        $('preview-grid').hidden = false;
        $('preview').src = result.source;
        $('after-label').textContent = selected.mode === 'light-material' ? '正在处理光影材质…' : '增强结果';
        let final = { source:result.source, name:result.name, mime:'image/png' };
        if (selected.mode === 'light-material') {
          message('神经增强完成，正在处理阴影、光照与材质…');
          final = await DlssLightMaterial.enhanceSource(result.source, selected);
          $('preview').src = final.source;
          $('after-label').textContent = '光影材质增强';
          message('处理完成。基础图已保存到 HIOS 素材库；最终图片可在下方下载。');
        } else message(`已完成，结果保存到 HIOS 素材库：${result.name}`);
        lastOutput = final;
        $('download').hidden = false;
        post('output', { output: { kind:'image', source:final.source, name:final.name, mime:final.mime } });
      } catch (error) {
        token = '';
        $('filename').textContent = '请重新导入图片';
        message(`${String(error.message || error)}${$('preview-grid').hidden ? '' : '。基础增强图已保存，可切换基础模式重试。'}`);
      } finally { busy = false; update(); }
    };
    post('ready');
  </script>
</body>
</html>
