<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静态网页</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:42px 1fr 24px}.bar{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.bar button,.bar select{height:29px;border:1px solid #cbd6df;border-radius:7px;background:#fff;color:#334155;font-size:11px}.bar button{padding:0 10px;cursor:pointer}.bar button.primary{color:#fff;background:#1688f5;border-color:#1688f5}.bar button:disabled{opacity:.45}.address{min-width:0;flex:1;overflow:hidden;padding:7px 9px;color:#64748b;background:#edf2f6;border-radius:7px;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;overflow:hidden;background:#dbe3ea}.stage iframe{width:100%;height:100%;border:0;background:#fff}.empty,.error,.loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;padding:30px;text-align:center}.empty strong{font-size:15px}.empty span,.error span{max-width:430px;color:#64748b;font-size:11px;line-height:1.6}.empty button,.error button{height:32px;padding:0 13px;color:#fff;background:#1688f5;border:0;border-radius:8px}.loading{background:rgba(237,242,246,.9)}.loading i{width:24px;height:24px;border:3px solid #bedcff;border-top-color:#1688f5;border-radius:50%;animation:spin .8s linear infinite}.error{color:#c84f60;background:#fff5f6}.hidden{display:none!important}footer{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:#8290a0;background:#f8fafc;border-top:1px solid #cbd6df;font-size:9px}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><header class="bar"><button id="choose" class="primary">选择目录</button><div id="address" class="address">尚未选择静态网页目录</div><select id="entries" class="hidden" aria-label="入口文件"></select><button id="reload" disabled>刷新</button></header><main class="stage"><iframe id="frame" class="hidden" title="本地静态网页" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock"></iframe><div id="empty" class="empty"><strong>运行本地静态网页</strong><span>插件通过主程序开放的通用目录接口选择文件夹，自动识别 index.html 和其他 HTML 入口。</span><button id="emptyChoose">选择静态网页目录</button></div><div id="loading" class="loading hidden"><i></i><strong>正在运行静态网页…</strong></div><div id="error" class="error hidden"><strong>运行失败</strong><span id="errorText"></span><button id="retry">重新选择目录</button></div></main><footer><span id="entry">未选择入口</span><span id="status">等待目录</span></footer><script>
(()=>{const P='hios-plugin-node/v1',id=crypto.randomUUID(),$=s=>document.getElementById(s),frame=$('frame'),empty=$('empty'),loading=$('loading'),error=$('error'),entries=$('entries');let nodeId='',pluginId='static-site-runner',site=null,restored=false;const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const theme=t=>{if(!t?.tokens)return;const x=t.tokens;document.body.style.background=x.background;document.body.style.color=x.text};const showError=m=>{loading.classList.add('hidden');error.classList.remove('hidden');$('errorText').textContent=m;$('status').textContent='运行失败'};const apply=s=>{site=s;post('state',{state:{site:{name:s.name,directory:s.directory,entry:s.entry}}});$('address').textContent=s.directory||s.name;$('entry').textContent=s.entry||'index.html';$('status').textContent='本地运行中';empty.classList.add('hidden');error.classList.add('hidden');loading.classList.remove('hidden');frame.classList.remove('hidden');frame.src=s.url+(s.url.includes('?')?'&':'?')+'v='+Date.now();$('reload').disabled=false;entries.innerHTML='';(s.entries||[]).forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;o.selected=e===s.entry;entries.append(o)});entries.classList.toggle('hidden',(s.entries||[]).length<2)};const choose=()=>post('request-directory',{requestId:id});$('choose').onclick=choose;$('emptyChoose').onclick=choose;$('retry').onclick=choose;$('reload').onclick=()=>site&&apply(site);entries.onchange=()=>site&&post('request-directory',{requestId:id,directory:site.directory,entry:entries.value});frame.onload=()=>{loading.classList.add('hidden');$('status').textContent='本地运行中'};addEventListener('message',e=>{const m=e.data;if(!m||m.protocol!==P)return;if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;theme(m.payload?.theme);const saved=m.payload?.state?.site;if(saved?.directory&&!restored){restored=true;post('request-directory',{requestId:id,directory:saved.directory,entry:saved.entry})}post('loaded',{ready:true})}if(m.type==='directory-result'&&m.payload?.requestId===id){if(m.payload.error)showError(m.payload.error);else if(m.payload.site)apply(m.payload.site)}});post('ready',{version:'0.2.0'})})();
</script></body></html>
