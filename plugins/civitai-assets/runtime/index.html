<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civitai 素材库</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:48px 24px 1fr}.toolbar{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.brand{width:28px;height:28px;display:grid;place-items:center;color:#fff;background:#111318;border-radius:8px;font-weight:800}.search{min-width:0;flex:1;height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#253143}.toolbar select,.toolbar button{height:31px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#425166;font-size:10px}.toolbar button{padding:0 11px;cursor:pointer}.toolbar button.primary{color:#fff;background:#1688f5;border-color:#1688f5}.status{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:#7b8796;background:#f8fafc;border-bottom:1px solid #dbe3ea;font-size:9px}.grid{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));align-content:start;gap:8px;padding:8px}.card{min-width:0;overflow:hidden;padding:0;background:#fff;border:1px solid #dbe3ea;border-radius:10px;cursor:pointer;text-align:left;transition:.16s}.card:hover{transform:translateY(-1px);border-color:#83bff8;box-shadow:0 8px 20px #26384c18}.card img{width:100%;height:150px;display:block;object-fit:cover;background:#dbe3ea}.card span{display:block;overflow:hidden;padding:7px 8px;color:#526074;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;min-height:260px;display:grid;place-content:center;justify-items:center;gap:8px;color:#7b8796;text-align:center}.empty strong{color:#334155;font-size:13px}.empty i{width:24px;height:24px;border:3px solid #bddcff;border-top-color:#1688f5;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><header class="toolbar"><span class="brand">C</span><input id="query" class="search" placeholder="搜索模型、风格或关键词"><select id="sort"><option value="Most Reactions">热门</option><option value="Newest">最新</option><option value="Most Comments">评论最多</option></select><button id="search" class="primary">搜索</button><button id="more">下一页</button></header><div class="status"><span id="message">输入关键词或直接浏览热门图片</span><span id="page">第 1 页</span></div><main id="grid" class="grid"><div class="empty"><strong>Civitai 独立素材插件</strong><span>点击搜索开始载入公开图片素材</span></div></main><script>
(()=>{const P='hios-plugin-node/v1',$=s=>document.getElementById(s),grid=$('grid');let nodeId='',pluginId='civitai-assets',page=1,loading=false,lastInput='';const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const status=s=>$('message').textContent=s;const source=i=>i?.url||i?.meta?.url||'';const load=async(reset=true)=>{if(loading)return;loading=true;if(reset)page=1;grid.innerHTML='<div class="empty"><i></i><strong>正在载入 Civitai…</strong></div>';status('正在请求 Civitai API…');const q=$('query').value.trim(),sort=$('sort').value;try{const u=new URL('https://civitai.com/api/v1/images');u.searchParams.set('limit','30');u.searchParams.set('page',String(page));u.searchParams.set('sort',sort);u.searchParams.set('period','AllTime');u.searchParams.set('nsfw','None');if(q)u.searchParams.set('query',q);const r=await fetch(u,{headers:{accept:'application/json'}});if(!r.ok)throw Error('Civitai API '+r.status);const j=await r.json(),items=(j.items||[]).filter(i=>source(i));grid.innerHTML='';if(!items.length)grid.innerHTML='<div class="empty"><strong>没有找到图片</strong><span>尝试更换关键词或排序方式</span></div>';items.forEach(i=>{const b=document.createElement('button');b.className='card';const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';img.src=source(i);const s=document.createElement('span');s.textContent=(i.username||i.modelName||'Civitai')+' · '+(i.width||'?')+'×'+(i.height||'?');b.append(img,s);b.onclick=()=>{const url=source(i);post('output',{kind:'image',portId:'image',source:url,url,name:`civitai-${i.id||Date.now()}.jpg`,width:i.width,height:i.height,metadata:{id:i.id,username:i.username,nsfw:i.nsfw}});status('已输出选中图片，可连接到其他画布节点')};grid.append(b)});$('page').textContent=`第 ${page} 页`;status(`已载入 ${items.length} 张图片`);post('state',{state:{query:q,page,sort}})}catch(e){grid.innerHTML=`<div class="empty"><strong>载入失败</strong><span>${String(e.message||e)}</span></div>`;status('请求失败，请稍后重试')}finally{loading=false}};$('search').onclick=()=>load(true);$('more').onclick=()=>{page+=1;load(false)};$('query').onkeydown=e=>e.key==='Enter'&&load(true);addEventListener('message',e=>{const m=e.data;if(!m||m.protocol!==P)return;if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;const state=m.payload?.state||{},input=String(m.payload?.inputs?.query||'');$('query').value=input||state.query||'';$('sort').value=state.sort||'Most Reactions';page=Number(state.page)||1;post('loaded',{ready:true});const signature=$('query').value+'|'+$('sort').value;if(signature!==lastInput){lastInput=signature;load(true)}}if(m.type==='run')load(true)});post('ready',{version:'0.3.0'})})();
</script></body></html>
