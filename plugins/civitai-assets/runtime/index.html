<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civitai 素材库</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:45px 25px minmax(0,1fr) 42px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.brand{width:31px;height:31px;display:grid;place-items:center;flex:none;color:#fff;background:#111827;border-radius:8px;font-weight:800}.search{min-width:0;flex:1;height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff}.toolbar select,.toolbar button{height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#475569}.toolbar .primary,.footer button{color:#fff;background:#1686f7;border-color:#1686f7}.settings-trigger{width:32px;padding:0!important;font-size:16px}.status{display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:#748193;background:#f8fafc;border-bottom:1px solid #dbe3ea;font-size:9px}.grid{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:7px;padding:8px;overflow:auto}.card{position:relative;min-width:0;padding:0;overflow:hidden;background:#dfe6ec;border:2px solid transparent;border-radius:9px;aspect-ratio:1.18;cursor:pointer}.card:hover{border-color:#83bfff}.card.selected{border-color:#1686f7;box-shadow:0 0 0 2px rgba(22,134,247,.16)}.card img{width:100%;height:100%;display:block;object-fit:contain;background:#e7edf2}.card span{position:absolute;right:0;bottom:0;left:0;padding:5px 6px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.76));font-size:8px;text-align:left}.card.selected:after{position:absolute;top:6px;right:6px;content:'✓';width:20px;height:20px;display:grid;place-items:center;color:#fff;background:#1686f7;border-radius:50%;font-size:11px}.empty{grid-column:1/-1;min-height:220px;display:grid;place-content:center;justify-items:center;gap:7px;color:#758294;text-align:center}.empty i{width:22px;height:22px;border:2px solid #b8c5d0;border-top-color:#1686f7;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:6px 8px;background:#f8fafc;border-top:1px solid #cbd6df}.footer span{min-width:0;margin-right:auto;overflow:hidden;color:#6c7888;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.footer button{height:30px;padding:0 13px;border:1px solid;border-radius:8px;font-weight:700}.footer button:disabled{opacity:.45}.settings{position:absolute;z-index:20;top:43px;right:8px;width:min(360px,calc(100% - 16px));display:none;padding:10px;background:rgba(248,250,252,.98);border:1px solid #cbd6df;border-radius:10px;box-shadow:0 16px 40px rgba(25,38,53,.25)}.settings.open{display:grid;gap:8px}.settings label{display:grid;gap:4px;color:#647184;font-size:9px}.settings input{height:31px;padding:0 9px;border:1px solid #cbd6df;border-radius:7px;background:#fff}.settings small{color:#84909f;font-size:8px;line-height:1.45}.settings-actions{display:flex;justify-content:flex-end;gap:7px}.settings-actions button{height:30px;padding:0 12px;border:1px solid #cbd6df;border-radius:7px;background:#fff}.settings-actions .save{color:#fff;background:#1686f7;border-color:#1686f7}.context{position:fixed;z-index:30;display:none;padding:5px;background:#fff;border:1px solid #cbd6df;border-radius:9px;box-shadow:0 12px 30px rgba(20,30,42,.25)}.context.open{display:block}.context button{height:30px;padding:0 10px;color:#253143;background:transparent;border:0;border-radius:6px}.context button:hover{background:#eaf3fc}.load-more{grid-column:1/-1;width:100%;height:38px;margin:6px 0 2px;color:#1686f7;background:#f7fbff;border:1px solid #a9d2fb;border-radius:9px;font-weight:700;cursor:pointer}.load-more:hover{background:#eaf4ff}.load-more:disabled{color:#8b99a8;background:#f3f6f8;border-color:#d6dfe6;cursor:default}
</style></head><body>
<header class="toolbar"><span class="brand">C</span><input id="query" class="search" placeholder="搜索模型、风格或关键词"><select id="sort"><option value="Most Reactions">热门</option><option value="Newest">最新</option><option value="Most Comments">评论最多</option></select><button id="search" class="primary">搜索</button><button id="settingsTrigger" class="settings-trigger" title="API 与代理设置">⚙</button></header>
<div class="status"><span id="message">点击图片进行选择，双击或使用右下角按钮输出原图</span><span id="page">第 1 页</span></div>
<main id="grid" class="grid"><div class="empty"><strong>Civitai 独立素材插件</strong><span>正在载入公开图片素材</span></div></main>
<footer class="footer"><span id="selectedLabel">尚未选择图片</span><button id="outputSelected" disabled>输出所选原图到画布</button></footer>
<section id="settings" class="settings"><label>API 地址<input id="apiBase" placeholder="https://civitai.com/api/v1/images"></label><label>API Key<input id="apiKey" type="password" placeholder="可选，用于访问账号允许的更多内容"></label><label>网络代理<input id="proxy" placeholder="例如 http://127.0.0.1:7890"></label><small>代理由 HIOS 通用插件网络接口应用；API Key 仅保存在本机插件隔离存储中。</small><div class="settings-actions"><button id="clearSettings">恢复默认</button><button id="saveSettings" class="save">保存并重新载入</button></div></section>
<div id="context" class="context"><button id="contextOutput">保存原图到画布</button></div>
<script>
(() => {
  'use strict';
  const P = 'hios-plugin-node/v1';
  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const pending = new Map();
  let nodeId = '', pluginId = 'civitai-assets', page = 1, loading = false, hasMore = true;
  let nextCursor = '', nextPageUrl = '', activeModelId = 0, activeModelName = '', lastInput = '';
  let items = [], selected = null, contextItem = null;

  const post = (type, payload = {}) => parent.postMessage({ protocol: P, nodeId, pluginId, type, payload }, '*');
  const status = (value) => { $('message').textContent = value; };
  const settings = () => ({
    apiBase: localStorage.getItem('civitai.apiBase') || 'https://civitai.com/api/v1/images',
    apiKey: localStorage.getItem('civitai.apiKey') || '',
    proxy: localStorage.getItem('civitai.proxy') || '',
  });
  const endpoints = (value) => {
    const raw = String(value || '').trim().replace(/\/+$/, '') || 'https://civitai.com/api/v1/images';
    if (/\/images$/i.test(raw)) return { images: raw, models: raw.replace(/\/images$/i, '/models') };
    if (/\/api\/v1$/i.test(raw)) return { images: raw + '/images', models: raw + '/models' };
    return { images: raw + '/api/v1/images', models: raw + '/api/v1/models' };
  };
  const request = (payload) => new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    pending.set(requestId, { resolve, reject });
    post('network-request', { requestId, ...payload });
    setTimeout(() => { if (pending.delete(requestId)) reject(Error('网络请求超时')); }, 45000);
  });
  const requestJson = async (url, config) => {
    const headers = { accept: 'application/json' };
    if (config.apiKey) headers.Authorization = 'Bearer ' + config.apiKey;
    const response = await request({ url: url.toString(), headers, proxy: config.proxy });
    if (!response?.ok) throw Error('Civitai API ' + (response?.status || '请求失败'));
    return JSON.parse(response.body || '{}');
  };
  const source = (item) => item?.url || item?.meta?.url || '';

  const select = (item) => {
    selected = item;
    document.querySelectorAll('.card').forEach((card) => card.classList.toggle('selected', card.dataset.id === String(item.id)));
    $('selectedLabel').textContent = '已选择：' + (item.username || item.modelName || 'Civitai') + ' · ' + (item.width || '?') + '×' + (item.height || '?');
    $('outputSelected').disabled = false;
    post('state', { state: { query: $('query').value.trim(), page, sort: $('sort').value, selectedId: item.id } });
  };

  const emit = (item, addToCanvas = true) => {
    if (!item) return;
    const url = source(item);
    post('output', {
      kind: 'image', portId: 'image', source: url, url,
      name: 'civitai-' + (item.id || Date.now()) + '.jpg',
      width: item.width, height: item.height,
      metadata: { id: item.id, username: item.username, nsfw: item.nsfwLevel || item.nsfw, addToCanvas },
    });
    status(addToCanvas ? '已将所选原图输出到画布' : '已输出选中图片');
  };

  const render = () => {
    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty"><strong>没有找到图片</strong><span>尝试更换关键词、API Key 或内容设置</span></div>';
      return;
    }
    items.forEach((item) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.id = String(item.id);
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.src = source(item);
      const copy = document.createElement('span');
      copy.textContent = (item.username || item.modelName || activeModelName || 'Civitai') + ' · ' + (item.width || '?') + '×' + (item.height || '?');
      card.append(img, copy);
      card.onclick = () => select(item);
      card.ondblclick = () => { select(item); emit(item, true); };
      card.oncontextmenu = (event) => {
        event.preventDefault();
        select(item);
        contextItem = item;
        const menu = $('context');
        menu.style.left = Math.min(event.clientX, innerWidth - 150) + 'px';
        menu.style.top = Math.min(event.clientY, innerHeight - 45) + 'px';
        menu.classList.add('open');
      };
      grid.append(card);
    });
    const more = document.createElement('button');
    more.id = 'loadMore';
    more.className = 'load-more';
    more.disabled = !hasMore;
    more.textContent = hasMore ? '加载更多' : '没有更多了';
    more.onclick = () => load(false);
    grid.append(more);
    if (selected) select(selected);
  };

  const buildImageUrl = (endpoint, append) => {
    if (append && nextPageUrl && !nextCursor) {
      const next = new URL(nextPageUrl, endpoint);
      // Keep every appended batch at 30 items, even if the API-generated
      // nextPage URL contains a different page size.
      next.searchParams.set('limit', '30');
      return next;
    }
    const url = new URL(endpoint);
    url.searchParams.set('limit', '30');
    url.searchParams.set('sort', $('sort').value);
    url.searchParams.set('period', 'AllTime');
    url.searchParams.set('nsfw', 'None');
    url.searchParams.set('withMeta', 'true');
    if (activeModelId) url.searchParams.set('modelId', String(activeModelId));
    if (append && nextCursor) url.searchParams.set('cursor', nextCursor);
    return url;
  };

  const resolveModels = async (query, config, api) => {
    if (!query) return [];
    const url = new URL(api.models);
    url.searchParams.set('limit', '8');
    url.searchParams.set('query', query);
    url.searchParams.set('sort', 'Highest Rated');
    url.searchParams.set('period', 'AllTime');
    const json = await requestJson(url, config);
    return (json.items || []).filter((item) => Number(item.id || 0) > 0).slice(0, 5);
  };

  const load = async (reset = true) => {
    if (loading) return;
    loading = true;
    const existingButton = $('loadMore');
    if (reset) {
      page = 1; nextCursor = ''; nextPageUrl = ''; activeModelId = 0; activeModelName = '';
      items = []; selected = null; $('outputSelected').disabled = true; $('selectedLabel').textContent = '尚未选择图片';
      grid.innerHTML = '<div class="empty"><i></i><strong>正在载入 Civitai…</strong></div>';
      status('正在通过插件网络接口请求 Civitai API…');
    } else {
      if (existingButton) { existingButton.disabled = true; existingButton.textContent = '正在加载更多…'; }
      status('正在加载第 ' + (page + 1) + ' 批图片…');
    }

    try {
      const config = settings();
      const api = endpoints(config.apiBase);
      const query = $('query').value.trim();
      let json = null;

      if (reset && query) {
        const candidates = await resolveModels(query, config, api);
        if (!candidates.length) {
          hasMore = false; render(); $('page').textContent = '没有搜索结果';
          status('没有找到与“' + query + '”匹配的 Civitai 模型');
          return;
        }
        for (const candidate of candidates) {
          activeModelId = Number(candidate.id);
          activeModelName = String(candidate.name || '');
          const candidateJson = await requestJson(buildImageUrl(api.images, false), config);
          json = candidateJson;
          if ((candidateJson.items || []).some((item) => source(item))) break;
        }
      } else {
        json = await requestJson(buildImageUrl(api.images, !reset), config);
      }

      const incoming = (json?.items || []).filter((item) => source(item)).map((item) => ({ ...item, modelName: item.modelName || activeModelName }));
      const seen = new Set(items.map((item) => String(item.id || source(item))));
      items = reset ? incoming : [...items, ...incoming.filter((item) => !seen.has(String(item.id || source(item))))];
      if (!reset) page += 1;
      nextCursor = String(json?.metadata?.nextCursor || json?.metadata?.next_cursor || '');
      nextPageUrl = String(json?.metadata?.nextPage || json?.metadata?.next_page || '');
      hasMore = Boolean(nextCursor || nextPageUrl);
      selected = items.find((item) => item.id === selected?.id) || null;
      render();
      $('page').textContent = '已加载 ' + items.length + ' 张 · ' + page + ' 批';
      const sourceName = query ? ('“' + query + '” · ' + (activeModelName || activeModelId)) : '公开图库';
      status(hasMore ? sourceName + '：已载入 ' + items.length + ' 张，可继续加载' : '已载入全部 ' + items.length + ' 张图片');
      post('state', { state: { query, page, sort: $('sort').value } });
    } catch (error) {
      if (reset) grid.innerHTML = '<div class="empty"><strong>载入失败</strong><span>' + String(error.message || error) + '</span></div>';
      else if (existingButton) { existingButton.disabled = false; existingButton.textContent = '加载失败，点击重试'; }
      status('请求失败，请检查 API Key、代理或网络设置');
    } finally {
      loading = false;
    }
  };

  $('search').onclick = () => load(true);
  $('query').onkeydown = (event) => { if (event.key === 'Enter') load(true); };
  $('sort').onchange = () => load(true);
  $('outputSelected').onclick = () => emit(selected, true);
  $('contextOutput').onclick = () => { emit(contextItem, true); $('context').classList.remove('open'); };
  addEventListener('pointerdown', (event) => { if (!$('context').contains(event.target)) $('context').classList.remove('open'); });
  $('settingsTrigger').onclick = () => $('settings').classList.toggle('open');

  const hydrateSettings = () => {
    const config = settings();
    $('apiBase').value = config.apiBase; $('apiKey').value = config.apiKey; $('proxy').value = config.proxy;
  };
  $('saveSettings').onclick = () => {
    localStorage.setItem('civitai.apiBase', $('apiBase').value.trim());
    localStorage.setItem('civitai.apiKey', $('apiKey').value.trim());
    localStorage.setItem('civitai.proxy', $('proxy').value.trim());
    $('settings').classList.remove('open');
    load(true);
  };
  $('clearSettings').onclick = () => {
    ['civitai.apiBase', 'civitai.apiKey', 'civitai.proxy'].forEach((key) => localStorage.removeItem(key));
    hydrateSettings();
  };

  addEventListener('message', (event) => {
    const message = event.data;
    if (!message || message.protocol !== P) return;
    if (message.type === 'network-result') {
      const payload = message.payload || {};
      const job = pending.get(payload.requestId);
      if (job) { pending.delete(payload.requestId); payload.error ? job.reject(Error(payload.error)) : job.resolve(payload.result); }
      return;
    }
    if (message.type === 'init') {
      nodeId = message.nodeId || nodeId;
      pluginId = message.pluginId || pluginId;
      const state = message.payload?.state || {};
      const input = String(message.payload?.inputs?.query || '');
      $('query').value = input || state.query || '';
      $('sort').value = state.sort || 'Most Reactions';
      post('loaded', { ready: true });
      const signature = $('query').value + '|' + $('sort').value;
      if (signature !== lastInput) { lastInput = signature; load(true); }
    }
    if (message.type === 'run') selected ? emit(selected, false) : load(true);
  });

  hydrateSettings();
  post('ready', { version: '0.5.0' });
})();
</script>
</body></html>
