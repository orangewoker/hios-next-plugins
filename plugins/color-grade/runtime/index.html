<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调色 · HIOS</title><link rel="stylesheet" href="../shared/editor.css">
<!-- hios-ui:start --><link rel="stylesheet" href="../shared/hios-ui.css"><link rel="stylesheet" href="../shared/hios-adapter.css"><link rel="stylesheet" href="../shared/hios-glass.css"><script src="../shared/hios-ui.js" data-plugin-id="color-grade"></script><script src="../shared/hios-glass.js" data-ranges=""></script><!-- hios-ui:end -->
<link rel="stylesheet" href="../shared/glass.css">
</head><body data-mode="node"><main id="editor">
<header><div><strong>调色</strong><small>COLOR STUDIO · 本地处理</small></div><nav><button id="replaceImage">打开图片</button><button id="undo" title="撤销 Ctrl+Z">撤销</button><button id="redo" title="重做 Ctrl+Shift+Z">重做</button><button id="expand">放大编辑</button></nav></header>
<section class="workspace" data-no-node-drag><section class="viewer"><div class="stage"><canvas id="preview" aria-label="调色图片预览"></canvas><span id="toolHint"></span><div id="empty"><strong>从一张图片开始</strong><p>将图片连接到「调色」节点输入端</p><button id="openImage">打开图片</button></div></div><div class="view-tools"><button id="original" aria-pressed="false">按住看原图</button><button id="compare" aria-pressed="false">划线对比</button><label id="splitLabel" hidden>分界<input id="split" aria-label="对比分界" type="range" min="0" max="100" value="50"></label><button id="whitePick" title="点击灰白区域校正白平衡">白平衡取样</button><button id="zoomOut" aria-label="缩小图片">−</button><button id="zoomFit">适应</button><button id="zoomIn" aria-label="放大图片">＋</button><span id="dimensions">—</span></div></section>
<aside><section class="presets"><div class="row"><strong>预设</strong><button id="savePreset">另存预设</button></div><select id="preset" aria-label="选择预设"></select><div class="row subtle"><span id="presetHint">基于原图处理，不叠加滤镜</span><button id="presetLibrary">管理</button></div><label class="slider"><span>效果强度</span><input id="intensity" type="range" min="0" max="100" value="100"><output id="intensityValue">100</output></label></section><label class="auto-correct"><input id="adaptive" type="checkbox">自适应纠偏 <small>谨慎校正偏色与过艳</small></label><div id="modules"></div>
<details id="depth"><summary><strong>模拟景深</strong><span class="badge">本地深度</span><input id="enable-depth" type="checkbox" aria-label="启用模拟景深"></summary><div class="fields"><p class="note" id="depthStatus">首次启用自动分析深度，之后调整光圈不重复推理。</p><div class="row"><button id="focusPick">点击对焦</button><button id="depthView">查看深度</button></div><label class="slider"><span>虚拟光圈</span><input id="depth-aperture" type="range" min="1.4" max="16" step="0.1" value="2.8" aria-label="虚拟光圈"><output id="value-depth-aperture"></output></label><label class="slider"><span>虚化强度</span><input id="depth-strength" type="range" min="0" max="100" value="50" aria-label="虚化强度"><output id="value-depth-strength"></output></label><label class="slider"><span>清晰范围</span><input id="depth-range" type="range" min="0" max="50" value="12" aria-label="清晰范围"><output id="value-depth-range"></output></label><div class="row"><label><input id="depth-foreground" type="checkbox" checked>前景虚化</label><label><input id="depth-protect" type="checkbox" checked>主体边缘保护</label></div><div class="row"><button id="depthRetry">重新分析</button><button id="resetDepth">重置景深</button></div><p class="note">相对深度与虚拟光圈模拟，不恢复原图已模糊的细节。</p></div></details>
</aside></section><footer data-no-node-drag><span id="status" role="status" aria-live="polite">等待图片</span><button id="export" hidden>输出图片</button><small id="runHint">预览自动更新 · 点击节点运行按钮输出</small></footer></main>
<dialog data-no-node-drag id="presetDialog"><form method="dialog"><h3>保存调色预设</h3><label>名称<input id="presetName" maxlength="40" required placeholder="我的自然肤色"></label><p class="note">保存全部调色模块、开关和效果强度；不包含原图或景深。</p><div class="row"><button value="cancel" formnovalidate>取消</button><button id="confirmPreset" value="save">保存</button></div></form></dialog>
<dialog data-no-node-drag id="library"><h3>我的预设</h3><div id="customList"></div><p class="note" id="storageHint">同源插件实例共享预设；导出 JSON 可备份或迁移。</p><div class="row"><button id="importPresets">导入 JSON</button><button id="exportPresets">导出 JSON</button><button id="closeLibrary">关闭</button></div></dialog>
<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="presetFile" type="file" accept="application/json,.json" hidden>
<script type="module" src="../shared/editor.mjs"></script></body></html>
