<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海报编辑器</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div><span class="eyebrow">POSTER EDITOR</span><h1>海报编辑器</h1></div><div class="actions"><button id="importBtn">导入图片</button><button id="addTextBtn">添加文字</button><button class="primary" id="exportBtn">导出 PNG</button><input id="fileInput" type="file" accept="image/*" multiple hidden></div></header><main><aside class="left"><section><label>画布预设<select id="preset"><option value="1080x1350">小红书 4:5 · 1080×1350</option><option value="1080x1080">正方形 1:1 · 1080×1080</option><option value="1080x1920">短视频 9:16 · 1080×1920</option><option value="1920x1080">横版 16:9 · 1920×1080</option><option value="2480x3508">A4 · 300 DPI</option><option value="custom">自定义</option></select></label><div class="row"><label>宽度<input id="width" type="number" min="64" max="8000"></label><label>高度<input id="height" type="number" min="64" max="8000"></label></div><div class="row"><label>DPI<input id="dpi" type="number" min="1" max="1200"></label><label>背景色<input id="background" type="color" value="#ffffff"></label></div></section><section><h2>图层</h2><div id="layers" class="layers"></div></section></aside><section class="workspace"><div class="canvas-wrap"><canvas id="canvas"></canvas></div><div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitBtn">适合窗口</button></div></section><aside class="right"><section><h2>属性</h2><div id="emptyProps" class="muted">选择一个图层进行编辑</div><div id="props" hidden><label>名称<input id="layerName"></label><div class="row"><label>X<input id="layerX" type="number"></label><label>Y<input id="layerY" type="number"></label></div><div class="row"><label>宽度<input id="layerW" type="number" min="1"></label><label>高度<input id="layerH" type="number" min="1"></label></div><label>透明度<input id="layerOpacity" type="range" min="0" max="1" step="0.01"></label><label id="textColorRow">文字颜色<input id="textColor" type="color"></label><label id="fontSizeRow">字号<input id="fontSize" type="number" min="8" max="400"></label><button class="danger" id="deleteLayer">删除图层</button></div></section><section class="hint"><strong>快捷操作</strong><span>拖拽图层移动 · Delete 删除 · Ctrl/Cmd+S 保存状态</span></section></aside></main></div><script src="app.js"></script></body></html>
