<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breeze 语音合成</title><link rel="icon" href="../assets/icon.svg"><link rel="stylesheet" href="../shared/workshop.css"><link rel="stylesheet" href="./style.css"><!-- hios-ui:start --><link rel="stylesheet" href="../shared/hios-ui.css"><link rel="stylesheet" href="../shared/hios-adapter.css"><script src="../shared/hios-ui.js" data-plugin-id="breeze-tts"></script><!-- hios-ui:end -->
</head><body>
<main><div class="node-top"><img src="../assets/icon.svg" alt=""><div><strong>语音合成</strong><small>Breeze TTS 2 · Q8_0</small></div><span id="connection-label">未连接</span></div>
<label class="field"><span>合成模式</span><select id="mode" class="hios-control"><option value="design">音色设计</option><option value="clone">声音克隆</option><option value="direction">风格引导</option></select></label>
<label class="field"><span>朗读文本 <small id="input-hint">连线输入优先</small></span><textarea id="text" class="hios-control" rows="4" placeholder="输入文字，或连接上游文本节点" maxlength="20000"></textarea></label>
<div id="reference-fields" hidden><label class="field"><span>服务端音色</span><div class="inline"><select id="voice_id" class="hios-control"><option value="">使用参考音频</option></select><button id="refresh-voices" class="hios-control" title="刷新音色">↻</button></div></label><div id="reference-upload"><label class="field"><span>参考 WAV（或连接音频端口）</span><input id="reference" class="hios-control" type="file" accept=".wav,audio/wav"></label><label class="field"><span>参考转录</span><textarea id="ref_text" class="hios-control" rows="2"></textarea></label></div></div>
<label class="field" id="instruction-field"><span>声音 / 表达描述</span><textarea id="instruction" class="hios-control" rows="2">温柔、自然、清晰的中文旁白。</textarea></label>
<div class="two"><label class="field"><span>随机种子</span><input id="seed" class="hios-control" type="number" value="42" min="-1" max="2147483647"></label><label class="field"><span>指令强度</span><input id="cfg_scale" class="hios-control" type="number" value="1" min="1" max="5" step="0.1"></label></div>
<details><summary>高级生成参数</summary><div class="two" id="advanced"></div></details><details><summary>共享连接设置</summary><p>与应用共用连接，密钥不写入画布。模型下载、服务端口、局域网共享在应用的设置中管理。</p><button id="open-settings" class="hios-control" hidden>打开语音工坊设置</button><div id="node-connection-fields"><label class="field"><span>运行方式</span><select id="connection-mode" class="hios-control"><option value="local">本机服务</option><option value="remote">另一台电脑的服务</option></select></label><label class="field"><span>服务地址</span><input id="service-url" class="hios-control" type="url"></label><label class="field"><span>连接密钥</span><input id="access-key" class="hios-control" type="password" autocomplete="off"></label><button id="connect" class="hios-control">保存并测试连接</button></div></details>
<div class="run-area"><button id="run" class="hios-control hios-primary">生成语音</button><button id="cancel" class="hios-control" hidden>取消</button><span id="status" role="status">由画布运行按钮触发生成</span></div><audio id="player" controls hidden></audio><a id="download" hidden>下载 WAV ↓</a></main><script type="module" src="./node.js"></script></body></html>
