<style>
  :root{
    --bg:#121216; --card:#1c1c24; --card2:#23232e; --line:#33333f;

    --ok:#7ec98b; --warn:#e0a458; --bad:#e07070; --pink:#d98ca0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; font-size:15px;}
  .wrap{max-width:1280px; margin:0 auto; padding:18px 18px 60px;}
  header{display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:18px 4px 14px; border-bottom:1px solid var(--line);}
  header h1{font-size:22px; letter-spacing:1px; color:var(--gold2);}
  header h1 .ver{font-size:13px; color:var(--gold); border:1px solid var(--line);
    border-radius:6px; padding:2px 7px; margin-left:6px; letter-spacing:.5px;
    vertical-align:2px; font-weight:400; background:rgba(217,179,108,.10);}
  header .sub{width:100%; color:var(--sub); font-size:13px;}
  .notice{width:100%; font-size:12px; color:var(--sub);
    background:rgba(217,179,108,.08); border:1px solid rgba(217,179,108,.25);
    border-radius:8px; padding:7px 12px; line-height:1.6;}
  .tools{margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .mode{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .mode button{border:none; background:transparent; color:var(--sub); padding:8px 18px;
    cursor:pointer; font-size:14px;}
  .mode button.on{background:var(--gold); color:#241a05; font-weight:700;}
  .mode button.nsfw.on{background:var(--pink); color:#2a0d16;}
  .mode button.nsfw.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.4);}
  .restrict{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);
    border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; user-select:none;}
  .restrict input{accent-color:var(--gold); cursor:pointer;}
  .restrict.intl{accent-color:initial; border-color:#5b8def; color:#3a5fb0;}
  .restrict.intl input{accent-color:#5b8def;}
  .btn{border:1px solid var(--gold); background:transparent; color:var(--gold2);
    padding:8px 16px; border-radius:10px; cursor:pointer; font-size:14px;}
  .btn:hover{background:rgba(217,179,108,.12);}
  .btn.primary{background:var(--gold); color:#241a05; font-weight:700; border-color:var(--gold);}
  .btn.primary:hover{background:var(--gold2);}
  main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,430px); gap:18px; margin-top:18px;}
  @media (max-width:980px){ main{grid-template-columns:1fr;} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;}
  .sec-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .sec-actions{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .sec-head .t{font-weight:700; color:var(--gold2); letter-spacing:.5px;}
  .mini{border:1px solid var(--line); background:var(--card2); color:var(--sub);
    border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer;}
  .mini:hover{color:var(--gold2); border-color:var(--gold);}
  .fields{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:9px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field .lab{font-size:12px; color:var(--sub);}
  .field select{width:100%; background:var(--card2); color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:13px;
    appearance:auto;}
  .field select:focus{outline:1px solid var(--gold);}
  .fgroup{border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-top:8px;}
  .fgroup .gtitle{font-size:12px; color:var(--gold); margin-bottom:8px;}
  .hint{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.6;}
  .out-card{position:sticky; top:14px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px;}
  .out-card h2{font-size:16px; color:var(--gold2); margin-bottom:10px;}
  #promptBox{background:#0d0d12; border:1px solid var(--line); border-radius:10px;
    padding:14px; min-height:220px; max-height:430px; overflow:auto; line-height:1.9;
    white-space:pre-wrap; font-size:14px;}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .meta{font-size:12px; color:var(--sub); margin-top:10px; line-height:1.7;}
  .meta b{color:var(--gold2); font-weight:600;}
  #selfcheck{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .sc-line{font-size:13px; line-height:1.8; margin-bottom:6px;}
  .sc-detail{font-size:12px; color:var(--sub); max-height:240px; overflow:auto;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:none;}
  .ok{color:var(--ok);} .no{color:var(--bad);} .wa{color:var(--warn);}
  .tip{font-size:12px; color:var(--sub); margin-top:10px; line-height:1.7;
    background:rgba(126,201,139,.07); border:1px solid rgba(126,201,139,.2);
    border-radius:8px; padding:8px 12px;}
  .tip b{color:var(--ok);}
  .nsfw-note{display:none; margin-top:8px; font-size:12px; color:var(--pink);
    border:1px solid rgba(217,140,160,.35); border-radius:8px; padding:7px 12px;}
  .hidden{display:none !important;}
  details.sec{background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin-bottom:10px; overflow:hidden;}
  details.sec summary{cursor:pointer; padding:12px 16px; font-weight:700; color:var(--gold2);
    list-style:none; display:flex; align-items:center; justify-content:space-between;}
  details.sec summary::-webkit-details-marker{display:none;}
  details.sec summary .chev{color:var(--sub); font-size:12px; font-weight:400;}
  details.sec[open] summary{border-bottom:1px solid var(--line);}
  details.sec .body{padding:12px 16px 14px;}
  .dice{margin-left:8px;}
  .lock-btn{border:1px solid var(--line);background:var(--card2);color:var(--sub);
    border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;margin-left:5px;}
  .lock-btn.on{color:var(--gold);border-color:var(--gold);background:rgba(217,179,108,.12);}
  .field-head{display:flex;align-items:center;justify-content:space-between;}
</style>
