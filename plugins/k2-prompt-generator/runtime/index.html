<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K2 人像提示词</title>
  <link rel="stylesheet" href="style.css">
<!-- hios-ui:start --><link rel="stylesheet" href="../shared/hios-ui.css"><link rel="stylesheet" href="../shared/hios-adapter.css"><link rel="stylesheet" href="../shared/hios-glass.css"><script src="../shared/hios-ui.js" data-plugin-id="k2-prompt-generator"></script><script src="../shared/hios-glass.js" data-ranges=".sec input[type=range],.out-card input[type=range]"></script><!-- hios-ui:end -->
</head>
<body>
  <main class="node-shell">
    <header>
      <div>
        <strong>K2 人像提示词</strong>
        <span id="status">正在读取应用设置…</span>
      </div>
      <span id="mode" class="mode">未同步</span>
    </header>

    <section class="info-card">
      <div class="info-title">应用设置</div>
      <div id="summary" class="summary">请先打开应用，选择参数并生成提示词。</div>
      <div class="actions">
        <button id="openApp" class="secondary">打开应用设置</button>
        <button id="syncBtn" class="secondary">同步设置</button>
        <button id="randomBtn" class="secondary">应用随机</button>
        <button id="runBtn" class="primary plugin-run" aria-label="运行"><svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg><span>运行</span></button>
      </div>
    </section>

    <section class="result-card">
      <div class="result-title">
        <strong>输出预览</strong>
        <button id="copyBtn" class="secondary" disabled>复制</button>
      </div>
      <pre id="preview">等待应用生成提示词…</pre>
    </section>
  </main>
  <script src="node.js"></script>
</body>
</html>
