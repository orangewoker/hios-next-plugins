<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K2 人像提示词</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="node-shell">
    <header>
      <div>
        <strong>K2 人像提示词</strong>
        <span id="status">正在读取应用设置…</span>
      </div>
      <span id="mode" class="mode">未同步</span>
    </header>

    <section class="info-card">
      <div class="info-title">应用设置</div>
      <div id="summary" class="summary">请先打开应用，选择参数并生成提示词。</div>
      <div class="actions">
        <button id="openApp" class="secondary">打开应用设置</button>
        <button id="syncBtn" class="secondary">同步设置</button>
        <button id="runBtn" class="primary">运行并输出</button>
      </div>
    </section>

    <section class="result-card">
      <div class="result-title">
        <strong>输出预览</strong>
        <button id="copyBtn" class="secondary" disabled>复制</button>
      </div>
      <pre id="preview">等待应用生成提示词…</pre>
    </section>
  </main>
  <script src="node.js"></script>
</body>
</html>
