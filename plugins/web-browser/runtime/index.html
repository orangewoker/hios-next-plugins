<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页浏览器</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f4f6f9;color:#243044}body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.toolbar{display:flex;gap:7px;padding:9px;background:#fff;border-bottom:1px solid #dce3eb}.toolbar input{min-width:0;flex:1;height:34px;padding:0 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:inherit}.toolbar button,.actions button{height:34px;padding:0 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;cursor:pointer}.toolbar .primary,.actions .primary{color:#fff;background:#1688f5;border-color:#1688f5}.toolbar button:disabled,.actions button:disabled{opacity:.45;cursor:not-allowed}.status{display:flex;gap:8px;align-items:center;padding:6px 10px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:11px}.status span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{min-height:0;overflow:auto;padding:14px}.empty{height:100%;display:grid;place-content:center;gap:6px;text-align:center;color:#718096}.page{max-width:980px;margin:auto}.page h1{margin:0 0 6px;font-size:21px;line-height:1.3}.description{margin:0 0 14px;color:#65758b;font-size:12px;line-height:1.55}.text{padding:14px;background:#fff;border:1px solid #dbe3ec;border-radius:12px;white-space:pre-wrap;font-size:13px;line-height:1.75}.section-title{display:flex;align-items:center;justify-content:space-between;margin:17px 0 8px;font-size:12px}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.image{position:relative;min-height:100px;padding:0;overflow:hidden;border:2px solid transparent;border-radius:10px;background:#e8edf3;cursor:pointer}.image.selected{border-color:#1688f5;box-shadow:0 0 0 2px rgba(22,136,245,.15)}.image img{width:100%;height:120px;display:block;object-fit:cover}.image small{position:absolute;inset:auto 5px 5px;padding:2px 5px;color:#fff;background:rgba(0,0,0,.62);border-radius:5px;font-size:9px}.links{display:grid;gap:6px}.link{display:block;width:100%;padding:8px 10px;text-align:left;color:#1769b0;background:#fff;border:1px solid #dbe3ec;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #dce3eb}.actions span{min-width:0;margin-right:auto;color:#64748b;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;z-index:20;left:50%;bottom:58px;transform:translateX(-50%);padding:8px 12px;color:#fff;background:rgba(22,30,42,.92);border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(prefers-color-scheme:dark){html,body{background:#111827;color:#e5edf7}.toolbar,.actions{background:#182231;border-color:#2d3b4d}.toolbar input,.toolbar button,.actions button,.text,.link{color:#e5edf7;background:#202c3b;border-color:#344459}.status{color:#9fb0c4;background:#151f2c;border-color:#2d3b4d}.description,.actions span{color:#9fb0c4}.image{background:#202c3b}}
</style>
</head>
<body>
<header class="toolbar"><button id="back" title="返回上一个页面" disabled>←</button><input id="address" placeholder="输入网址或搜索词"><button id="go" class="primary">打开</button><button id="reload" disabled>刷新</button></header>
<div class="status"><span id="status">输入公开网页地址开始浏览</span></div>
<main id="content" class="content"><div class="empty"><strong>网页阅读器</strong><span>不执行远程脚本，适合读取文章、链接和图片素材。</span></div></main>
<footer class="actions"><span id="selection">尚未选择图片</span><button id="outputText" disabled>输出正文</button><button id="outputImage" class="primary" disabled>图片到画布</button></footer><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const P='hios-plugin-node/v1',$=id=>document.getElementById(id);let nodeId='',pluginId='web-browser',current=null,selected=null,lastInput='',history=[];const pending=new Map;
const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');
const request=payload=>new Promise((resolve,reject)=>{const requestId=crypto.randomUUID();pending.set(requestId,{resolve,reject});post('network-request',{requestId,...payload});setTimeout(()=>{if(pending.delete(requestId))reject(Error('网络请求超时'))},45000)});
const toast=text=>{const e=$('toast');e.textContent=text;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
const absolute=(value,base)=>{try{return new URL(value,base).href}catch{return''}};
const normalize=value=>{const text=String(value||'').trim();if(!text)return'';if(/^https?:\/\//i.test(text))return text;if(/^(?:localhost|127\.0\.0\.1)(?::\d+)?(?:\/|$)/i.test(text))return'https://'+text;if(/^[\w.-]+\.[a-z]{2,}(?::\d+)?(?:\/|$)/i.test(text))return'https://'+text;return'https://www.bing.com/search?q='+encodeURIComponent(text)};
const cleanText=value=>String(value||'').replace(/[\t\r]+/g,' ').replace(/ {2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
function parsePage(html,url){const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,noscript,template,svg,canvas,form,nav,footer,header,aside').forEach(e=>e.remove());const title=cleanText(doc.querySelector('meta[property="og:title"]')?.content||doc.title||url);const description=cleanText(doc.querySelector('meta[name="description"]')?.content||doc.querySelector('meta[property="og:description"]')?.content||'');const root=doc.querySelector('article,main,[role="main"]')||doc.body;const paragraphs=[...root.querySelectorAll('h1,h2,h3,p,li,blockquote')].map(e=>cleanText(e.textContent)).filter(t=>t.length>20);let text=paragraphs.join('\n\n');if(text.length<120)text=cleanText(root.textContent);text=text.slice(0,50000);const imageMap=new Map;const addImage=(raw,label='')=>{const src=absolute(raw,url);if(!/^https?:/i.test(src)||/logo|icon|avatar|sprite|favicon/i.test(src))return;if(!imageMap.has(src))imageMap.set(src,{source:src,title:cleanText(label)||title})};doc.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"]').forEach(e=>addImage(e.content,title));doc.querySelectorAll('img').forEach(img=>{addImage(img.getAttribute('src')||img.getAttribute('data-src')||'',img.alt);String(img.srcset||'').split(',').forEach(p=>addImage(p.trim().split(/\s+/)[0],img.alt))});const linkMap=new Map;doc.querySelectorAll('a[href]').forEach(a=>{const href=absolute(a.getAttribute('href'),url),label=cleanText(a.textContent||a.title);if(/^https?:/i.test(href)&&label&&label.length<180&&!linkMap.has(href))linkMap.set(href,{href,label})});return{url,title,description,text,images:[...imageMap.values()].slice(0,60),links:[...linkMap.values()].slice(0,80)}}
function render(page){current=page;selected=null;$('address').value=page.url;$('status').textContent=page.url;$('reload').disabled=false;$('outputText').disabled=!page.text;$('outputImage').disabled=true;$('selection').textContent=`${page.images.length} 张图片 · ${page.links.length} 个链接`;const main=$('content');main.replaceChildren();const wrap=document.createElement('article');wrap.className='page';const h=document.createElement('h1');h.textContent=page.title||page.url;wrap.append(h);if(page.description){const d=document.createElement('p');d.className='description';d.textContent=page.description;wrap.append(d)}if(page.text){const box=document.createElement('div');box.className='text';box.textContent=page.text;wrap.append(box)}if(page.images.length){const sh=document.createElement('div');sh.className='section-title';sh.innerHTML=`<strong>网页图片</strong><span>${page.images.length} 张</span>`;const grid=document.createElement('div');grid.className='images';page.images.forEach((item,index)=>{const b=document.createElement('button');b.className='image';b.type='button';const img=document.createElement('img');img.src=item.source;img.alt=item.title||'';img.loading='lazy';img.referrerPolicy='no-referrer';const n=document.createElement('small');n.textContent=String(index+1);b.append(img,n);b.onclick=()=>{selected=item;grid.querySelectorAll('.image').forEach(x=>x.classList.toggle('selected',x===b));$('selection').textContent=`已选择：${item.title||item.source}`;$('outputImage').disabled=false};grid.append(b)});wrap.append(sh,grid)}if(page.links.length){const sh=document.createElement('div');sh.className='section-title';sh.innerHTML=`<strong>页面链接</strong><span>${page.links.length} 个</span>`;const list=document.createElement('div');list.className='links';page.links.forEach(item=>{const b=document.createElement('button');b.className='link';b.type='button';b.textContent=item.label;b.title=item.href;b.onclick=()=>void load(item.href,true);list.append(b)});wrap.append(sh,list)}main.append(wrap)}
async function load(value,push=true){const url=normalize(value);if(!url)return;const previous=current?.url||'';$('status').textContent='正在读取网页…';$('go').disabled=true;try{const result=await request({url,method:'GET',headers:{accept:'text/html,application/xhtml+xml;q=0.9,*/*;q=0.7','user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}});if(!result?.ok)throw Error(`网页返回 ${result?.status||'未知状态'}`);const finalUrl=result.url||url;if(push&&previous&&previous!==finalUrl)history.push(previous);$('back').disabled=!history.length;render(parsePage(String(result.body||''),finalUrl));post('state',{state:{query:$('address').value,url:finalUrl,selectedImage:''}})}catch(error){$('status').textContent='读取失败：'+String(error.message||error);toast(String(error.message||error))}finally{$('go').disabled=false}}
function outputText(){if(!current?.text)return;post('output',{kind:'text',portId:'text',value:current.text,text:current.text,name:current.title||'网页正文',metadata:{url:current.url,title:current.title}});toast('网页正文已输出')}
function outputImage(){if(!selected)return;post('output',{kind:'image',portId:'image',source:selected.source,url:selected.source,name:(selected.title||'web-image')+'.jpg',metadata:{pageUrl:current?.url,title:selected.title,addToCanvas:true}});toast('图片已加入画布')}
$('go').onclick=()=>void load($('address').value,true);$('address').onkeydown=e=>e.key==='Enter'&&load($('address').value,true);$('reload').onclick=()=>current&&load(current.url,false);$('back').onclick=()=>{const url=history.pop();$('back').disabled=!history.length;if(url)void load(url,false)};$('outputText').onclick=outputText;$('outputImage').onclick=outputImage;
addEventListener('message',event=>{const m=event.data;if(!m||m.protocol!==P)return;if(m.type==='network-result'){const payload=m.payload||{},job=pending.get(payload.requestId);if(job){pending.delete(payload.requestId);payload.error?job.reject(Error(payload.error)):job.resolve(payload.result)}return}if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;const value=String(m.payload?.inputs?.query||m.payload?.state?.url||m.payload?.state?.query||'');if(value&&!current&&value!==lastInput){lastInput=value;$('address').value=value;void load(value,false)}post('loaded',{ready:true})}if(m.type==='run'){selected?outputImage():outputText()}});post('ready',{version:'0.1.0'});
})();
</script>
</body></html>
