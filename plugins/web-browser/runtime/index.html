<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>浏览器</title>
<link rel="stylesheet" href="../shared/hios-ui.css"><script src="../shared/hios-ui.js" data-plugin-id="web-browser"></script>
<style>html,body{height:100%;margin:0;background:var(--hios-background);color:var(--hios-text);font:13px system-ui}main{padding:24px}p{line-height:1.8}</style></head><body><main><strong>节点内真实浏览器</strong><p>请更新到 HIOS Next 3.4.7 或更高版本（Windows Tauri）。本版不再抓取或重排网页，不自动下载图片，也不打开独立窗口。</p><p>更新后在网页图片上悬停点击 ＋，或将图片拖至画布。无法确认原图时需要先打开网站的图片详情。</p></main><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='init')parent.postMessage({protocol:'hios-plugin-node/v1',pluginId:'web-browser',nodeId:e.data.nodeId,type:'loaded'},'*')});parent.postMessage({protocol:'hios-plugin-node/v1',pluginId:'web-browser',type:'ready'},'*')</script></body></html>
