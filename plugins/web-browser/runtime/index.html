<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>浏览器</title>
  <style>
    :root{color-scheme:dark;--bg:#12171d;--surface:#1b222a;--muted:#222b35;--control:#27313c;--text:#edf2f7;--text2:#b8c2cd;--text3:#7f8b98;--border:#34404c;--accent:#2f91ff;--accentSoft:rgba(47,145,255,.16);--positive:#45b979;--negative:#ef6873;--shadow:0 12px 34px rgba(0,0,0,.25)}
    :root[data-theme="light"]{color-scheme:light;--bg:#eef3f7;--surface:#fbfcfd;--muted:#e6edf3;--control:#e2eaf1;--text:#263242;--text2:#5f6c7a;--text3:#8995a2;--border:#cbd5df;--shadow:0 10px 28px rgba(42,58,74,.13)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font:11px/1.5 "Inter","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 9px;background:var(--surface);border-bottom:1px solid var(--border)}.nav-actions{display:flex;gap:4px}.icon{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:var(--control);color:var(--text2)}.icon:disabled{opacity:.35;cursor:default}.icon:hover:not(:disabled){color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}.address{display:flex;align-items:center;gap:6px;min-width:0;height:31px;padding:0 8px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}.address:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}.address span{color:var(--positive);font-size:10px}.address input{min-width:0;flex:1;border:0;outline:0;background:transparent}.go{height:29px;padding:0 11px;border:0;border-radius:8px;color:#fff;background:var(--accent);font-weight:700}.tabs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;background:var(--surface);border-bottom:1px solid var(--border)}.tabset{display:flex;gap:4px}.tab{height:27px;padding:0 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text3)}.tab.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--border));background:var(--accentSoft)}.page-meta{min-width:0;color:var(--text3);font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewport{position:relative;min-height:0;overflow:auto;background:var(--bg);scrollbar-color:var(--border) transparent}.loading{position:absolute;z-index:5;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;color:var(--text3);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(4px)}.loading[hidden]{display:none}.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.reader{max-width:820px;margin:0 auto;padding:18px 20px 60px}.reader-head{padding-bottom:14px;border-bottom:1px solid var(--border)}.reader-head h1{margin:0;font-size:20px;line-height:1.25}.reader-head p{margin:5px 0 0;color:var(--text3);font-size:9px}.reader-content{display:grid;gap:12px;margin-top:15px}.reader-block h2,.reader-block h3{margin:0 0 5px;font-size:14px}.reader-block p{margin:0;color:var(--text2);font-size:11px;line-height:1.75}.reader-block a{color:var(--accent);text-decoration:none}.reader-image{margin:3px 0;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.reader-image img{display:block;max-width:100%;max-height:420px;margin:auto;object-fit:contain;border-radius:7px}.reader-image figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;color:var(--text3);font-size:8px}.reader-image button{border:0;color:var(--accent);background:transparent}.empty{display:grid;place-content:center;justify-items:center;gap:7px;min-height:260px;padding:25px;color:var(--text3);text-align:center}.empty strong{color:var(--text2);font-size:13px}.empty span{max-width:360px;font-size:9px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;padding:10px}.card{position:relative;min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:var(--shadow)}.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft),var(--shadow)}.card-media{height:135px;display:grid;place-items:center;overflow:hidden;background:var(--muted)}.card-media img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:element}.card-body{padding:8px}.card-body strong,.card-body small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-body strong{font-size:9px}.card-body small{margin-top:2px;color:var(--text3);font-size:8px}.card-actions{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:7px}.card-actions button{height:27px;border:1px solid var(--border);border-radius:7px;background:var(--control);font-size:8px}.card-actions button:first-child{color:#fff;border-color:var(--accent);background:var(--accent)}.badge{position:absolute;top:6px;left:6px;padding:3px 6px;color:#fff;background:rgba(18,23,29,.72);border:1px solid rgba(255,255,255,.14);border-radius:6px;font-size:8px;backdrop-filter:blur(6px)}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--surface);border-top:1px solid var(--border);color:var(--text3);font-size:8px}.footer strong{color:var(--text2)}.footer button{border:0;color:var(--accent);background:transparent}.context-menu{position:fixed;z-index:30;min-width:154px;padding:5px;border:1px solid var(--border);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}.context-menu[hidden]{display:none}.context-menu button{display:block;width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;text-align:left;background:transparent;color:var(--text2)}.context-menu button:hover{color:var(--accent);background:var(--accentSoft)}.context-menu hr{margin:4px;border:0;border-top:1px solid var(--border)}.toast{position:absolute;z-index:10;right:12px;bottom:42px;max-width:70%;padding:8px 11px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);font-size:9px}.toast[hidden]{display:none}.hidden{display:none!important}@media(max-width:540px){.nav{grid-template-columns:auto minmax(0,1fr)}.nav>.go{display:none}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.reader{padding:14px}}
  </style>
</head>
<body>
<main class="app">
  <form id="nav" class="nav">
    <div class="nav-actions"><button id="back" class="icon" type="button" title="后退">←</button><button id="forward" class="icon" type="button" title="前进">→</button><button id="reload" class="icon" type="button" title="刷新">↻</button></div>
    <label class="address"><span>●</span><input id="address" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="网页地址"></label>
    <button class="go" type="submit">打开</button>
  </form>
  <div class="tabs"><div class="tabset"><button id="tabPage" class="tab active" type="button">网页</button><button id="tabImages" class="tab" type="button">原图 <span id="imageCount">0</span></button></div><span id="pageMeta" class="page-meta">轻量安全浏览模式</span></div>
  <section id="viewport" class="viewport"><div id="loading" class="loading" hidden><i class="spinner"></i><span>正在读取网页…</span></div><div id="reader" class="reader"></div><div id="gallery" class="gallery hidden"></div><div id="toast" class="toast" hidden></div><div id="contextMenu" class="context-menu" hidden><button id="menuSave" type="button">保存原图到画布</button><button id="menuCopy" type="button">复制原图链接</button><hr><button id="menuOpen" type="button">打开原图</button></div></section>
  <footer class="footer"><span><strong>提示：</strong>拖动原图卡片即可加入画布，也可点击按钮。</span><button id="external" type="button">在系统浏览器打开 ↗</button></footer>
</main>
<script>
(()=>{'use strict';
const PROTOCOL='hios-plugin-node/v1',PLUGIN='web-browser',$=id=>document.getElementById(id);
const runtime={nodeId:'',pluginId:PLUGIN,url:'',title:'',tab:'page',history:[],historyIndex:-1,requestMap:new Map(),images:[],selected:-1,blocks:[],loading:false,dragged:false,contextItem:null};
function post(type,payload={}){parent.postMessage({protocol:PROTOCOL,nodeId:runtime.nodeId,pluginId:runtime.pluginId,type,payload},'*')}
function applyTheme(theme){if(!theme||typeof theme!=='object')return;document.documentElement.dataset.theme=theme.mode==='light'?'light':'dark';const t=theme.tokens||{},m={background:'--bg',surface:'--surface',muted:'--muted',control:'--control',text:'--text',textSecondary:'--text2',textMuted:'--text3',border:'--border',accent:'--accent',accentSoft:'--accentSoft',positive:'--positive',negative:'--negative'};Object.entries(m).forEach(([k,v])=>{if(typeof t[k]==='string')document.documentElement.style.setProperty(v,t[k])})}
function normalizeUrl(raw,base){let value=String(raw||'').trim();if(!value)return'';if(!/^[a-z][a-z\d+.-]*:/i.test(value)){if(base)value=new URL(value,base).href;else value=`https://${value}`}const url=new URL(value);if(!/^https?:$/.test(url.protocol))throw new Error('只支持 HTTP(S) 网页');url.hash='';return url.href}
function request(url,options={}){const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{runtime.requestMap.delete(requestId);reject(new Error('网页请求超时'))},45000);runtime.requestMap.set(requestId,{resolve,reject,timer});post('network-request',{requestId,url,method:options.method||'GET',headers:options.headers||{Accept:'text/html,application/xhtml+xml;q=0.9,*/*;q=0.8'}})})}
function setLoading(on,text='正在读取网页…'){runtime.loading=on;$('loading').hidden=!on;$('loading').querySelector('span').textContent=text}
let toastTimer=0;function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function absolute(value,base){try{return normalizeUrl(value,base)}catch{return''}}
function bestSrcset(value,base){const list=String(value||'').split(',').map(item=>{const parts=item.trim().split(/\s+/);return{url:absolute(parts[0],base),score:parseFloat(parts[1])||0}}).filter(v=>v.url);return list.sort((a,b)=>b.score-a.score)[0]?.url||''}
function imageName(url,index){try{const name=decodeURIComponent(new URL(url).pathname.split('/').pop()||'');return name&&/\.[a-z\d]{2,5}$/i.test(name)?name:`网页原图-${index+1}`}catch{return`网页原图-${index+1}`}}
function imageFormat(url){try{const ext=new URL(url).pathname.match(/\.([a-z\d]{2,5})$/i)?.[1];return ext?ext.toUpperCase():'IMG'}catch{return'IMG'}}
function imageMime(url){const f=imageFormat(url).toLowerCase();return f==='jpg'||f==='jpeg'?'image/jpeg':['png','webp','gif','avif'].includes(f)?`image/${f}`:''}
function parse(html,finalUrl){
  const doc=new DOMParser().parseFromString(html,'text/html'),base=doc.querySelector('base[href]')?.getAttribute('href')||finalUrl,title=(doc.querySelector('meta[property="og:title"]')?.content||doc.title||new URL(finalUrl).hostname).trim(),imageCandidates=[];
  const addImage=(raw,meta={})=>{let url=bestSrcset(meta.srcset,base)||absolute(raw,base);if(!url||url.startsWith('data:')||/\.(?:svg|ico)(?:[?#]|$)/i.test(url))return;imageCandidates.push({url,alt:String(meta.alt||'').trim(),width:Number(meta.width||0),height:Number(meta.height||0)})};
  doc.querySelectorAll('meta[property="og:image"],meta[property="og:image:secure_url"],meta[name="twitter:image"],meta[name="twitter:image:src"],link[rel="image_src"]').forEach(el=>addImage(el.content||el.href));
  doc.querySelectorAll('picture').forEach(picture=>{const img=picture.querySelector('img'),sources=[...picture.querySelectorAll('source[srcset]')].map(x=>x.getAttribute('srcset')).join(',');if(img)addImage(img.getAttribute('data-original')||img.getAttribute('data-src')||img.getAttribute('src'),{srcset:sources||img.getAttribute('srcset'),alt:img.alt,width:img.getAttribute('width'),height:img.getAttribute('height')})});
  doc.querySelectorAll('img').forEach(img=>{const anchor=img.closest('a[href]'),anchorHref=anchor?.getAttribute('href')||'',queryUrl=extractImageQuery(anchorHref,base);addImage(img.getAttribute('data-zoom-image')||img.getAttribute('data-full')||img.getAttribute('data-original-src')||img.getAttribute('data-hi-res-src')||img.getAttribute('data-original')||img.getAttribute('data-src')||img.getAttribute('data-lazy-src')||queryUrl||img.currentSrc||img.getAttribute('src'),{srcset:img.getAttribute('srcset')||img.getAttribute('data-srcset'),alt:img.alt,width:img.getAttribute('width'),height:img.getAttribute('height')})});
  doc.querySelectorAll('a.iusc[m],a[m]').forEach(a=>{try{const m=JSON.parse(a.getAttribute('m'));addImage(m.murl||m.imgurl||m.ou||m.original,{alt:m.t||m.title,width:m.mw||m.w,height:m.mh||m.h})}catch{}});
  doc.querySelectorAll('a[href]').forEach(a=>{const u=extractImageQuery(a.getAttribute('href'),base);if(u)addImage(u,{alt:a.getAttribute('aria-label')||a.textContent})});
  const patterns=[/"murl"\s*:\s*"([^"]+)"/g,/"ou"\s*:\s*"([^"]+)"/g,/"original"\s*:\s*"(https?:\\?\/\\?\/[^"]+)"/g,/"contentUrl"\s*:\s*"(https?:\\?\/\\?\/[^"]+)"/g];for(const pattern of patterns){for(const match of html.matchAll(pattern)){const raw=match[1].replace(/\\u002F/g,'/').replace(/\\\//g,'/').replace(/&amp;/g,'&');addImage(raw)}}
  imageCandidates.sort((a,b)=>(b.width*b.height)-(a.width*a.height));const seen=new Set(),images=imageCandidates.filter(item=>{let key=item.url;try{const u=new URL(item.url);['w','width','h','height','q','quality','resize'].forEach(name=>u.searchParams.delete(name));key=u.href.replace(/#.*$/,'')}catch{}if(seen.has(key))return false;seen.add(key);return true}).slice(0,240),blocks=[];
  doc.querySelectorAll('h1,h2,h3,p,article li,main li').forEach(el=>{const text=(el.textContent||'').replace(/\s+/g,' ').trim();if(text.length<18||text.length>1400)return;const tag=el.tagName.toLowerCase();blocks.push({type:/^h[1-3]$/.test(tag)?'heading':'text',text})});
  const links=[];doc.querySelectorAll('a[href]').forEach(a=>{const text=(a.textContent||'').replace(/\s+/g,' ').trim(),href=absolute(a.getAttribute('href'),base);if(text&&href&&text.length<180)links.push({text,href})});return{title,images,blocks:blocks.slice(0,80),links:links.slice(0,50)}
}
function extractImageQuery(raw,base){try{const u=new URL(raw,base);for(const key of ['imgurl','mediaurl','image_url','url','u']){const value=u.searchParams.get(key);if(value&&/^https?:\/\//i.test(value))return value}if(/\.(?:png|jpe?g|webp|gif|avif)(?:[?#]|$)/i.test(u.href))return u.href}catch{}return''}
function updateNav(){ $('address').value=runtime.url;$('back').disabled=runtime.historyIndex<=0;$('forward').disabled=runtime.historyIndex<0||runtime.historyIndex>=runtime.history.length-1;$('external').disabled=!runtime.url;$('pageMeta').textContent=runtime.title?`${runtime.title} · 轻量安全浏览模式`:'轻量安全浏览模式';$('imageCount').textContent=String(runtime.images.length)}
function renderReader(){const root=$('reader');root.replaceChildren();if(!runtime.url){root.innerHTML='<div class="empty"><strong>输入网址开始浏览</strong><span>插件通过 HIOS 通用网络接口读取公开网页，不需要修改或重新打包主程序。</span></div>';return}const head=document.createElement('header');head.className='reader-head';const h1=document.createElement('h1');h1.textContent=runtime.title||runtime.url;const p=document.createElement('p');p.textContent=runtime.url;head.append(h1,p);root.appendChild(head);const content=document.createElement('div');content.className='reader-content';let imageIndex=0;runtime.blocks.slice(0,45).forEach((block,index)=>{const section=document.createElement('section');section.className='reader-block';const el=document.createElement(block.type==='heading'?'h2':'p');el.textContent=block.text;section.appendChild(el);content.appendChild(section);if(block.type!=='heading'&&index%7===4&&runtime.images[imageIndex])content.appendChild(readerFigure(runtime.images[imageIndex++]))});runtime.images.slice(imageIndex,Math.min(imageIndex+6,runtime.images.length)).forEach(item=>content.appendChild(readerFigure(item)));if(!runtime.blocks.length&&!runtime.images.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>网页没有可读取的正文</strong><span>可以切换到原图视图，或在系统浏览器中打开这个网址。</span>';content.appendChild(e)}root.appendChild(content)}
function readerFigure(item){const fig=document.createElement('figure');fig.className='reader-image';const img=document.createElement('img');img.src=item.url;img.alt=item.alt||'网页图片';img.loading='lazy';img.addEventListener('load',()=>{if(!item.width)item.width=img.naturalWidth;if(!item.height)item.height=img.naturalHeight});const cap=document.createElement('figcaption');const span=document.createElement('span');span.textContent=item.alt||imageName(item.url,0);const button=document.createElement('button');button.type='button';button.textContent='加入画布';button.onclick=()=>emitImage(item,true);cap.append(span,button);fig.append(img,cap);bindImageMenu(fig,item);return fig}
function renderGallery(){const root=$('gallery');root.replaceChildren();if(!runtime.images.length){root.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>没有发现网页图片</strong><span>尝试打开图片详情页或其他公开网页。</span></div>';return}runtime.images.forEach((item,index)=>{const card=document.createElement('article');card.className=`card ${runtime.selected===index?'selected':''}`;card.draggable=true;card.title='拖动即可加入画布';const media=document.createElement('div');media.className='card-media';const img=document.createElement('img');img.src=item.url;img.alt=item.alt||'';img.loading='lazy';img.draggable=false;img.addEventListener('load',()=>{item.width=img.naturalWidth;item.height=img.naturalHeight;badge.textContent=`${item.width} × ${item.height}`});const badge=document.createElement('span');badge.className='badge';badge.textContent=item.width&&item.height?`${item.width} × ${item.height}`:imageFormat(item.url);media.append(img,badge);const body=document.createElement('div');body.className='card-body';const name=document.createElement('strong');name.textContent=item.alt||imageName(item.url,index);const meta=document.createElement('small');meta.textContent=`${imageFormat(item.url)} · 原图`;const actions=document.createElement('div');actions.className='card-actions';const add=document.createElement('button');add.type='button';add.textContent='加入画布';add.onclick=e=>{e.stopPropagation();emitImage(item,true)};const copy=document.createElement('button');copy.type='button';copy.textContent='复制链接';copy.onclick=e=>{e.stopPropagation();navigator.clipboard.writeText(item.url).then(()=>toast('原图链接已复制')).catch(()=>toast('复制失败'))};actions.append(add,copy);body.append(name,meta,actions);card.append(media,body);card.onclick=()=>{runtime.selected=index;renderGallery();saveState()};card.addEventListener('dragstart',event=>{runtime.selected=index;runtime.dragged=true;event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('text/uri-list',item.url);event.dataTransfer.setData('text/plain',item.url);emitImage(item,true);toast('原图已加入画布，可继续拖动排列')});bindImageMenu(card,item);root.appendChild(card)})}
function hideContextMenu(){$('contextMenu').hidden=true;runtime.contextItem=null}
function showContextMenu(event,item){event.preventDefault();event.stopPropagation();runtime.contextItem=item;const menu=$('contextMenu');menu.hidden=false;const pad=8,w=menu.offsetWidth||170,h=menu.offsetHeight||110;menu.style.left=`${Math.max(pad,Math.min(event.clientX,innerWidth-w-pad))}px`;menu.style.top=`${Math.max(pad,Math.min(event.clientY,innerHeight-h-pad))}px`}
function bindImageMenu(element,item){element.addEventListener('contextmenu',event=>showContextMenu(event,item))}
function saveOriginal(item){if(!item?.url)return;emitImage(item,true);toast('已将原图保存到画布')}
$('menuSave').onclick=()=>{const item=runtime.contextItem;hideContextMenu();saveOriginal(item)};$('menuCopy').onclick=()=>{const item=runtime.contextItem;hideContextMenu();if(!item)return;navigator.clipboard.writeText(item.url).then(()=>toast('原图链接已复制')).catch(()=>toast('复制失败'))};$('menuOpen').onclick=()=>{const item=runtime.contextItem;hideContextMenu();if(item)window.open(item.url,'_blank','noopener,noreferrer')};document.addEventListener('pointerdown',event=>{if(!$('contextMenu').hidden&&!$('contextMenu').contains(event.target))hideContextMenu()});window.addEventListener('blur',hideContextMenu);window.addEventListener('keydown',event=>{if(event.key==='Escape')hideContextMenu()});

function showTab(tab,save=true){runtime.tab=tab==='images'?'images':'page';$('tabPage').classList.toggle('active',runtime.tab==='page');$('tabImages').classList.toggle('active',runtime.tab==='images');$('reader').classList.toggle('hidden',runtime.tab!=='page');$('gallery').classList.toggle('hidden',runtime.tab!=='images');if(save)saveState()}
function saveState(){post('state',{state:{url:runtime.url,tab:runtime.tab,selectedUrl:runtime.images[runtime.selected]?.url||''}})}
function emitImage(item,addToCanvas){if(!item?.url)return;const index=runtime.images.indexOf(item),name=imageName(item.url,index<0?0:index),mime=imageMime(item.url);post('output',{output:{kind:'image',portId:'image',source:item.url,url:item.url,name,...(mime?{mime}:{}),width:Number(item.width||0),height:Number(item.height||0),metadata:{addToCanvas:Boolean(addToCanvas),sourcePage:runtime.url,referer:runtime.url,originalUrl:item.url,alt:item.alt||''}}});runtime.selected=Math.max(0,index);saveState()}
async function navigate(raw,{replace=false,fromHistory=false}={}){let url;try{url=normalizeUrl(raw,runtime.url)}catch(e){toast(e.message);return}setLoading(true);try{const result=await request(url);if(!result?.ok)throw new Error(`HTTP ${result?.status||'请求失败'}`);const finalUrl=normalizeUrl(result.url||url),parsed=parse(String(result.body||''),finalUrl);runtime.url=finalUrl;runtime.title=parsed.title;runtime.images=parsed.images;runtime.blocks=parsed.blocks;runtime.selected=-1;if(!fromHistory){if(replace&&runtime.historyIndex>=0)runtime.history[runtime.historyIndex]=finalUrl;else{runtime.history=runtime.history.slice(0,runtime.historyIndex+1);runtime.history.push(finalUrl);runtime.historyIndex=runtime.history.length-1}}renderReader();renderGallery();updateNav();saveState();post('loaded',{ready:true})}catch(e){runtime.url=url;runtime.title='网页读取失败';runtime.images=[];runtime.blocks=[];renderReader();renderGallery();updateNav();toast(e.message||String(e));post('error',{message:`网页读取失败：${e.message||String(e)}`})}finally{setLoading(false)}}
$('nav').addEventListener('submit',e=>{e.preventDefault();void navigate($('address').value)});$('reload').onclick=()=>runtime.url&&void navigate(runtime.url,{replace:true,fromHistory:true});$('back').onclick=()=>{if(runtime.historyIndex<=0)return;runtime.historyIndex--;void navigate(runtime.history[runtime.historyIndex],{fromHistory:true})};$('forward').onclick=()=>{if(runtime.historyIndex>=runtime.history.length-1)return;runtime.historyIndex++;void navigate(runtime.history[runtime.historyIndex],{fromHistory:true})};$('tabPage').onclick=()=>showTab('page');$('tabImages').onclick=()=>showTab('images');$('external').onclick=()=>runtime.url&&window.open(runtime.url,'_blank','noopener,noreferrer');
window.addEventListener('message',event=>{const m=event.data;if(!m||m.protocol!==PROTOCOL)return;if(m.type==='network-result'){const pending=runtime.requestMap.get(m.payload?.requestId);if(!pending)return;clearTimeout(pending.timer);runtime.requestMap.delete(m.payload.requestId);if(m.payload.error)pending.reject(new Error(m.payload.error));else pending.resolve(m.payload.result);return}if(m.type==='init'){const p=m.payload||{};runtime.nodeId=String(p.nodeId||runtime.nodeId);runtime.pluginId=String(p.pluginId||runtime.pluginId||PLUGIN);applyTheme(p.theme);const saved=p.state||{};showTab(saved.tab||runtime.tab,false);const next=String(saved.url||'').trim();if(next&&next!==runtime.url)void navigate(next);else post('loaded',{ready:true})}if(m.type==='run'){const selected=runtime.images[runtime.selected]||runtime.images[0];if(selected)emitImage(selected,false);else post('error',{message:'当前网页没有可输出的图片，请先打开网页并选择原图'})}});
renderReader();renderGallery();updateNav();post('ready',{version:'0.1.1'});
})();
