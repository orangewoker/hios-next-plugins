<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>浏览器</title>
  <style>
    :root{color-scheme:dark;--bg:#12171d;--surface:#1b222a;--muted:#222b35;--control:#27313c;--text:#edf2f7;--text2:#b8c2cd;--text3:#7f8b98;--border:#34404c;--accent:#2f91ff;--accentSoft:rgba(47,145,255,.16);--positive:#45b979;--negative:#ef6873;--shadow:0 12px 34px rgba(0,0,0,.25)}
    :root[data-theme="light"]{color-scheme:light;--bg:#eef3f7;--surface:#fbfcfd;--muted:#e6edf3;--control:#e2eaf1;--text:#263242;--text2:#5f6c7a;--text3:#8995a2;--border:#cbd5df;--shadow:0 10px 28px rgba(42,58,74,.13)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font:11px/1.5 Inter,"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 9px;background:var(--surface);border-bottom:1px solid var(--border)}.nav-actions{display:flex;gap:4px}.icon{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:var(--control);color:var(--text2)}.icon:disabled{opacity:.35}.address{display:flex;align-items:center;gap:6px;min-width:0;height:31px;padding:0 8px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}.address:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}.address span{color:var(--positive)}.address input{min-width:0;flex:1;border:0;outline:0;background:transparent}.go{height:29px;padding:0 12px;border:0;border-radius:8px;color:#fff;background:var(--accent);font-weight:700}.tabs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;background:var(--surface);border-bottom:1px solid var(--border)}.tabset{display:flex;gap:4px}.tab{height:27px;padding:0 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text3)}.tab.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--border));background:var(--accentSoft)}.page-meta{min-width:0;color:var(--text3);font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewport{position:relative;min-height:0;overflow:hidden;background:var(--bg)}.page-frame{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;z-index:5;inset:0;display:grid;place-content:center;justify-ite ace-between;gap:8px;padding:7px 10px;background:var(--surface);border-top:1px solid var(--border);color:var(--text3);font-size:8px}.footer strong{color:var(--text2)}.footer button{border:0;color:var(--accent);background:transparent}.context-menu{position:fixed;z-index:30;min-width:154px;padding:5px;border:1px solid var(--border);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}.context-menu[hidden]{display:none}.context-menu button{display:block;width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;text-align:left;background:transparent;color:var(--text2)}.context-menu button:hover{color:var(--accent);background:var(--accentSoft)}.context-menu hr{margin:4px;border:0;border-top:1px solid var(--border)}.toast{position:absolute;z-index:20;right:12px;bottom:12px;max-width:70%;padding:8px 11px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);font-size:9px}.toast[hidden]{display:none}.hidden{display:none!important}@media(max-width:540px){.nav{grid-template-columns:auto minmax(0,1fr)}.nav>.go{display:none}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<main class="app">
  <form id="nav" class="nav">
    <div class="nav-actions"><button id="back" class="icon" type="button" title="后退">←</button><button id="forward" class="icon" type="button" title="前进">→</button><button id="reload" class="icon" type="button" title="刷新">↻</button></div>
    <label class="address"><span>●</span><input id="address" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="网页地址"></label>
    <button class="go" type="submit">打开</button>
  </form>
  <div class="tabs"><div class="tabset"><button id="tabPage" class="tab active" type="button">网页</button><button id="tabImages" class="tab" type="button">原图 <span id="imageCount">0</span></button></div><span id="pageMeta" class="page-meta">原始网页模式</span></div>
  <section id="viewport" class="viewport"><iframe id="pageFrame" class="page-frame" title="原始网页快照" sandbox="allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe><div id="gallery" class="gallery hidden"></div><div id="loading" class="loading" hidden><i class="spinner"></i><span>正在打开网页…</span></div><div id="toast" class="toast" hidden></div><div id="contextMenu" class="context-menu" hidden><button id="menuSave" type="button">保存原图到画布</button><button id="menuCopy" type="button">复制原图链接</button><hr><button id="menuOpen" type="button">打开原图</button></div></section>
  <footer class="footer"><span><strong>提示：</strong>网页优先使用实时原页；不支持时显示原始页面快照。右键图片可保存原图。</span><button id="external" type="button">在系统浏览器打开 ↗</button></footer>
</main>
<script>
(()=>{'use strict';
const PROTOCOL='hios-plugin-node/v1',PLUGIN='web-browser',$=id=>document.getElementById(id),UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',HAS_EMBEDDED_BROWSER=/Electron/i.test(navigator.userAgent);
const runtime={nodeId:'',pluginId:PLUGIN,url:'',title:'',tab:'page',history:[],historyIndex:-1,requestMap:new Map(),images:[],selected:-1,pageHtml:'',contextItem:null,browserLive:false,browserTimer:0,navigationTimer:0};
function post(type,payload={}){parent.postMessage({protocol:PROTOCOL,nodeId:runtime.nodeId,pluginId:runtime.pluginId,type,payload},'*')}
function applyTheme(theme){if(!theme||typeof theme!=='object')return;document.documentElement.dataset.theme=theme.mode==='light'?'light':'dark';const t=theme.tokens||{},m={background:'--bg',surface:'--surface',muted:'--muted',control:'--control',text:'--text',textSecondary:'--text2',textMuted:'--text3',border:'--border',accent:'--accent',accentSoft:'--accentSoft',positive:'--positive',negative:'--negative'};Object.entries(m).forEach(([k,v])=>{if(typeof t[k]==='string')document.documentElement.style.setProperty(v,t[k])})}
function normalizeUrl(raw,base){let value=String(raw||'').trim();if(!value)return'';if(!/^[a-z][a-z\d+.-]*:/i.test(value))value=base?new URL(value,base).href:`https://${value}`;const url=new URL(value);if(!/^https?:$/.test(url.protocol))throw new Error('只支持 HTTP(S) 网页');url.hash='';return url.href}
function request(url,options={}){const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{runtime.requestMap.delete(requestId);reject(new Error('网络请求超时'))},60000);runtime.requestMap.set(requestId,{resolve,reject,timer});post('network-request',{requestId,url,method:options.method||'GET',headers:options.headers||{Accept:'text/html,application/xhtml+xml;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9',Referer:runtime.url||url},responseType:options.responseType||'text'})})}
function browserCommand(command,payload={}){const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{runtime.requestMap.delete(requestId);reject(new Error('浏览器操作超时'))},15000);runtime.requestMap.set(requestId,{resolve,reject,timer});post('browser-command',{requestId,command,...payload})})}
function setLoading(on,text='正在打开网页…'){$('loading').hidden=!on;$('loading').querySelector('span').textContent=text}
let toastTimer=0;function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function absolute(value,base){try{return normalizeUrl(value,base)}catch{return''}}
function decodeEscaped(value){return String(value||'').replace(/\\u002F/gi,'/').replace(/\\\//g,'/').replace(/\\u0026/gi,'&').replace(/&amp;/g,'&')}
function bestSrcset(value,base){const list=String(value||'').split(',').map(item=>{const parts=item.trim().split(/\s+/);return{url:absolute(parts[0],base),score:parseFloat(parts[1])||0}}).filter(v=>v.url);return list.sort((a,b)=>b.score-a.score)[0]?.url||''}
function originalUrl(raw){let value=decodeEscaped(raw);try{const u=new URL(value);if(/(^|\.)pinimg\.com$/i.test(u.hostname)){u.protocol='https:';u.pathname=u.pathname.replace(/^\/(?:\d+x|236x|474x|564x|736x)\//i,'/originals/')}if(/(^|\.)xhscdn\.com$/i.test(u.hostname)){u.protocol='https:';['imageView2','imageMogr2','x-oss-process'].forEach(k=>u.searchParams.delete(k))}return u.href}catch{return value}}
function extractImageQuery(raw,base){try{const u=new URL(raw,base);for(const key of ['imgurl','mediaurl','image_url','url','u']){const value=u.searchParams.get(key);if(value&&/^https?:\/\//i.test(value))return originalUrl(value)}if(/\.(?:png|jpe?g|webp|gif|avif)(?:[?#]|$)/i.test(u.href))return originalUrl(u.href)}catch{}return''}
function imageName(url,index){try{const name=decodeURIComponent(new URL(url).pathname.split('/').pop()||'');return name&&/\.[a-z\d]{2,5}$/i.test(name)?name:`网页原图-${index+1}.jpg`}catch{return`网页原图-${index+1}.jpg`}}
function imageFormat(url){try{const ext=new URL(url).pathname.match(/\.([a-z\d]{2,5})$/i)?.[1];return ext?ext.toUpperCase():'IMG'}catch{return'IMG'}}
function imageMime(url){const f=imageFormat(url).toLowerCase();return f==='jpg'||f==='jpeg'?'image/jpeg':['png','webp','gif','avif'].includes(f)?`image/${f}`:''}
function sanitizeDocument(doc,base){doc.querySelectorAll('script,iframe,object,embed,meta[http-equiv="refresh"],meta[http-equiv="content-security-policy"]').forEach(el=>el.remove());doc.querySelectorAll('*').forEach(el=>{for(const attr of [...el.attributes])if(/^on/i.test(attr.name))el.removeAttribute(attr.name)});let baseEl=doc.querySelector('base');if(!baseEl){baseEl=doc.createElement('base');doc.head.prepend(baseEl)}baseEl.href=base;baseEl.target='_blank';const style=doc.createElement('style');style.textContent='html,body{min-height:100%!important;overflow:auto!important}body{margin:0!important}';doc.head.appendChild(style);return '<!doctype html>\n'+doc.documentElement.outerHTML}
function parse(html,finalUrl){
  const doc=new DOMParser().parseFromString(html,'text/html'),base=doc.querySelector('base[href]')?.getAttribute('href')||finalUrl,title=(doc.querySelector('meta[property="og:title"]')?.content||doc.title||new URL(finalUrl).hostname).trim(),candidates=[];
  const add=(raw,meta={})=>{const candidate=bestSrcset(meta.srcset,base)||absolute(decodeEscaped(raw),base);if(/\/\/(?:i\.)?pinimg\.com\/(?:30x30|60x60|75x75(?:_[A-Z]+)?)\//i.test(candidate))return;const url=originalUrl(candidate);if(!url||url.startsWith('data:')||/\.(?:svg|ico)(?:[?#]|$)/i.test(url))return;candidates.push({url,alt:String(meta.alt||'').trim(),width:Number(meta.width||0),height:Number(meta.height||0),priority:Number(meta.priority||0)})};
  for(const match of html.matchAll(/"urlDefault"\s*:\s*"([^"]+)"/g))add(match[1],{alt:title,priority:3});
  for(const match of html.matchAll(/https?(?:\\u002F|\\\/){2}i\.pinimg\.com(?:\\u002F|\\\/)[^"'<>\\\s]+/gi))add(match[0],{alt:title,priority:3});
  doc.querySelectorAll('meta[property="og:image"],meta[property="og:image:secure_url"],meta[name="twitter:image"],meta[name="twitter:image:src"],link[rel="image_src"]').forEach(el=>add(el.content||el.href,{priority:1}));
  doc.querySelectorAll('link[rel="preload"][as="image"]').forEach(el=>add(el.getAttribute('href'),{srcset:el.getAttribute('imagesrcset'),alt:title,priority:3}));
  doc.querySelectorAll('img').forEach(img=>{const anchor=img.closest('a[href]');add(img.getAttribute('data-zoom-image')||img.getAttribute('data-full')||img.getAttribute('data-original-src')||img.getAttribute('data-hi-res-src')||img.getAttribute('data-original')||img.getAttribute('data-src')||img.getAttribute('data-lazy-src')||extractImageQuery(anchor?.getAttribute('href')||'',base)||img.getAttribute('src'),{srcset:img.getAttribute('srcset')||img.getAttribute('data-srcset'),alt:img.alt,width:img.getAttribute('width'),height:img.getAttribute('height')})});

  for(const pattern of [/"murl"\s*:\s*"([^"]+)"/g,/"ou"\s*:\s*"([^"]+)"/g,/"original"\s*:\s*"(https?:\\?\/\\?\/[^"]+)"/g,/"contentUrl"\s*:\s*"(https?:\\?\/\\?\/[^"]+)"/g])for(const match of html.matchAll(pattern))add(match[1]);

  return{title,images,pageHtml:sanitizeDocument(doc,base)}
}
function updateNav(){$('address').value=runtime.url;$('back').disabled=runtime.historyIndex<=0&&!runtime.browserLive;$('forward').disabled=runtime.historyIndex<0||runtime.historyIndex>=runtime.history.length-1;$('external').disabled=!runtime.url;$('pageMeta').textContent=runtime.title?`${runtime.title} · ${runtime.browserLive?'实时原页':'原页快照'}`:'原始网页模式';$('imageCount').textContent=String(runtime.images.length)}
function bindSnapshot(){const frame=$('pageFrame'),doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link)return;const href=absolute(link.getAttribute('href'),runtime.url);if(!href)return;event.preventDefault();void navigate(href)});doc.addEventListener('contextmenu',event=>{const img=event.target.closest?.('img');if(!img)return;event.preventDefault();const source=originalUrl(img.currentSrc||img.src||'');if(!source)return;showContextMenu({clientX:event.clientX+frame.getBoundingClientRect().left,clientY:event.clientY+frame.getBoundingClientRect().top,preventDefault(){},stopPropagation(){}},{url:source,alt:img.alt||runtime.title,width:img.naturalWidth,height:img.naturalHeight})})}
function renderPage(){$('pageFrame').srcdoc=runtime.pageHtml||`<!doctype html><style>body{font:14px system-ui;background:#fff;color:#667;padding:40px;text-align:center}</style><h2>输入网址开始浏览</h2><p>支持普通网页、小红书与 Pinterest 页面。</p>`;$('pageFrame').onload=bindSnapshot}
function renderGallery(){const root=$('gallery');root.replaceChildren();if(!runtime.images.length){root.innerHTML='<div class="empty"><strong>没有发现网页图片</strong><span>可以在“网页”页签中右键图片，或者打开图片详情页。</span></div>';return}runtime.images.forEach((item,index)=>{const card=document.createElement('article');card.className=`card ${runtime.selected===index?'selected':''}`;card.draggable=true;card.title='拖动即可保存原图到画布';const media=document.createElement('div');media.className='card-media';const img=document.createElement('img');img.src=item.url;img.alt=item.alt||'';img.loading='lazy';img.draggable=false;const badge=document.createElement('span');badge.className='badge';badge.textContent=item.width&&item.height?`${item.width} × ${item.height}`:imageFormat(item.url);img.onload=()=>{item.width=img.naturalWidth;item.height=img.naturalHeight;badge.textContent=`${item.width} × ${item.height}`};media.append(img,badge);const body=document.createElement('div');body.className='card-body';const name=document.createElement('strong');name.textContent=item.alt||imageName(item.url,index);const meta=document.createElement('small');meta.textContent=`${imageFormat(item.url)} · 原图`;const actions=document.createElement('div');actions.className='card-actions';const add=document.createElement('button');add.type='button';add.textContent='保存到画布';add.onclick=e=>{e.stopPropagation();void emitImage(item,true)};const copy=document.createElement('button');copy.type='button';copy.textContent='复制链接';copy.onclick=e=>{e.stopPropagation();void copyLink(item.url)};actions.append(add,copy);body.append(name,meta,actions);card.append(media,body);card.onclick=()=>{runtime.selected=index;renderGallery();saveState()};card.oncontextmenu=event=>showContextMenu(event,item);card.ondragstart=event=>{runtime.selected=index;event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('text/uri-list',item.url);event.dataTransfer.setData('text/plain',item.url);void emitImage(item,true)};root.appendChild(card)})}
function openLiveBrowser(){if(!runtime.url||runtime.tab!=='page')return;runtime.browserLive=false;clearTimeout(runtime.browserTimer);if(!HAS_EMBEDDED_BROWSER){post('browser-close');updateNav();return}post('browser-open',{src:runtime.url,userAgent:UA,bounds:{top:77,right:0,bottom:31,left:0}});runtime.browserTimer=setTimeout(()=>{if(runtime.browserLive)return;post('browser-close');updateNav();toast('实时网页不可用，已切换原始页面快照')},4500)}
function closeLiveBrowser(){clearTimeout(runtime.browserTimer);runtime.browserLive=false;post('browser-close')}
function showTab(tab,save=true){runtime.tab=tab==='images'?'images':'page';$('tabPage').classList.toggle('active',runtime.tab==='page');$('tabImages').classList.toggle('active',runtime.tab==='images');$('pageFrame').classList.toggle('hidden',runtime.tab!=='page');$('gallery').classList.toggle('hidden',runtime.tab!=='images');if(runtime.tab==='page')openLiveBrowser();else closeLiveBrowser();if(save)saveState()}
function saveState(){post('state',{state:{url:runtime.url,tab:runtime.tab,selectedUrl:runtime.images[runtime.selected]?.url||''}})}
async function emitImage(item,addToCanvas){if(!item?.url)return;runtime.selected=Math.max(0,runtime.images.indexOf(item));setLoading(true,'正在下载原图…');try{const result=await request(item.url,{responseType:'base64',headers:{Accept:'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.9,*/*;q=0.5',Referer:runtime.url||item.url,'User-Agent':UA}});if(!result?.ok||result.encoding!=='base64')throw new Error(`原图下载失败：HTTP ${result?.status||'未知'}`);const mime=String(result.headers?.['content-type']||imageMime(item.url)||'image/jpeg').split(';')[0],source=`data:${mime};base64,${result.body}`,index=runtime.images.indexOf(item),name=imageName(item.url,index<0?0:index);post('output',{output:{kind:'image',portId:'image',source,dataUrl:source,name,mime,width:Number(item.width||0),height:Number(item.height||0),metadata:{addToCanvas:Boolean(addToCanvas),sourcePage:runtime.url,referer:runtime.url,originalUrl:item.url,alt:item.alt||''}}});saveState();toast(addToCanvas?'原图已保存到画布':'原图输出已生成')}catch(error){post('error',{message:error.message||String(error)});toast(error.message||String(error))}finally{setLoading(false)}}
async function navigate(raw,{replace=false,fromHistory=false}={}){let url;try{url=normalizeUrl(raw,runtime.url)}catch(error){toast(error.message);return}setLoading(true);if(runtime.tab==='page'){runtime.url=url;openLiveBrowser()}try{const result=await request(url,{headers:{Accept:'text/html,application/xhtml+xml;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9','User-Agent':UA,Referer:runtime.url||url}});if(!result?.ok)throw new Error(`HTTP ${result?.status||'请求失败'}`);const finalUrl=normalizeUrl(result.url||url),parsed=parse(String(result.body||''),finalUrl);runtime.url=finalUrl;runtime.title=parsed.title;runtime.images=parsed.images;runtime.pageHtml=parsed.pageHtml;runtime.selected=Math.max(0,runtime.images.findIndex(item=>item.url===runtime.images[runtime.selected]?.url));if(!fromHistory){if(replace&&runtime.historyIndex>=0)runtime.history[runtime.historyIndex]=finalUrl;else{runtime.history=runtime.history.slice(0,runtime.historyIndex+1);runtime.history.push(finalUrl);runtime.historyIndex=runtime.history.length-1}}renderPage();renderGallery();updateNav();saveState();post('loaded',{ready:true})}catch(error){runtime.url=url;runtime.title='网页读取失败';runtime.images=[];runtime.pageHtml=`<!doctype html><style>body{font:14px system-ui;background:#fff;color:#667;padding:40px;text-align:center}</style><h2>网页读取失败</h2><p>${String(error.message||error).replace(/[<>&]/g,'')}</p>`;renderPage();renderGallery();updateNav();toast(error.message||String(error));post('error',{message:`网页读取失败：${error.message||String(error)}`})}finally{setLoading(false)}}
function hideContextMenu(){$('contextMenu').hidden=true;runtime.contextItem=null}
function showContextMenu(event,item){event.preventDefault();event.stopPropagation();runtime.contextItem=item;const menu=$('contextMenu');menu.hidden=false;const w=menu.offsetWidth||170,h=menu.offsetHeight||110;menu.style.left=`${Math.max(8,Math.min(event.clientX,innerWidth-w-8))}px`;menu.style.top=`${Math.max(8,Math.min(event.clientY,innerHeight-h-8))}px`}
function copyLink(url){return navigator.clipboard.writeText(url).then(()=>toast('原图链接已复制')).catch(()=>toast('复制失败'))}
async function resolveLiveImage(params){const fallback=originalUrl(params.srcURL||'');try{const code=`(()=>{const e=document.elementFromPoint(${Number(params.x||0)},${Number(params.y||0)});const i=e?.closest?.('img')||e?.querySelector?.('img');const a=i?.closest?.('a');return i?{source:i.currentSrc||i.src||'',srcset:i.srcset||'',alt:i.alt||i.title||'',width:i.naturalWidth||0,height:i.naturalHeight||0,link:a?.href||'',title:document.title}:null})()`;const result=await browserCommand('execute-js',{code});if(result?.source){const srcset=bestSrcset(result.srcset,runtime.url),query=extractImageQuery(result.link,runtime.url);return{url:originalUrl(query||srcset||result.source),alt:result.alt||result.title||runtime.title,width:Number(result.width||0),height:Number(result.height||0)}}}catch{}return fallback?{url:fallback,alt:params.altText||params.titleText||runtime.title,width:0,height:0}:null}
$('nav').onsubmit=event=>{event.preventDefault();void navigate($('address').value)};$('reload').onclick=()=>{if(runtime.browserLive)void browserCommand('reload');else runtime.url&&void navigate(runtime.url,{replace:true})};$('back').onclick=()=>{if(runtime.browserLive){void browserCommand('back');return}if(runtime.historyIndex<=0)return;runtime.historyIndex--;void navigate(runtime.history[runtime.historyIndex],{fromHistory:true})};$('forward').onclick=()=>{if(runtime.browserLive){void browserCommand('forward');return}if(runtime.historyIndex>=runtime.history.length-1)return;runtime.historyIndex++;void navigate(runtime.history[runtime.historyIndex],{fromHistory:true})};$('tabPage').onclick=()=>showTab('page');$('tabImages').onclick=()=>showTab('images');$('external').onclick=()=>runtime.url&&window.open(runtime.url,'_blank','noopener,noreferrer');
$('menuSave').onclick=()=>{const item=runtime.contextItem;hideContextMenu();if(item)void emitImage(item,true)};$('menuCopy').onclick=()=>{const item=runtime.contextItem;hideContextMenu();if(item)void copyLink(item.url)};$('menuOpen').onclick=()=>{const item=runtime.contextItem;hideContextMenu();if(item)window.open(item.url,'_blank','noopener,noreferrer')};document.addEventListener('pointerdown',event=>{if(!$('contextMenu').hidden&&!$('contextMenu').contains(event.target))hideContextMenu()});window.addEventListener('keydown',event=>{if(event.key==='Escape')hideContextMenu()});
window.addEventListener('message',event=>{const m=event.data;if(!m||m.protocol!==PROTOCOL)return;if(m.type==='network-result'||m.type==='browser-result'){const pending=runtime.requestMap.get(m.payload?.requestId);if(!pending)return;clearTimeout(pending.timer);runtime.requestMap.delete(m.payload.requestId);if(m.payload.error)pending.reject(new Error(m.payload.error));else pending.resolve(m.payload.result);return}if(m.type==='browser-event'){const p=m.payload||{};if(p.event==='dom-ready'||p.event==='did-stop-loading'){runtime.browserLive=true;clearTimeout(runtime.browserTimer);updateNav()}if(p.event==='did-fail-load'){runtime.browserLive=false;post('browser-close');toast('实时网页载入失败，已切换原页快照')}if(p.event==='navigation'&&p.url){runtime.url=String(p.url);updateNav();saveState()}if(p.event==='context-action'&&p.action==='save-original')void resolveLiveImage(p.params||{}).then(item=>item?emitImage(item,true):toast('没有识别到图片原图'));return}if(m.type==='init'){const p=m.payload||{};runtime.nodeId=String(p.nodeId||runtime.nodeId);runtime.pluginId=String(p.pluginId||runtime.pluginId||PLUGIN);applyTheme(p.theme);const saved=p.state||{};runtime.tab=saved.tab==='images'?'images':'page';showTab(runtime.tab,false);const next=String(saved.url||'').trim();if(next&&next!==runtime.url)void navigate(next);else post('loaded',{ready:true})}if(m.type==='run'){const selected=runtime.images[runtime.selected]||runtime.images[0];if(selected)void emitImage(selected,false);else post('error',{message:'当前网页没有可输出的图片，请先打开网页并选择原图'})}});
renderPage();renderGallery();updateNav();post('ready',{version:'0.2.0'});
})();
