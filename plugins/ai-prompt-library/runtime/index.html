<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 提示词库</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#edf2f6;--surface:#f6f9fb;--muted:#e8eef3;--control:#e7edf2;
      --text:#253143;--text-2:#5f6c7e;--text-3:#8e99a7;--border:#cbd6df;
      --accent:#007aff;--accent-soft:rgba(0,122,255,.1);--positive:#2e9b63;--negative:#d4525f;
      --shadow:0 12px 34px rgba(44,60,78,.12);--radius:14px;
    }
    :root[data-theme="dark"] { color-scheme:dark;--bg:#18212c;--surface:#202c39;--muted:#17212b;--control:#253240;--text:#edf3f8;--text-2:#b6c1cd;--text-3:#7f8c99;--border:#344352;--accent-soft:rgba(50,145,255,.16);--shadow:0 14px 38px rgba(0,0,0,.26); }
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden; }
    body { color:var(--text);background:var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.5; }
    button,input,select { font:inherit; }
    [hidden] { display:none !important; }
    button { border:0;cursor:pointer; }
    .app { height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto; }
    .top { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface); }
    .brand { min-width:0;display:flex;align-items:center;gap:9px; }
    .brand-icon { width:31px;height:31px;display:grid;place-items:center;flex:none;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:10px;font-size:17px; }
    .brand strong,.brand small { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .brand strong { font-size:15px;font-weight:700; }
    .brand small { margin-top:2px;color:var(--text-2);font-size:12px; }
    .status { display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 8px;color:var(--text-2);background:var(--muted);border:1px solid var(--border);border-radius:999px;font-size:12px; }
    .status::before { content:"";width:6px;height:6px;background:currentColor;border-radius:50%; }
    .status.ok { color:var(--positive); }.status.error { color:var(--negative); }
    .scroll { min-height:0;overflow:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent; }
    .stack { display:grid;gap:9px; }
    .panel { overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 5px 18px rgba(29,48,67,.05); }
    .panel-head { width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;color:var(--text);background:transparent;text-align:left; }
    .panel-head span { display:grid;gap:2px;min-width:0; }.panel-head strong { font-size:14px; }.panel-head small { color:var(--text-2);font-size:12px;font-weight:400; }
    .panel-heading { display:flex;align-items:center;gap:4px; }.panel-heading .panel-head { flex:1;min-width:0; }.panel-heading > .btn { flex:none;margin-right:11px; }
    .chevron { color:var(--text-3);font-size:12px;transition:transform .15s ease; }.panel.open .chevron { transform:rotate(180deg); }
    .panel-body { display:none;padding:0 11px 11px; }.panel.open .panel-body { display:grid;gap:8px; }
    label { display:grid;gap:5px;min-width:0;color:var(--text-2);font-size:13px; }
    .field-row { display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:7px; }
    .input-wrap { position:relative; }
    input { width:100%;min-width:0;height:36px;padding:0 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;outline:0;font-size:14px; }
    .save-category-field { display:grid;gap:5px;min-width:0; }
    .save-category-trigger { width:100%;min-width:0;height:36px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;text-align:left;font-size:14px; }
    .save-category-trigger:disabled { opacity:.5;cursor:not-allowed; }
    .save-category-trigger:focus-visible { outline:2px solid var(--accent);outline-offset:2px; }
    .save-category-trigger[aria-expanded="true"] { border-color:var(--accent); }
    .save-category-caption { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .save-category-trigger::after { content:"";width:6px;height:6px;flex:none;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg); }
    .save-category-menu { position:fixed;z-index:1000;overflow:auto;overscroll-behavior:contain;padding:4px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);scrollbar-color:var(--border) var(--surface); }
    .save-category-option { min-height:32px;padding:7px 10px;border-radius:7px;color:var(--text);font-size:14px;line-height:1.3;overflow-wrap:anywhere;cursor:pointer; }
    .save-category-option[aria-selected="true"] { color:var(--accent);font-weight:600; }
    .save-category-option.is-active { background:var(--accent-soft); }
    /* Text entry keeps its normal border, including on older HIOS hosts. */
    input:focus { outline:none;box-shadow:none; }
    input::placeholder { color:var(--text-2);opacity:1; }
    input[type="number"] { appearance:textfield;-moz-appearance:textfield; }
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button { appearance:none;margin:0; }
    .secret { padding-right:56px; }.reveal { position:absolute;right:4px;top:4px;width:46px;height:28px;color:var(--text-2);background:transparent;border-radius:6px;font-size:12px;white-space:nowrap; }.reveal:hover { color:var(--accent);background:var(--accent-soft); }
    .actions { display:flex;flex-wrap:wrap;gap:6px; }
    .btn { min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:600; }
    .btn:hover { color:var(--text);border-color:color-mix(in srgb,var(--accent) 42%,var(--border)); }
    .btn.primary { color:#fff;background:var(--accent);border-color:var(--accent); }
    .run-icon { width:14px;height:14px;fill:currentColor; }
    .run-hint { font-size:12px;font-weight:400;opacity:.85; }
    .btn.primary:hover { filter:brightness(1.06); }.btn:disabled { opacity:.42;cursor:not-allowed; }
    .note { margin:0;color:var(--text-2);font-size:12px;line-height:1.6;overflow-wrap:anywhere; }
    .categories { display:flex;flex-wrap:wrap;gap:5px; }
    .category { display:inline-flex;align-items:center;gap:5px;max-width:100%;min-height:32px;padding:4px 8px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:8px;font-size:13px;overflow-wrap:anywhere; }
    .category:hover { border-color:color-mix(in srgb,var(--accent) 40%,var(--border)); }.category.active { color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 42%,var(--border)); }
    .category em { color:var(--text-2);font-size:12px;font-style:normal; }
    .empty { padding:12px;color:var(--text-2);background:var(--muted);border:1px dashed var(--border);border-radius:10px;text-align:center;font-size:13px; }
    .save-inputs { display:grid;grid-template-columns:1fr 1fr;gap:7px; }
    .save-input { min-width:0;padding:8px;background:var(--muted);border:1px solid var(--border);border-radius:9px; }
    .save-input strong,.save-input span { display:block;overflow:hidden;text-overflow:ellipsis; }
    .save-input strong { color:var(--text);font-size:13px; }
    .save-input span { margin-top:3px;color:var(--text-2);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3; }
    .run-row { display:grid;grid-template-columns:80px 100px minmax(0,1fr);gap:7px;align-items:end; }
    .auto { min-height:36px;display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--text-2);background:var(--control);border:1px solid var(--border);border-radius:9px;font-size:12px; }
    .auto input { width:14px;height:14px;padding:0;accent-color:var(--accent);box-shadow:none; }
    .result-head { display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 1px; }
    .result-head strong { font-size:14px; }.result-head span { color:var(--text-2);font-size:12px; }
    .results { display:grid;gap:6px; }
    .result { width:100%;display:grid;grid-template-columns:43px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:11px;text-align:left; }
    .result:hover { border-color:color-mix(in srgb,var(--accent) 38%,var(--border)); }.result.active { color:var(--text);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 48%,var(--border)); }
    .thumb { width:43px;height:43px;display:grid;place-items:center;overflow:hidden;color:var(--text-3);background:var(--muted);border-radius:8px;font-size:15px; }.thumb img { width:100%;height:100%;object-fit:cover; }
    .result-copy { min-width:0; }.result-copy strong,.result-copy small,.result-copy p { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .result-copy strong { font-size:13px; }.result-copy small { margin-top:2px;color:var(--text-2);font-size:12px; }.result-copy p { margin:5px 0 0;font-size:14px; }
    .check { width:19px;height:19px;display:grid;place-items:center;color:transparent;border:1px solid var(--border);border-radius:50%;font-size:11px; }.result.active .check { color:#fff;background:var(--accent);border-color:var(--accent); }
    .footer-actions { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:10px;background:var(--bg);border-top:1px solid var(--border); }
    .message { display:none;padding:8px 9px;border-radius:9px;font-size:13px;line-height:1.5;overflow-wrap:anywhere; }.message.show { display:block; }.message.info { color:var(--text-2);background:var(--muted); }.message.error { color:var(--negative);background:color-mix(in srgb,var(--negative) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--negative) 24%,var(--border)); }
    @media (max-width:440px) { .field-row,.run-row { grid-template-columns:1fr; }.footer-actions { grid-template-columns:1fr; } }
  </style>
<!-- hios-ui:start --><link rel="stylesheet" href="../shared/hios-ui.css"><link rel="stylesheet" href="../shared/hios-adapter.css"><script src="../shared/hios-ui.js" data-plugin-id="ai-prompt-library"></script><!-- hios-ui:end -->
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-icon">✦</span><span><strong>AI 提示词库</strong><small>分类保存 · 随机抽取</small></span></div>
      <span id="status" class="status">未连接</span>
    </header>
    <div class="scroll"><div class="stack">
      <section id="settingsPanel" class="panel open">
        <button id="settingsToggle" class="panel-head" type="button" aria-expanded="true" aria-controls="settingsBody"><span><strong>连接设置</strong><small id="settingsSummary">密钥仅保存在插件隔离存储中</small></span><b class="chevron">⌄</b></button>
        <div id="settingsBody" class="panel-body">
          <div class="save-category-field">
            <label for="serviceTrigger">选择服务</label>
            <select id="serviceSelect" aria-hidden="true" tabindex="-1" hidden></select>
            <button id="serviceTrigger" class="save-category-trigger" type="button" role="combobox" aria-label="选择服务" aria-haspopup="listbox" aria-expanded="false" aria-controls="serviceMenu"><span id="serviceCaption" class="save-category-caption">请选择服务</span></button>
          </div>
          <div class="actions"><button id="addService" class="btn" type="button">新增服务</button><button id="deleteService" class="btn" type="button">删除服务</button></div>
          <div id="deleteConfirm" class="actions" hidden><span class="note">删除此服务及其本机密钥？</span><button id="confirmDelete" class="btn" type="button">确认删除</button><button id="cancelDelete" class="btn" type="button">取消</button></div>
          <label>服务名称<input id="serviceName" placeholder="例如：我的提示词库" autocomplete="off" /></label>
          <label>服务地址<input id="serverUrl" inputmode="url" placeholder="http://NAS-IP:8765" autocomplete="off" /></label>
          <label>访问密钥<div class="input-wrap"><input id="apiKey" class="secret" type="password" placeholder="填写 ComfyUI / API Key" autocomplete="off" /><button id="revealKey" class="reveal" type="button" aria-label="显示或隐藏密钥">显示</button></div></label>
          <div class="actions"><button id="connect" class="btn primary" type="button">连接并读取分类</button><button id="clearKey" class="btn" type="button">清除密钥</button></div>
          <p class="note">填写服务根地址，不要附加 <code>/api/v1</code>。</p>
        </div>
      </section>

      <section id="savePanel" class="panel" aria-label="保存素材">
        <button id="saveToggle" class="panel-head" type="button" aria-expanded="false" aria-controls="saveBody"><span><strong>保存到提示词库</strong><small>连接图片、提示词，或同时连接两者</small></span><b class="chevron">⌄</b></button>
        <div id="saveBody" class="panel-body">
          <div class="save-inputs">
            <div class="save-input"><strong>图片输入</strong><span id="imageInputStatus">未连接</span></div>
            <div class="save-input"><strong>提示词输入</strong><span id="promptInputStatus">未连接</span></div>
          </div>
          <div class="save-category-field">
            <label for="saveCategoryTrigger">保存分类</label>
            <select id="saveCategory" aria-hidden="true" tabindex="-1" hidden><option value="">请先连接服务</option></select>
            <button id="saveCategoryTrigger" class="save-category-trigger" type="button" role="combobox" aria-label="保存分类" aria-haspopup="listbox" aria-expanded="false" aria-controls="saveCategoryMenu" disabled><span id="saveCategoryCaption" class="save-category-caption">请先连接服务</span></button>
          </div>
          <div class="actions"><button id="saveAsset" class="btn primary" type="button">保存到分类</button><button id="forceSave" class="btn" type="button" hidden>仍然保存重复图片</button></div>
          <p id="saveNote" class="note" aria-live="polite">仅保存素材，不自动调用 AI 分析；保存分类与抽取范围互不影响。</p>
        </div>
      </section>

      <section id="drawPanel" class="panel open">
        <div class="panel-heading"><button id="drawToggle" class="panel-head" type="button" aria-expanded="true" aria-controls="drawBody"><span><strong>抽取范围</strong><small>不选择分类时使用全部授权分类</small></span><b class="chevron">⌄</b></button><button id="reloadCategories" class="btn" type="button">刷新</button></div>
        <div id="drawBody" class="panel-body">
          <div id="categories" class="categories"><div class="empty">连接服务后读取分类</div></div>
          <div class="run-row">
            <label>抽取数量<input id="count" type="number" min="1" max="20" step="1" value="1" /></label>
            <label>随机 Seed<input id="seed" type="number" min="0" max="2147483647" step="1" value="0" /></label>
            <label class="auto"><input id="autoOutput" type="checkbox" checked />抽取后自动输出</label>
          </div>
        </div>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <section>
        <div class="result-head"><strong>候选提示词</strong><span id="resultCount">还没有抽取</span></div>
        <div id="results" class="results"><div class="empty">点击“运行”随机抽取提示词</div></div>
      </section>
    </div></div>
    <div class="footer-actions"><button id="random" class="btn primary" type="button" aria-label="运行，随机抽取提示词"><svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg><span>运行</span><span class="run-hint">· 随机抽取</span></button><button id="output" class="btn" type="button" disabled>输出到画布</button></div>
  </main>
  <div id="saveCategoryMenu" class="save-category-menu" role="listbox" aria-label="保存分类" hidden></div>
  <div id="serviceMenu" class="save-category-menu" role="listbox" aria-label="选择服务" hidden></div>
  <script>
    (() => {
      'use strict';
      const PROTOCOL = 'hios-plugin-node/v1';
      const STORAGE_URL = 'hios.ai-prompt-library.server-url';
      const STORAGE_KEY = 'hios.ai-prompt-library.api-key';
      const STORAGE_SCOPE = 'hios.ai-prompt-library.connection-scope';
      const STORAGE_SERVICES = 'hios.ai-prompt-library.services-v1';
      const $ = (id) => document.getElementById(id);
      const els = { status:$('status'), panel:$('settingsPanel'), settingsToggle:$('settingsToggle'), settingsSummary:$('settingsSummary'), serviceSelect:$('serviceSelect'), serviceTrigger:$('serviceTrigger'), serviceCaption:$('serviceCaption'), serviceMenu:$('serviceMenu'), addService:$('addService'), deleteService:$('deleteService'), deleteConfirm:$('deleteConfirm'), confirmDelete:$('confirmDelete'), cancelDelete:$('cancelDelete'), serviceName:$('serviceName'), serverUrl:$('serverUrl'), apiKey:$('apiKey'), revealKey:$('revealKey'), clearKey:$('clearKey'), connect:$('connect'), savePanel:$('savePanel'), saveToggle:$('saveToggle'), drawPanel:$('drawPanel'), drawToggle:$('drawToggle'), reload:$('reloadCategories'), categories:$('categories'), count:$('count'), seed:$('seed'), autoOutput:$('autoOutput'), message:$('message'), results:$('results'), resultCount:$('resultCount'), random:$('random'), output:$('output'), imageInputStatus:$('imageInputStatus'), promptInputStatus:$('promptInputStatus'), saveCategory:$('saveCategory'), saveCategoryTrigger:$('saveCategoryTrigger'), saveCategoryCaption:$('saveCategoryCaption'), saveCategoryMenu:$('saveCategoryMenu'), save:$('saveAsset'), forceSave:$('forceSave'), saveNote:$('saveNote') };
      let nodeId = '';
      let pluginId = 'ai-prompt-library';
      let categories = [];
      let busy = false;
      let connectionSignature = '';
      let knownConnectionSignature = '';
      let connectionDirty = false;
      let activeProfileScope = '';
      let operationEpoch = 0;
      let hydrated = false;
      let nameDirty = false;
      let inputs = {};
      let duplicateSnapshot = null;
      const pendingRequests = new Map();
      let state = { serviceId:'', connectionScope:'', selectedCategoryIds:[], saveCategoryId:null, lastSavedAssetId:null, saveScope:'', settingsOpen:true, saveOpen:false, drawOpen:true, count:1, seed:0, autoOutput:true, selectedIndex:0, lastItems:[] };

      function post(type, payload = {}) { parent.postMessage({ protocol:PROTOCOL, nodeId, pluginId, type, payload }, '*'); }
      function safeNumber(value, min, max, fallback) { const number = Number(value); return Number.isFinite(number) ? Math.max(min, Math.min(max, Math.trunc(number))) : fallback; }
      function normalizedBase(url = els.serverUrl.value) { const value = String(url || '').trim().replace(/\/+$/, '').replace(/\/api\/v1$/i, ''); if (!/^https?:\/\//i.test(value)) throw new Error('服务地址必须以 http:// 或 https:// 开头'); return value; }
      function headers(key, json = false) { const result = {}; if (key) result['X-API-Key'] = key; if (json) result['Content-Type'] = 'application/json'; return result; }
      function newScope() { return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2,'0')).join(''); }
      function readCatalog() {
        try { const parsed=JSON.parse(localStorage.getItem(STORAGE_SERVICES) || 'null'); if (parsed && Array.isArray(parsed.services)) return parsed; } catch {}
        return null;
      }
      function initializeCatalog() {
        let catalog=readCatalog();
        if (catalog) return catalog;
        const url=localStorage.getItem(STORAGE_URL) || '', key=localStorage.getItem(STORAGE_KEY) || '';
        const id=newScope(), legacy=!!(url || key);
        const service={ id, name:legacy ? '原有服务' : '默认服务', url, key, scope:localStorage.getItem(STORAGE_SCOPE) || newScope() };
        catalog={ version:1, defaultId:id, legacyId:legacy ? id : '', services:[service] };
        localStorage.setItem(STORAGE_SERVICES,JSON.stringify(catalog));
        // Remove the old copies only after the new catalog was written, so
        // deleting a migrated service also removes its last stored key.
        if (legacy) { localStorage.removeItem(STORAGE_URL); localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_SCOPE); }
        return catalog;
      }
      function profileFor(id, catalog = readCatalog()) { return catalog?.services.find(item => item && item.id === id) || null; }
      function profileSignature(profile) { return `${String(profile?.url || '').trim().replace(/\/+$/, '').replace(/\/api\/v1$/i, '')}\n${String(profile?.key || '').trim()}`; }
      function stateForHost() { return { serviceId:state.serviceId, connectionScope:state.connectionScope, selectedCategoryIds:[...state.selectedCategoryIds], saveCategoryId:state.saveCategoryId, lastSavedAssetId:state.lastSavedAssetId, saveScope:state.saveScope, settingsOpen:state.settingsOpen, saveOpen:state.saveOpen, drawOpen:state.drawOpen, count:state.count, seed:state.seed, autoOutput:state.autoOutput, selectedIndex:state.selectedIndex, lastItems:state.lastItems.slice(0,20).map((item) => ({ asset_id:item.asset_id, category_id:item.category_id, category_name:String(item.category_name || ''), prompt:String(item.prompt || ''), thumbnail_url:String(item.thumbnail_url || '') })) }; }
      function persist() { post('state', { state:stateForHost() }); }
      function setStatus(text, kind = '') { els.status.textContent = text; els.status.className = `status ${kind}`.trim(); }
      function showMessage(text = '', kind = 'info') { els.message.textContent = text; els.message.className = text ? `message show ${kind}` : 'message'; }
      function setPanel(panel, toggle, open) { panel.classList.toggle('open',open); toggle.setAttribute('aria-expanded',String(open)); }
      function setBusy(next, label = '') { busy = next; const missing=!profileFor(state.serviceId); els.connect.disabled = next || missing; els.reload.disabled = next || missing; els.random.disabled = next || missing; els.output.disabled = next || !state.lastItems.length; els.save.disabled = next || missing; els.forceSave.disabled = next || missing; els.saveCategory.disabled = next || !categories.length; syncSaveCategory(); els.serviceSelect.disabled=next; syncServiceMenu(); els.addService.disabled=next; els.deleteService.disabled=next || missing; els.confirmDelete.disabled=next; els.serviceName.disabled=next || missing; els.serverUrl.disabled=next || missing; els.apiKey.disabled=next || missing; els.revealKey.disabled=next || missing; els.clearKey.disabled=next || missing; if (next && label) showMessage(label, 'info'); }
      function applyTheme(theme) {

          const check=document.createElement('span'); check.className='check'; check.textContent='✓'; button.append(thumb,copy,check);
          button.addEventListener('click',()=>{ state.selectedIndex=index; renderResults(); persist(); }); els.results.append(button);
        });
      }
      function emitSelected() {
        try { connectionContext(); } catch (error) { showMessage(error instanceof Error ? error.message : String(error),'error'); return; }
        const item = state.lastItems[state.selectedIndex];
        if (!item || !String(item.prompt || '').trim()) { showMessage('请先随机抽取并选择一条提示词', 'error'); return; }
        post('output', { output:{ kind:'text', portId:'prompt', value:String(item.prompt), name:`${item.category_name || '提示词'} #${item.asset_id || ''}`.trim(), metadata:{ assetId:item.asset_id, categoryId:item.category_id, categoryName:item.category_name, thumbnailUrl:fullUrl(item.thumbnail_url) } } });
        setStatus('已输出', 'ok'); showMessage('当前提示词已写入画布输出端口，可连接到下游节点。', 'info');
      }
      async function loadCategories(quiet = false) {
        if (busy) return; setBusy(true, quiet ? '' : '正在连接提示词库…'); let connection;
        try {
          saveConnection();
          connection=connectionContext();
          if (state.saveScope && state.saveScope !== connection.scope) { state.saveCategoryId = null; state.lastSavedAssetId = null; state.saveScope = ''; }
          const health = await request(connection, '/api/v1/health');
          assertContext(connection);
          const rows = await request(connection, '/api/v1/categories?enabled_only=true');
          assertContext(connection);
          if (!Array.isArray(rows)) throw new Error('分类接口返回格式不正确');
          categories = rows.filter((item) => item && Number.isFinite(Number(item.id)));
          state.selectedCategoryIds = state.selectedCategoryIds.filter((id) => categories.some((item) => Number(item.id) === id));
          if (!categories.some((item) => Number(item.id) === state.saveCategoryId)) state.saveCategoryId = null;
          connectionSignature = currentSignature(); knownConnectionSignature = connectionSignature; connectionDirty = false; clearDuplicate();
          renderCategories(); renderSave(); persist(); setStatus('已连接', 'ok'); showMessage(`服务连接正常，共读取 ${categories.length} 个分类。`, 'info');
          if (health && health.status !== 'ok') showMessage('服务已响应，但健康状态不是 ok。', 'error');
        } catch (error) { if (connection && !contextCurrent(connection)) { reconcileProfile(); showMessage('服务配置已变化，本次结果未应用，请重新连接。','error'); return; } categories=[]; connectionSignature=''; clearDuplicate(); renderCategories(); renderSave(); setStatus('连接失败','error'); showMessage(error instanceof Error ? error.message : String(error),'error'); post('error',{message:error instanceof Error?error.message:String(error)}); }
        finally { setBusy(false); }
      }
      async function randomPrompt(forceOutput = false) {
        if (busy) return;
        try { connectionContext(); } catch (error) { const message=error instanceof Error ? error.message : String(error); showMessage(message,'error'); if (forceOutput) post('error',{message}); return; }
        if (!categories.length) { await loadCategories(true); if (!categories.length) return; }
        let connection; try { connection=connectionContext(true); } catch (error) { const message=error instanceof Error ? error.message : String(error); showMessage(message,'error'); if (forceOutput) post('error',{message}); return; }
        const ids = state.selectedCategoryIds.length ? state.selectedCategoryIds : categories.map((item)=>Number(item.id));
        state.count=safeNumber(els.count.value,1,20,1); state.seed=safeNumber(els.seed.value,0,2147483647,0); state.autoOutput=els.autoOutput.checked;
        setBusy(true,'正在随机抽取提示词…');
        try {
          const result=await request(connection,'/api/v1/random',{method:'POST',body:JSON.stringify({category_ids:ids,count:state.count,seed:state.seed})});
          assertContext(connection);
          const items=result && Array.isArray(result.items) ? result.items.filter((item)=>item && String(item.prompt || '').trim()) : [];
          if (!items.length) throw new Error('所选分类中没有可用提示词');
          state.lastItems=items; state.selectedIndex=0; renderResults(); persist(); setStatus('抽取完成','ok'); showMessage(`已抽取 ${items.length} 条提示词。`,'info'); if(forceOutput || state.autoOutput) emitSelected();
        } catch(error) { if (!contextCurrent(connection)) { reconcileProfile(); const message='服务配置已变化，本次结果未应用，请重新连接。'; showMessage(message,'error'); if (forceOutput) post('error',{message}); return; } setStatus('抽取失败','error'); showMessage(error instanceof Error?error.message:String(error),'error'); post('error',{message:error instanceof Error?error.message:String(error)}); }
        finally { setBusy(false); renderResults(); }
      }
      function selectService(id) {
        if (busy || id===state.serviceId) { renderServices(); return; }
        if (profileFor(state.serviceId)) {
          try { saveConnection(); } catch (error) { renderServices(); showMessage(error instanceof Error ? error.message : String(error),'error'); return; }
        }
        const profile=profileFor(id); if (id && !profile) { renderServices(); return; }
        clearConnectionData(); state.serviceId=id; state.connectionScope=String(profile?.scope || ''); loadProfile(profile);
        renderServices(); setBusy(false); persist(); setStatus('未连接'); showMessage(profile ? '服务已切换，请连接并选择分类。' : '请选择或新增服务。','info');
      }
      function addService() {
        if (busy) return;
        if (profileFor(state.serviceId)) { try { saveConnection(); } catch (error) { showMessage(error instanceof Error ? error.message : String(error),'error'); return; } }
        const catalog=readCatalog(); if (!catalog) return;
        const service={id:newScope(),name:`服务 ${catalog.services.length+1}`,url:'',key:'',scope:newScope()};
        catalog.services.push(service); if (!catalog.defaultId) catalog.defaultId=service.id;
        localStorage.setItem(STORAGE_SERVICES,JSON.stringify(catalog)); selectService(service.id);
        state.settingsOpen=true; setPanel(els.panel,els.settingsToggle,true); persist(); els.serviceName.focus();
      }
      function deleteService() {
        if (busy || !reconcileProfile()) return;
        const catalog=readCatalog(), id=state.serviceId; if (!profileFor(id,catalog)) return;
        catalog.services=catalog.services.filter(item=>item.id!==id);
        if (catalog.defaultId===id) catalog.defaultId=catalog.services[0]?.id || '';
        localStorage.setItem(STORAGE_SERVICES,JSON.stringify(catalog));
        clearConnectionData(); state.serviceId=''; state.connectionScope=''; loadProfile(null); renderServices(); setBusy(false); persist();
        setStatus('未连接'); showMessage('服务及其本机密钥已删除，请选择或新增服务。','info');
      }
      function hydrate(payload) {
        const incoming=payload && payload.state && typeof payload.state==='object' ? payload.state : {};
        const previous=snapshotForSave(), oldId=state.serviceId, first=!hydrated, catalog=readCatalog();
        if (payload && Object.prototype.hasOwnProperty.call(payload,'inputs')) inputs=payload.inputs && typeof payload.inputs==='object' ? payload.inputs : {};
        const hasService=Object.prototype.hasOwnProperty.call(incoming,'serviceId');
        const legacyData=!!(incoming.saveScope || incoming.saveCategoryId || incoming.lastSavedAssetId || (Array.isArray(incoming.selectedCategoryIds) && incoming.selectedCategoryIds.length) || (Array.isArray(incoming.lastItems) && incoming.lastItems.length));
        state={...state,...incoming,selectedCategoryIds:Array.isArray(incoming.selectedCategoryIds) ? incoming.selectedCategoryIds.map(Number).filter(Number.isFinite) : state.selectedCategoryIds,lastItems:Array.isArray(incoming.lastItems) ? incoming.lastItems.slice(0,20) : state.lastItems};
        if (hasService) state.serviceId=typeof incoming.serviceId==='string' ? incoming.serviceId : '';
        else if (first && legacyData && catalog?.legacyId) state.serviceId=catalog.legacyId;
        else if (first) state.serviceId=state.serviceId || catalog?.defaultId || '';
        const profile=profileFor(state.serviceId,catalog);
        if (first || oldId!==state.serviceId) {
          if (!first || oldId!==state.serviceId) { operationEpoch++; connectionSignature=''; categories=[]; clearDuplicate(); }
          loadProfile(profile);
        }
        state.saveCategoryId=validId(state.saveCategoryId); state.lastSavedAssetId=validId(state.lastSavedAssetId); state.saveScope=typeof state.saveScope==='string' ? state.saveScope : '';
        if (first && !Object.prototype.hasOwnProperty.call(incoming,'connectionScope')) {
          const legacyMatches=!hasService && !!catalog?.legacyId && state.serviceId===catalog.legacyId && (!state.saveScope || state.saveScope===profile?.scope);
          state.connectionScope=profile && (!legacyData || legacyMatches) ? String(profile.scope || '') : '';
        }
        if (connectionDirty) {
          clearConnectionData(); state.connectionScope='';
        } else if (!profile || state.connectionScope!==profile.scope || (state.saveScope && state.saveScope!==profile.scope)) {
          clearConnectionData(); state.connectionScope=String(profile?.scope || '');
        } else if ((state.saveCategoryId || state.lastSavedAssetId) && state.saveScope!==profile.scope) {
          state.saveCategoryId=null; state.lastSavedAssetId=null; state.saveScope='';
        }
        state.count=safeNumber(state.count,1,20,1); state.seed=safeNumber(state.seed,0,2147483647,0); state.selectedIndex=safeNumber(state.selectedIndex,0,Math.max(0,state.lastItems.length-1),0); state.autoOutput=state.autoOutput!==false;
        state.settingsOpen=state.settingsOpen!==false; state.saveOpen=state.saveOpen===true; state.drawOpen=state.drawOpen!==false;
        if (!sameSnapshot(previous,snapshotForSave())) clearDuplicate();
        els.count.value=String(state.count); els.seed.value=String(state.seed); els.autoOutput.checked=state.autoOutput;
        setPanel(els.panel,els.settingsToggle,state.settingsOpen); setPanel(els.savePanel,els.saveToggle,state.saveOpen); setPanel(els.drawPanel,els.drawToggle,state.drawOpen);
        hydrated=true; renderServices(); renderCategories(); renderResults(); renderSave(); setBusy(busy); applyTheme(payload && payload.theme);
      }

      els.settingsToggle.addEventListener('click',()=>{state.settingsOpen=!state.settingsOpen;setPanel(els.panel,els.settingsToggle,state.settingsOpen);persist();});
      els.saveToggle.addEventListener('click',()=>{state.saveOpen=!state.saveOpen;setPanel(els.savePanel,els.saveToggle,state.saveOpen);if(!state.saveOpen)closeSaveCategoryMenu();persist();});
      els.drawToggle.addEventListener('click',()=>{state.drawOpen=!state.drawOpen;setPanel(els.drawPanel,els.drawToggle,state.drawOpen);persist();});
      els.serviceSelect.addEventListener('change',()=>selectService(els.serviceSelect.value));
      els.addService.addEventListener('click',addService);
      els.deleteService.addEventListener('click',()=>{els.deleteConfirm.hidden=false;});
      els.cancelDelete.addEventListener('click',()=>{els.deleteConfirm.hidden=true;});
      els.confirmDelete.addEventListener('click',deleteService);
      els.revealKey.addEventListener('click',()=>{const reveal=els.apiKey.type==='password';els.apiKey.type=reveal?'text':'password';els.revealKey.textContent=reveal?'隐藏':'显示';});
      els.clearKey.addEventListener('click',()=>{els.apiKey.value='';invalidateConnection();try{saveConnection();persist();setStatus('密钥已清除');showMessage('此服务的本机密钥已清除。','info');}catch(error){showMessage(error instanceof Error?error.message:String(error),'error');}});
      els.connect.addEventListener('click',()=>loadCategories(false)); els.reload.addEventListener('click',()=>loadCategories(false)); els.random.addEventListener('click',()=>randomPrompt(false)); els.output.addEventListener('click',emitSelected);
      els.save.addEventListener('click',()=>void saveAsset(false)); els.forceSave.addEventListener('click',()=>void saveAsset(true));
      els.saveCategory.addEventListener('change',()=>{try{const connection=connectionContext(true);state.saveCategoryId=validId(els.saveCategory.value);state.saveScope=connection.scope;clearDuplicate();renderSave();persist();}catch(error){renderSave();showMessage(error instanceof Error?error.message:String(error),'error');}});
      els.serverUrl.addEventListener('input',invalidateConnection); els.apiKey.addEventListener('input',invalidateConnection);
      els.serviceName.addEventListener('input',()=>{nameDirty=true;});
      for (const field of [els.serviceName,els.serverUrl,els.apiKey]) field.addEventListener('change',()=>{try{invalidateConnection();saveConnection();persist();}catch(error){showMessage(error instanceof Error?error.message:String(error),'error');}});
      els.count.addEventListener('change',()=>{state.count=safeNumber(els.count.value,1,20,1);els.count.value=String(state.count);persist();});
      els.seed.addEventListener('change',()=>{state.seed=safeNumber(els.seed.value,0,2147483647,0);els.seed.value=String(state.seed);persist();});
      els.autoOutput.addEventListener('change',()=>{state.autoOutput=els.autoOutput.checked;persist();});
      window.addEventListener('storage',event=>{if(event.key===STORAGE_SERVICES || event.key===null){if(state.serviceId)reconcileProfile();else renderServices();}});
      window.addEventListener('message',(event)=>{
        const message=event.data;
        if(event.source!==parent||!message||message.protocol!==PROTOCOL||(message.pluginId&&message.pluginId!==pluginId))return;
        if(message.type==='asset-result'||message.type==='network-result'){ receiveHostResult(message.type,message.payload||{}); return; }
        nodeId=String(message.nodeId||message.payload?.nodeId||nodeId);
        pluginId=String(message.pluginId||message.payload?.pluginId||pluginId);
        if(message.type==='init'){
          hydrate(message.payload||{});
          post('loaded',{});
          return;
        }
        if(message.type==='run'){
          // A downstream run asks every runnable upstream plugin for a fresh
          // output. Rehydrate the host's latest state, draw a new random item,
          // and always emit the selected prompt even when manual auto-output
          // is disabled. The output settles the host run promise immediately.
          hydrate(message.payload||{});
          if (busy) { post('error', { message:'插件正在处理请求，请稍后再运行' }); return; }
          void randomPrompt(true);
        }
      });
      const initialCatalog=initializeCatalog(); state.serviceId=initialCatalog.defaultId || ''; const initialProfile=profileFor(state.serviceId,initialCatalog); state.connectionScope=String(initialProfile?.scope || ''); loadProfile(initialProfile); renderServices(); renderCategories(); renderResults(); renderSave(); setBusy(false); post('ready',{version:'0.3.0'});
    })();
  </script>
