<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 提示词库</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#edf2f6;--surface:#f6f9fb;--muted:#e8eef3;--control:#e7edf2;
      --text:#253143;--text-2:#5f6c7e;--text-3:#8e99a7;--border:#cbd6df;
      --accent:#007aff;--accent-soft:rgba(0,122,255,.1);--positive:#2e9b63;--negative:#d4525f;
      --shadow:0 12px 34px rgba(44,60,78,.12);--radius:14px;
    }
    :root[data-theme="dark"] { color-scheme:dark;--bg:#18212c;--surface:#202c39;--muted:#17212b;--control:#253240;--text:#edf3f8;--text-2:#b6c1cd;--text-3:#7f8c99;--border:#344352;--accent-soft:rgba(50,145,255,.16);--shadow:0 14px 38px rgba(0,0,0,.26); }
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden; }
    body { color:var(--text);background:var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.5; }
    button,input,select { font:inherit; }
    [hidden] { display:none !important; }
    button { border:0;cursor:pointer; }
    .app { height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto; }
    .top { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface); }
    .brand { min-width:0;display:flex;align-items:center;gap:9px; }
    .brand-icon { width:31px;height:31px;display:grid;place-items:center;flex:none;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:10px;font-size:17px; }
    .brand strong,.brand small { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .brand strong { font-size:15px;font-weight:700; }
    .brand small { margin-top:2px;color:var(--text-2);font-size:12px; }
    .status { display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 8px;color:var(--text-2);background:var(--muted);border:1px solid var(--border);border-radius:999px;font-size:12px; }
    .status::before { content:"";width:6px;height:6px;background:currentColor;border-radius:50%; }
    .status.ok { color:var(--positive); }.status.error { color:var(--negative); }
    .scroll { min-height:0;overflow:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent; }
    .stack { display:grid;gap:9px; }
    .panel { overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 5px 18px rgba(29,48,67,.05); }
    .panel-head { width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;color:var(--text);background:transparent;text-align:left; }
    .panel-head span { display:grid;gap:2px;min-width:0; }.panel-head strong { font-size:14px; }.panel-head small { color:var(--text-2);font-size:12px;font-weight:400; }
    .chevron { color:var(--text-3);font-size:12px;transition:transform .15s ease; }.panel.open .chevron { transform:rotate(180deg); }
    .panel-body { display:none;padding:0 11px 11px; }.panel.open .panel-body { display:grid;gap:8px; }
    label { display:grid;gap:5px;min-width:0;color:var(--text-2);font-size:13px; }
    .field-row { display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:7px; }
    .input-wrap { position:relative; }
    input { width:100%;min-width:0;height:36px;padding:0 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;outline:0;font-size:14px; }
    select { width:100%;min-width:0;height:36px;padding:0 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;font-size:14px; }
    /* Text entry keeps its normal border, including on older HIOS hosts. */
    input:focus { outline:none;box-shadow:none; }
    input::placeholder { color:var(--text-2);opacity:1; }
    input[type="number"] { appearance:textfield;-moz-appearance:textfield; }
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button { appearance:none;margin:0; }
    .secret { padding-right:56px; }.reveal { position:absolute;right:4px;top:4px;width:46px;height:28px;color:var(--text-2);background:transparent;border-radius:6px;font-size:12px;white-space:nowrap; }.reveal:hover { color:var(--accent);background:var(--accent-soft); }
    .actions { display:flex;flex-wrap:wrap;gap:6px; }
    .btn { min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:600; }
    .btn:hover { color:var(--text);border-color:color-mix(in srgb,var(--accent) 42%,var(--border)); }
    .btn.primary { color:#fff;background:var(--accent);border-color:var(--accent); }
    .run-icon { width:14px;height:14px;fill:currentColor; }
    .run-hint { font-size:12px;font-weight:400;opacity:.85; }
    .btn.primary:hover { filter:brightness(1.06); }.btn:disabled { opacity:.42;cursor:not-allowed; }
    .note { margin:0;color:var(--text-2);font-size:12px;line-height:1.6;overflow-wrap:anywhere; }
    .categories { display:flex;flex-wrap:wrap;gap:5px; }
    .category { display:inline-flex;align-items:center;gap:5px;max-width:100%;min-height:32px;padding:4px 8px;color:var(--text);background:var(--control);border:1px solid var(--border);border-radius:8px;font-size:13px;overflow-wrap:anywhere; }
    .category:hover { border-color:color-mix(in srgb,var(--accent) 40%,var(--border)); }.category.active { color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 42%,var(--border)); }
    .category em { color:var(--text-2);font-size:12px;font-style:normal; }
    .empty { padding:12px;color:var(--text-2);background:var(--muted);border:1px dashed var(--border);border-radius:10px;text-align:center;font-size:13px; }
    .save-inputs { display:grid;grid-template-columns:1fr 1fr;gap:7px; }
    .save-input { min-width:0;padding:8px;background:var(--muted);border:1px solid var(--border);border-radius:9px; }
    .save-input strong,.save-input span { display:block;overflow:hidden;text-overflow:ellipsis; }
    .save-input strong { color:var(--text);font-size:13px; }
    .save-input span { margin-top:3px;color:var(--text-2);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3; }
    .run-row { display:grid;grid-template-columns:80px 100px minmax(0,1fr);gap:7px;align-items:end; }
    .auto { min-height:36px;display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--text-2);background:var(--control);border:1px solid var(--border);border-radius:9px;font-size:12px; }
    .auto input { width:14px;height:14px;padding:0;accent-color:var(--accent);box-shadow:none; }
    .result-head { display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 1px; }
    .result-head strong { font-size:14px; }.result-head span { color:var(--text-2);font-size:12px; }
    .results { display:grid;gap:6px; }
    .result { width:100%;display:grid;grid-template-columns:43px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:11px;text-align:left; }
    .result:hover { border-color:color-mix(in srgb,var(--accent) 38%,var(--border)); }.result.active { color:var(--text);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 48%,var(--border)); }
    .thumb { width:43px;height:43px;display:grid;place-items:center;overflow:hidden;color:var(--text-3);background:var(--muted);border-radius:8px;font-size:15px; }.thumb img { width:100%;height:100%;object-fit:cover; }
    .result-copy { min-width:0; }.result-copy strong,.result-copy small,.result-copy p { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .result-copy strong { font-size:13px; }.result-copy small { margin-top:2px;color:var(--text-2);font-size:12px; }.result-copy p { margin:5px 0 0;font-size:14px; }
    .check { width:19px;height:19px;display:grid;place-items:center;color:transparent;border:1px solid var(--border);border-radius:50%;font-size:11px; }.result.active .check { color:#fff;background:var(--accent);border-color:var(--accent); }
    .footer-actions { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:10px;background:var(--bg);border-top:1px solid var(--border); }
    .message { display:none;padding:8px 9px;border-radius:9px;font-size:13px;line-height:1.5;overflow-wrap:anywhere; }.message.show { display:block; }.message.info { color:var(--text-2);background:var(--muted); }.message.error { color:var(--negative);background:color-mix(in srgb,var(--negative) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--negative) 24%,var(--border)); }
    @media (max-width:440px) { .field-row,.run-row { grid-template-columns:1fr; }.footer-actions { grid-template-columns:1fr; } }
  </style>
<!-- hios-ui:start --><link rel="stylesheet" href="../shared/hios-ui.css"><link rel="stylesheet" href="../shared/hios-adapter.css"><script src="../shared/hios-ui.js" data-plugin-id="ai-prompt-library"></script><!-- hios-ui:end -->
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-icon">✦</span><span><strong>AI 提示词库</strong><small>分类保存 · 随机抽取</small></span></div>
      <span id="status" class="status">未连接</span>
    </header>
    <div class="scroll"><div class="stack">
      <section id="settingsPanel" class="panel open">
        <button id="settingsToggle" class="panel-head" type="button"><span><strong>连接设置</strong><small>密钥仅保存在插件隔离存储中</small></span><b class="chevron">⌄</b></button>
        <div class="panel-body">
          <label>服务地址<input id="serverUrl" inputmode="url" placeholder="http://NAS-IP:8765" autocomplete="off" /></label>
          <label>访问密钥<div class="input-wrap"><input id="apiKey" class="secret" type="password" placeholder="填写 ComfyUI / API Key" autocomplete="off" /><button id="revealKey" class="reveal" type="button" aria-label="显示或隐藏密钥">显示</button></div></label>
          <div class="actions"><button id="connect" class="btn primary" type="button">连接并读取分类</button><button id="clearKey" class="btn" type="button">清除密钥</button></div>
          <p class="note">填写服务根地址，不要附加 <code>/api/v1</code>。</p>
        </div>
      </section>

      <section class="panel open" aria-label="保存素材">
        <div class="panel-head"><span><strong>保存到提示词库</strong><small>连接图片、提示词，或同时连接两者</small></span></div>
        <div class="panel-body">
          <div class="save-inputs">
            <div class="save-input"><strong>图片输入</strong><span id="imageInputStatus">未连接</span></div>
            <div class="save-input"><strong>提示词输入</strong><span id="promptInputStatus">未连接</span></div>
          </div>
          <label>保存分类<select id="saveCategory" aria-label="保存分类"><option value="">请先连接服务</option></select></label>
          <div class="actions"><button id="saveAsset" class="btn primary" type="button">保存到分类</button><button id="forceSave" class="btn" type="button" hidden>仍然保存重复图片</button></div>
          <p id="saveNote" class="note" aria-live="polite">仅保存素材，不自动调用 AI 分析；保存分类与抽取范围互不影响。</p>
        </div>
      </section>

      <section class="panel open">
        <div class="panel-head"><span><strong>抽取范围</strong><small>不选择分类时使用全部授权分类</small></span><button id="reloadCategories" class="btn" type="button">刷新</button></div>
        <div class="panel-body" style="display:grid">
          <div id="categories" class="categories"><div class="empty">连接服务后读取分类</div></div>
          <div class="run-row">
            <label>抽取数量<input id="count" type="number" min="1" max="20" step="1" value="1" /></label>
            <label>随机 Seed<input id="seed" type="number" min="0" max="2147483647" step="1" value="0" /></label>
            <label class="auto"><input id="autoOutput" type="checkbox" checked />抽取后自动输出</label>
          </div>
        </div>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <section>
        <div class="result-head"><strong>候选提示词</strong><span id="resultCount">还没有抽取</span></div>
        <div id="results" class="results"><div class="empty">点击“运行”随机抽取提示词</div></div>
      </section>
    </div></div>
    <div class="footer-actions"><button id="random" class="btn primary" type="button" aria-label="运行，随机抽取提示词"><svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg><span>运行</span><span class="run-hint">· 随机抽取</span></button><button id="output" class="btn" type="button" disabled>输出到画布</button></div>
  </main>
  <script>
    (() => {
      'use strict';
      const PROTOCOL = 'hios-plugin-node/v1';
      const STORAGE_URL = 'hios.ai-prompt-library.server-url';
      const STORAGE_KEY = 'hios.ai-prompt-library.api-key';
      const STORAGE_SCOPE = 'hios.ai-prompt-library.connection-scope';
      const $ = (id) => document.getElementById(id);
      const els = { status:$('status'), panel:$('settingsPanel'), settingsToggle:$('settingsToggle'), serverUrl:$('serverUrl'), apiKey:$('apiKey'), revealKey:$('revealKey'), clearKey:$('clearKey'), connect:$('connect'), reload:$('reloadCategories'), categories:$('categories'), count:$('count'), seed:$('seed'), autoOutput:$('autoOutput'), message:$('message'), results:$('results'), resultCount:$('resultCount'), random:$('random'), output:$('output'), imageInputStatus:$('imageInputStatus'), promptInputStatus:$('promptInputStatus'), saveCategory:$('saveCategory'), save:$('saveAsset'), forceSave:$('forceSave'), saveNote:$('saveNote') };
      let nodeId = '';
      let pluginId = 'ai-prompt-library';
      let categories = [];
      let busy = false;
      let connectionSignature = '';
      let knownConnectionSignature = '';
      let connectionDirty = false;
      let inputs = {};
      let duplicateSnapshot = null;
      const pendingRequests = new Map();
      let state = { selectedCategoryIds:[], saveCategoryId:null, lastSavedAssetId:null, saveScope:'', count:1, seed:0, autoOutput:true, selectedIndex:0, lastItems:[] };

      function post(type, payload = {}) { parent.postMessage({ protocol:PROTOCOL, nodeId, pluginId, type, payload }, '*'); }
      function safeNumber(value, min, max, fallback) { const number = Number(value); return Number.isFinite(number) ? Math.max(min, Math.min(max, Math.trunc(number))) : fallback; }
      function normalizedBase() { const value = String(els.serverUrl.value || '').trim().replace(/\/+$/, '').replace(/\/api\/v1$/i, ''); if (!/^https?:\/\//i.test(value)) throw new Error('服务地址必须以 http:// 或 https:// 开头'); return value; }
      function headers(json = false) { const result = {}; const key = String(els.apiKey.value || '').trim(); if (key) result['X-API-Key'] = key; if (json) result['Content-Type'] = 'application/json'; return result; }
      function newScope() { return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2,'0')).join(''); }
      function currentScope() { let scope = localStorage.getItem(STORAGE_SCOPE); if (!scope) { scope = newScope(); localStorage.setItem(STORAGE_SCOPE, scope); } return scope; }
      function saveConnection() {
        const url = String(els.serverUrl.value || '').trim(); const key = String(els.apiKey.value || '').trim();
        if (url !== (localStorage.getItem(STORAGE_URL) || '') || key !== (localStorage.getItem(STORAGE_KEY) || '')) localStorage.setItem(STORAGE_SCOPE, newScope());
        localStorage.setItem(STORAGE_URL, url); localStorage.setItem(STORAGE_KEY, key);
      }
      function stateForHost() { return { selectedCategoryIds:[...state.selectedCategoryIds], saveCategoryId:state.saveCategoryId, lastSavedAssetId:state.lastSavedAssetId, saveScope:state.saveScope, count:state.count, seed:state.seed, autoOutput:state.autoOutput, selectedIndex:state.selectedIndex, lastItems:state.lastItems.slice(0,20).map((item) => ({ asset_id:item.asset_id, category_id:item.category_id, category_name:String(item.category_name || ''), prompt:String(item.prompt || ''), thumbnail_url:String(item.thumbnail_url || '') })) }; }
      function persist() { post('state', { state:stateForHost() }); }
      function setStatus(text, kind = '') { els.status.textContent = text; els.status.className = `status ${kind}`.trim(); }
      function showMessage(text = '', kind = 'info') { els.message.textContent = text; els.message.className = text ? `message show ${kind}` : 'message'; }
      function setBusy(next, label = '') { busy = next; els.connect.disabled = next; els.reload.disabled = next; els.random.disabled = next; els.output.disabled = next || !state.lastItems.length; els.save.disabled = next; els.forceSave.disabled = next; els.saveCategory.disabled = next || !categories.length; els.serverUrl.disabled = next; els.apiKey.disabled = next; els.clearKey.disabled = next; if (next && label) showMessage(label, 'info'); }
      function applyTheme(theme) {
        const mode = theme && theme.mode === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        const map = { background:'--bg', surface:'--surface', muted:'--muted', control:'--control', text:'--text', textSecondary:'--text-2', textMuted:'--text-3', border:'--border', accent:'--accent', accentSoft:'--accent-soft', positive:'--positive', negative:'--negative' };
        const tokens = theme && theme.tokens && typeof theme.tokens === 'object' ? theme.tokens : {};
        Object.entries(map).forEach(([key, css]) => { if (typeof tokens[key] === 'string' && tokens[key].trim()) document.documentElement.style.setProperty(css, tokens[key]); });
      }
      async function request(path, options = {}) {
        const base = normalizedBase();
        const response = await fetch(base + path, { ...options, headers:{ ...headers(typeof options.body === 'string'), ...(options.headers || {}) } });
        let data = null; try { data = await response.json(); } catch { data = null; }
        if (!response.ok) { const detail = data && (data.detail || data.message); const message = typeof detail === 'string' ? detail : Array.isArray(detail) ? detail.map(item => item.msg || '').filter(Boolean).join('；') : ''; throw new Error(message || `请求失败（HTTP ${response.status}）`); }
        return data;
      }
      function fullUrl(path) { try { return new URL(String(path || ''), normalizedBase() + '/').toString(); } catch { return ''; } }
      function inputValue(value, keys) {
        if (Array.isArray(value)) return inputValue(value[0], keys);
        if (typeof value === 'string') return value;
        if (value && typeof value === 'object') {
          for (const key of keys) if (value[key] != null) { const result = inputValue(value[key], keys); if (result) return result; }
        }
        return '';
      }
      function imageInput() { return inputValue(inputs.image, ['source','dataUrl','url','value']).trim(); }
      function promptInput() { return inputValue(inputs.prompt_input, ['text','value','content']); }
      function validId(value) { const id = Number(value); return value !== null && value !== '' && Number.isSafeInteger(id) && id > 0 ? id : null; }
      function currentSignature() { return `${String(els.serverUrl.value || '').trim().replace(/\/+$/, '').replace(/\/api\/v1$/i, '')}\n${String(els.apiKey.value || '').trim()}`; }
      function clearDuplicate() { duplicateSnapshot = null; els.forceSave.hidden = true; }
      function renderSave() {
        const image = imageInput(); const prompt = promptInput();
        els.imageInputStatus.textContent = image ? '已连接一张图片' : '未连接';
        els.promptInputStatus.textContent = prompt.trim() ? prompt : '未连接或内容为空';
        els.saveCategory.replaceChildren();
        const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = categories.length ? '请选择保存分类' : '请先连接服务'; els.saveCategory.append(placeholder);
        categories.forEach(item => { const option = document.createElement('option'); option.value = String(item.id); option.textContent = String(item.name || `分类 ${item.id}`); els.saveCategory.append(option); });
        els.saveCategory.value = state.saveCategoryId ? String(state.saveCategoryId) : '';
        els.saveCategory.disabled = busy || !categories.length;
        if (!duplicateSnapshot) els.saveNote.textContent = state.lastSavedAssetId ? `最近保存的素材 ID：${state.lastSavedAssetId}。仅保存，不自动调用 AI 分析。` : '仅保存素材，不自动调用 AI 分析；保存分类与抽取范围互不影响。';
      }
      function invalidateConnection() {
        if (connectionDirty || currentSignature() === knownConnectionSignature) return;
        connectionDirty = true; connectionSignature = ''; categories = []; state.selectedCategoryIds = []; state.saveCategoryId = null; state.lastSavedAssetId = null; state.saveScope = '';
        clearDuplicate(); renderCategories(); renderSave(); persist(); setStatus('未连接');
        showMessage('连接设置已更改，请重新连接并选择分类。', 'info');
      }
      function snapshotForSave() { return { categoryId:state.saveCategoryId, prompt:promptInput(), image:imageInput(), signature:connectionSignature }; }
      function sameSnapshot(a, b) { return a && b && a.categoryId === b.categoryId && a.prompt === b.prompt && a.image === b.image && a.signature === b.signature; }
      function hostRequest(type, payload, responseType) {
        const requestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pendingRequests.delete(requestId); reject(new Error('读取画布图片超时')); }, 30000);
          pendingRequests.set(requestId, { resolve, reject, timer, responseType });
          post(type, { ...payload, requestId });
        });
      }
      function receiveHostResult(type, payload) {
        const pending = pendingRequests.get(payload.requestId);
        if (!pending || pending.responseType !== type) return;
        pendingRequests.delete(payload.requestId); clearTimeout(pending.timer);
        if (payload.error) pending.reject(new Error(String(payload.error))); else pending.resolve(payload);
      }
      async function readImage(source) {
        if (!/^(?:data:image\/|hios-asset:|https?:\/\/)/i.test(source)) throw new Error('图片地址不受支持，请连接画布中的图片节点');
        let blob;
        try {
          const response = await fetch(source, { credentials:'omit' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          blob = await response.blob();
        } catch (error) {
          if (/^hios-asset:/i.test(source)) {
            const result = await hostRequest('asset-read', { source }, 'asset-result');
            if (!result.dataUrl) throw new Error('宿主未返回画布图片');
            blob = await (await fetch(result.dataUrl)).blob();
          } else if (/^https?:\/\//i.test(source) && !/^https?:\/\/hios-asset\.localhost(?:[/:]|$)/i.test(source)) {

            if (!result || !result.ok || result.encoding !== 'base64' || typeof result.body !== 'string') throw new Error(`读取图片失败${result && result.status ? `（HTTP ${result.status}）` : ''}`);

      function multipartBody(snapshot, file, force) {

        // multipart format as a Blob to preserve the connected prompt exactly.

      }
      async function saveAsset(force = false) {
        if (busy) return;
        const snapshot = snapshotForSave();
        if (!categories.length || !connectionSignature || currentSignature() !== connectionSignature) { showMessage('请先连接服务并读取分类。', 'error'); els.saveNote.textContent = '请先连接服务并读取分类。'; return; }
        if (state.saveScope && state.saveScope !== currentScope()) { state.saveCategoryId = null; state.lastSavedAssetId = null; state.saveScope = ''; clearDuplicate(); renderSave(); persist(); showMessage('连接设置已在其他节点更改，请重新选择保存分类。', 'error'); els.saveNote.textContent = '连接设置已在其他节点更改，请重新选择保存分类。'; return; }
        if (!snapshot.categoryId || !categories.some(item => Number(item.id) === snapshot.categoryId)) { showMessage('请选择保存分类。', 'error'); els.saveNote.textContent = '请选择保存分类。'; return; }
        if (!snapshot.image && !snapshot.prompt.trim()) { showMessage('请至少连接一张图片或一段非空提示词。', 'error'); els.saveNote.textContent = '请至少连接一张图片或一段非空提示词。'; return; }
        if (force && (!duplicateSnapshot || !sameSnapshot(snapshot, duplicateSnapshot))) { clearDuplicate(); renderSave(); showMessage('输入或分类已变化，请重新保存。', 'error'); return; }
        const retryFile = force ? duplicateSnapshot.file : null;
        clearDuplicate(); setBusy(true, '正在保存素材…'); els.saveNote.textContent = '正在保存素材…';

          const file = retryFile || (snapshot.image ? await readImage(snapshot.image) : null);
          const result = await request('/api/v1/assets/upload', { method:'POST', body:multipartBody(snapshot, file, force) });
          const items = result && Array.isArray(result.items) ? result.items : [];
          const duplicates = result && Array.isArray(result.duplicates) ? result.duplicates : [];
          const errors = result && Array.isArray(result.errors) ? result.errors : [];
          if (errors.length) throw new Error(errors.map(item => item.message || '图片保存失败').join('；'));
          if (duplicates.length && !items.length) {
            const id = validId(duplicates[0].asset_id);
            const message = `图片已存在${id ? `（素材 #${id}）` : ''}，本次未保存。`;
            if (sameSnapshot(snapshot, snapshotForSave())) { duplicateSnapshot = { ...snapshot, file }; els.forceSave.hidden = false; els.saveNote.textContent = `${message}如需重复保存，请点击“仍然保存重复图片”。`; }
            else els.saveNote.textContent = `${message}输入已变化，请重新保存。`;
            setStatus('图片重复', 'error'); showMessage(message, 'error'); return;
          }
          const saved = items[0]; const id = saved && validId(saved.id);
          if (!id) throw new Error('服务未返回已保存的素材，请检查服务端结果');

          const category = categories.find(item => Number(item.id) === snapshot.categoryId);
          if (category) category.asset_count = Number(category.asset_count || 0) + 1;

      }
      function renderCategories() {
        els.categories.replaceChildren();
        if (!categories.length) { const empty = document.createElement('div'); empty.className='empty'; empty.textContent='没有可用分类，或尚未连接服务'; els.categories.append(empty); return; }
        categories.forEach((item) => {
          const button = document.createElement('button'); button.type='button'; button.className=`category ${state.selectedCategoryIds.includes(Number(item.id)) ? 'active' : ''}`;
          const name = document.createElement('span'); name.textContent=String(item.name || `分类 ${item.id}`);
          const count = document.createElement('em'); count.textContent=String(item.asset_count ?? 0);
          button.append(name,count);
          button.addEventListener('click', () => { if (busy) return; const id=Number(item.id); state.selectedCategoryIds = state.selectedCategoryIds.includes(id) ? state.selectedCategoryIds.filter((value) => value !== id) : [...state.selectedCategoryIds,id]; renderCategories(); persist(); });
          els.categories.append(button);
        });
      }
      function renderResults() {
        els.results.replaceChildren();
        els.output.disabled = busy || !state.lastItems.length;
        els.resultCount.textContent = state.lastItems.length ? `${state.lastItems.length} 条 · 当前第 ${Math.min(state.selectedIndex + 1,state.lastItems.length)} 条` : '还没有抽取';
        if (!state.lastItems.length) { const empty=document.createElement('div'); empty.className='empty'; empty.textContent='点击“运行”随机抽取提示词'; els.results.append(empty); return; }
        state.lastItems.forEach((item,index) => {
          const button=document.createElement('button'); button.type='button'; button.className=`result ${index===state.selectedIndex?'active':''}`;
          const thumb=document.createElement('span'); thumb.className='thumb'; const url=fullUrl(item.thumbnail_url); if(url){ const image=document.createElement('img'); image.src=url; image.alt=''; image.loading='lazy'; image.referrerPolicy='no-referrer'; image.onerror=()=>{ thumb.replaceChildren(document.createTextNode('✦')); }; thumb.append(image); } else thumb.textContent='✦';
          const copy=document.createElement('span'); copy.className='result-copy'; const title=document.createElement('strong'); title.textContent=`${item.category_name || '未分类'} · #${item.asset_id || '-'}`; const meta=document.createElement('small'); meta.textContent=`候选 ${index+1}`; const prompt=document.createElement('p'); prompt.textContent=String(item.prompt || ''); copy.append(title,meta,prompt);
          const check=document.createElement('span'); check.className='check'; check.textContent='✓'; button.append(thumb,copy,check);
          button.addEventListener('click',()=>{ state.selectedIndex=index; renderResults(); persist(); }); els.results.append(button);
        });
      }
      function emitSelected() {
        const item = state.lastItems[state.selectedIndex];
        if (!item || !String(item.prompt || '').trim()) { showMessage('请先随机抽取并选择一条提示词', 'error'); return; }
        post('output', { output:{ kind:'text', portId:'prompt', value:String(item.prompt), name:`${item.category_name || '提示词'} #${item.asset_id || ''}`.trim(), metadata:{ assetId:item.asset_id, categoryId:item.category_id, categoryName:item.category_name, thumbnailUrl:fullUrl(item.thumbnail_url) } } });
        setStatus('已输出', 'ok'); showMessage('当前提示词已写入画布输出端口，可连接到下游节点。', 'info');
      }
      async function loadCategories(quiet = false) {
        if (busy) return; setBusy(true, quiet ? '' : '正在连接提示词库…');
        try {
          saveConnection();
          if (state.saveScope && state.saveScope !== currentScope()) { state.saveCategoryId = null; state.lastSavedAssetId = null; state.saveScope = ''; }
          const health = await request('/api/v1/health');
          const rows = await request('/api/v1/categories?enabled_only=true');
          if (!Array.isArray(rows)) throw new Error('分类接口返回格式不正确');
          categories = rows.filter((item) => item && Number.isFinite(Number(item.id)));
          state.selectedCategoryIds = state.selectedCategoryIds.filter((id) => categories.some((item) => Number(item.id) === id));
          if (!categories.some((item) => Number(item.id) === state.saveCategoryId)) state.saveCategoryId = null;
          connectionSignature = currentSignature(); knownConnectionSignature = connectionSignature; connectionDirty = false; clearDuplicate();
          renderCategories(); renderSave(); persist(); els.panel.classList.remove('open'); setStatus('已连接', 'ok'); showMessage(`服务连接正常，共读取 ${categories.length} 个分类。`, 'info');
          if (health && health.status !== 'ok') showMessage('服务已响应，但健康状态不是 ok。', 'error');
        } catch (error) { categories=[]; connectionSignature=''; clearDuplicate(); renderCategories(); renderSave(); setStatus('连接失败','error'); showMessage(error instanceof Error ? error.message : String(error),'error'); post('error',{message:error instanceof Error?error.message:String(error)}); }

      }
      async function randomPrompt(forceOutput = false) {

          saveConnection();

        } catch(error) { setStatus('抽取失败','error'); showMessage(error instanceof Error?error.message:String(error),'error'); post('error',{message:error instanceof Error?error.message:String(error)}); }
        finally { setBusy(false); renderResults(); }
      }
      function hydrate(payload) {
        const incoming=payload && payload.state && typeof payload.state==='object' ? payload.state : {};

        if (payload && Object.prototype.hasOwnProperty.call(payload, 'inputs')) inputs = payload.inputs && typeof payload.inputs === 'object' ? payload.inputs : {};

      }

      els.settingsToggle.addEventListener('click',()=>els.panel.classList.toggle('open'));
      els.revealKey.addEventListener('click',()=>{ const reveal=els.apiKey.type==='password'; els.apiKey.type=reveal?'text':'password'; els.revealKey.textContent=reveal?'隐藏':'显示'; });
      els.clearKey.addEventListener('click',()=>{ els.apiKey.value=''; invalidateConnection(); saveConnection(); localStorage.removeItem(STORAGE_KEY); setStatus('密钥已清除'); showMessage('本机保存的访问密钥已清除。','info'); });

      els.save.addEventListener('click',()=>void saveAsset(false)); els.forceSave.addEventListener('click',()=>void saveAsset(true));

      els.serverUrl.addEventListener('change',()=>{ invalidateConnection(); saveConnection(); }); els.apiKey.addEventListener('change',()=>{ invalidateConnection(); saveConnection(); });
      els.count.addEventListener('change',()=>{ state.count=safeNumber(els.count.value,1,20,1); els.count.value=String(state.count); persist(); });
      els.seed.addEventListener('change',()=>{ state.seed=safeNumber(els.seed.value,0,2147483647,0); els.seed.value=String(state.seed); persist(); });

      window.addEventListener('message',(event)=>{
