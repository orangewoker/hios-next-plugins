<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>图片对比</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#15191f;--surface:#1d232b;--muted:#202832;--control:#27313c;
      --text:#edf2f7;--text-2:#b7c1cc;--text-3:#7f8b98;--border:#34404c;
      --accent:#2f91ff;--accent-soft:rgba(47,145,255,.16);--positive:#45b979;--negative:#ee6672;
    }
    :root[data-theme="light"] { color-scheme:light;--bg:#edf2f6;--surface:#f8fafc;--muted:#e6edf3;--control:#e3eaf0;--text:#263242;--text-2:#5e6b7a;--text-3:#8995a2;--border:#cbd5df; }
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden; }
    body { color:var(--text);background:var(--bg);font-family:"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;font-size:11px; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .app { height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto; }
    .toolbar { min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface); }
    .title { min-width:0;display:flex;align-items:center;gap:8px; }
    .mark { width:25px;height:25px;display:grid;place-items:center;flex:none;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));border-radius:8px;font-weight:800; }
    .title strong,.title small { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .title strong { font-size:11px; }.title small { margin-top:2px;color:var(--text-3);font-size:8px; }
    .status { flex:none;display:inline-flex;align-items:center;gap:5px;padding:4px 7px;color:var(--text-3);background:var(--muted);border:1px solid var(--border);border-radius:999px;font-size:8px; }
    .status::before { width:6px;height:6px;content:"";background:currentColor;border-radius:50%; }
    .status.ok { color:var(--positive); }.status.error { color:var(--negative); }
    .stage { position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:ew-resize;background-color:#151a20;background-image:linear-gradient(45deg,#1d242c 25%,transparent 25%),linear-gradient(-45deg,#1d242c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1d242c 75%),linear-gradient(-45deg,transparent 75%,#1d242c 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0; }
    :root[data-theme="light"] .stage { background-color:#e3e9ee;background-image:linear-gradient(45deg,#d7dfe6 25%,transparent 25%),linear-gradient(-45deg,#d7dfe6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d7dfe6 75%),linear-gradient(-45deg,transparent 75%,#d7dfe6 75%); }
    .layer { position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;pointer-events:none; }
    .layer img { display:block;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none; }
    .layer-a { z-index:2;clip-path:inset(0 50% 0 0); }
    .divider { position:absolute;z-index:4;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);background:#fff;box-shadow:0 0 0 1px rgba(16,107,206,.55),0 0 18px rgba(0,0,0,.32);pointer-events:none; }
    .divider::after { position:absolute;top:50%;left:50%;width:28px;height:28px;display:grid;place-items:center;content:"↔";transform:translate(-50%,-50%);color:#fff;background:var(--accent);border:2px solid #fff;border-radius:50%;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:13px;font-weight:800; }
    .badge { position:absolute;z-index:5;top:9px;padding:4px 7px;color:#fff;background:rgba(14,18,23,.7);border:1px solid rgba(255,255,255,.16);border-radius:7px;backdrop-filter:blur(8px);font-size:8px;pointer-events:none; }
    .badge-a { left:9px; }.badge-b { right:9px; }
    .empty { position:absolute;z-index:6;inset:0;display:grid;place-content:center;justify-items:center;gap:7px;padding:20px;color:var(--text-3);background:color-mix(in srgb,var(--bg) 86%,transparent);text-align:center;pointer-events:none; }
    .empty[hidden] { display:none !important; }
    .empty strong { color:var(--text-2);font-size:11px; }.empty span { max-width:280px;font-size:9px;line-height:1.55; }
    .controls { display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 10px;border-top:1px solid var(--border);background:var(--surface); }
    .value { min-width:0;color:var(--text-2);font-variant-numeric:tabular-nums;font-size:9px;white-space:nowrap; }
    .output { min-height:28px;padding:0 10px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:8px;font-size:9px;font-weight:700; }
    .output:hover { filter:brightness(1.07); }.output:disabled { opacity:.42;cursor:not-allowed; }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="title"><span class="mark">A/B</span><span><strong>固定画幅对比</strong><small>滑杆只裁切 A 图，不缩放任何图片</small></span></div>
      <span id="status" class="status">等待输入</span>
    </header>
    <section id="stage" class="stage" aria-label="图片对比区域">
      <div class="layer layer-b"><img id="imageB" alt="图片 B" /></div>
      <div id="layerA" class="layer layer-a"><img id="imageA" alt="图片 A" /></div>
      <span id="divider" class="divider"></span>
      <span class="badge badge-a">A</span><span class="badge badge-b">B</span>
      <div id="empty" class="empty"><strong>连接两张图片</strong><span>将左侧图片节点分别连接到“图片 A”和“图片 B”输入口，图片始终保持固定尺寸叠放。</span></div>
    </section>
    <footer class="controls">
      <span id="value" class="value">拖动画面分割线 · A 50%</span>
      <input id="slider" type="range" min="0" max="100" step="0.1" value="50" hidden aria-hidden="true" tabindex="-1" />
      <button id="output" class="output" type="button" disabled>运行</button>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const PROTOCOL = 'hios-plugin-node/v1';
      const $ = (id) => document.getElementById(id);
      const stage = $('stage');
      const layerA = $('layerA');
      const divider = $('divider');
      const slider = $('slider');
      const value = $('value');
      const status = $('status');
      const empty = $('empty');
      const outputButton = $('output');
      const images = { imageA: $('imageA'), imageB: $('imageB') };
      const runtime = { nodeId: '', pluginId: 'image-compare', slider: 50, inputs: {}, sources: { imageA: '', imageB: '' }, objectUrls: { imageA: '', imageB: '' } };

      function post(type, payload = {}) {
        parent.postMessage({ protocol: PROTOCOL, nodeId: runtime.nodeId, pluginId: runtime.pluginId, type, payload }, '*');
      }
      function clamp(value) { return Math.max(0, Math.min(100, Number(value) || 0)); }
      function setStatus(text, kind = '') { status.textContent = text; status.className = `status ${kind}`.trim(); }
      function applySlider(next, emit = false) {
        runtime.slider = clamp(next);
        slider.value = String(runtime.slider);
        layerA.style.clipPath = `inset(0 ${100 - runtime.slider}% 0 0)`;
        divider.style.left = `${runtime.slider}%`;
        value.textContent = `拖动画面分割线 · A ${Math.round(runtime.slider)}%`;
        if (emit) post('state', { state: { slider: runtime.slider } });
      }
      function sourceFrom(value) {
        if (Array.isArray(value)) return sourceFrom(value[0]);
        if (typeof value === 'string') return value.trim();
        if (value && typeof value === 'object') return sourceFrom(value.source || value.dataUrl || value.url || value.value || '');
        return '';
      }
      function revoke(key) {
        if (runtime.objectUrls[key]) URL.revokeObjectURL(runtime.objectUrls[key]);
        runtime.objectUrls[key] = '';
      }
      async function displaySource(key, source) {
        revoke(key);
        runtime.sources[key] = source;
        images[key].removeAttribute('src');
        if (!source) return;
        try {
          const response = await fetch(source);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          runtime.objectUrls[key] = url;
          images[key].src = url;
        } catch {
          images[key].src = source;
        }
      }
      async function hydrate(payload) {
        runtime.nodeId = String(payload.nodeId || runtime.nodeId || '');
        runtime.pluginId = String(payload.pluginId || runtime.pluginId || 'image-compare');
        runtime.inputs = payload.inputs && typeof payload.inputs === 'object' ? payload.inputs : {};
        applyTheme(payload.theme);
        applySlider(payload.state && payload.state.slider !== undefined ? payload.state.slider : runtime.slider, false);
        const nextA = sourceFrom(runtime.inputs.imagea ?? runtime.inputs.imageA);
        const nextB = sourceFrom(runtime.inputs.imageb ?? runtime.inputs.imageB);
        const jobs = [];
        if (nextA !== runtime.sources.imageA) jobs.push(displaySource('imageA', nextA));
        if (nextB !== runtime.sources.imageB) jobs.push(displaySource('imageB', nextB));
        await Promise.all(jobs);
        const ready = Boolean(nextA && nextB);
        empty.hidden = ready;
        outputButton.disabled = !ready;
        setStatus(ready ? '对比已就绪' : nextA || nextB ? '还差一张图片' : '等待输入', ready ? 'ok' : '');
        post('loaded', { ready });
      }
      function applyTheme(theme) {
        if (!theme || typeof theme !== 'object') return;
        document.documentElement.dataset.theme = theme.mode === 'light' ? 'light' : 'dark';
        const tokens = theme.tokens && typeof theme.tokens === 'object' ? theme.tokens : {};
        const names = { background:'--bg',surface:'--surface',muted:'--muted',control:'--control',text:'--text',textSecondary:'--text-2',textMuted:'--text-3',border:'--border',accent:'--accent',accentSoft:'--accent-soft',positive:'--positive',negative:'--negative' };
        Object.entries(names).forEach(([key, css]) => { if (typeof tokens[key] === 'string' && tokens[key]) document.documentElement.style.setProperty(css, tokens[key]); });
      }
      function setSliderFromPointer(event) {
        const rect = stage.getBoundingClientRect();
        if (!rect.width) return;
        applySlider(((event.clientX - rect.left) / rect.width) * 100, true);
      }
      async function ensureLoaded(image) {
        if (image.complete && image.naturalWidth) return;
        await new Promise((resolve, reject) => { image.addEventListener('load', resolve, { once:true }); image.addEventListener('error', reject, { once:true }); });
      }
      function drawContained(context, image, width, height) {
        const scale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
        const drawWidth = image.naturalWidth * scale;
        const drawHeight = image.naturalHeight * scale;
        context.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
      }
      async function createOutput() {
        if (!runtime.sources.imageA || !runtime.sources.imageB) throw new Error('请先连接图片 A 和图片 B');
        await Promise.all([ensureLoaded(images.imageA), ensureLoaded(images.imageB)]);
        const ratio = Math.max(.2, Math.min(5, stage.clientWidth / Math.max(1, stage.clientHeight)));
        const width = Math.max(320, Math.min(1600, Math.round(stage.clientWidth * Math.min(2, devicePixelRatio || 1))));
        const height = Math.max(200, Math.round(width / ratio));
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('无法创建图片输出画布');
        context.fillStyle = '#151a20'; context.fillRect(0, 0, width, height);
        drawContained(context, images.imageB, width, height);
        context.save(); context.beginPath(); context.rect(0, 0, width * runtime.slider / 100, height); context.clip();
        drawContained(context, images.imageA, width, height); context.restore();
        return { source: canvas.toDataURL('image/png'), width, height };
      }
      async function run() {
        outputButton.disabled = true; setStatus('正在生成输出…');
        try {
          const result = await createOutput();
          post('output', { output: { kind:'image', portId:'image', source:result.source, dataUrl:result.source, name:'图片对比.png', mime:'image/png', width:result.width, height:result.height, metadata:{ slider:runtime.slider } } });
          setStatus('输出已就绪', 'ok');
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          setStatus(message, 'error'); post('error', { message });
        } finally { outputButton.disabled = !(runtime.sources.imageA && runtime.sources.imageB); }
      }

      slider.addEventListener('input', () => applySlider(slider.value, true));
      stage.addEventListener('pointerdown', (event) => { stage.setPointerCapture(event.pointerId); setSliderFromPointer(event); });
      stage.addEventListener('pointermove', (event) => { if (stage.hasPointerCapture(event.pointerId)) setSliderFromPointer(event); });
      outputButton.addEventListener('click', run);
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (!message || message.protocol !== PROTOCOL) return;
        if (message.type === 'init') void hydrate(message.payload || {});
        if (message.type === 'run') { const payload = message.payload || {}; void hydrate(payload).then(run); }
      });
      window.addEventListener('beforeunload', () => { revoke('imageA'); revoke('imageB'); });
      applySlider(50, false);
      post('ready', { version:'0.3.2' });
    })();
  </script>
</body>
</html>
