<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>水印大师</title>
  <style>
    @font-face{font-family:"Anton";src:url("../assets/Anton-Regular.ttf") format("truetype");font-style:normal;font-weight:100 900;font-display:swap}
    :root{color-scheme:dark;--bg:#13181e;--surface:#1b222a;--muted:#222b35;--control:#27313c;--text:#edf2f7;--text2:#b8c2cd;--text3:#7f8b98;--border:#34404c;--accent:#2f91ff;--accentSoft:rgba(47,145,255,.16);--positive:#42b978;--negative:#ed6671;--shadow:0 12px 34px rgba(0,0,0,.24)}
    :root[data-theme="light"]{color-scheme:light;--bg:#eef3f7;--surface:#fbfcfd;--muted:#e6edf3;--control:#e2eaf1;--text:#263242;--text2:#5f6c7a;--text3:#8995a2;--border:#cbd5df;--shadow:0 10px 30px rgba(42,58,74,.14)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font:11px/1.45 "Inter","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:auto 190px minmax(0,1fr);min-height:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand i{width:28px;height:28px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent),#7357ef);border-radius:9px;font-style:normal;font-weight:900}.brand strong,.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{color:var(--text3);font-size:8px}.status{padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--text3);background:var(--muted);font-size:8px;white-space:nowrap}.status.ok{color:var(--positive)}.status.error{color:var(--negative)}
    .preview{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;padding:12px;background-color:var(--muted);background-image:linear-gradient(45deg,color-mix(in srgb,var(--border) 40%,transparent) 25%,transparent 25%),linear-gradient(-45deg,color-mix(in srgb,var(--border) 40%,transparent) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,color-mix(in srgb,var(--border) 40%,transparent) 75%),linear-gradient(-45deg,transparent 75%,color-mix(in srgb,var(--border) 40%,transparent) 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.preview canvas{display:block;width:100%;height:100%;object-fit:contain;box-shadow:none;background:transparent}.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--text3);text-align:center;padding:20px;background:color-mix(in srgb,var(--muted) 88%,transparent)}.empty[hidden]{display:none}.empty strong{font-size:12px;color:var(--text2)}.empty span{max-width:310px;font-size:9px}
    .panel{min-height:0;overflow:auto;padding:10px;background:var(--surface);border-top:1px solid var(--border);scrollbar-color:var(--border) transparent}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:9px}.tabs button{height:29px;border:0;border-radius:7px;background:transparent;color:var(--text3);font-weight:700}.tabs button.active{color:#fff;background:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 28%,transparent)}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}.field{display:grid;gap:4px;min-width:0}.field.wide{grid-column:1/-1}.field.span2{grid-column:span 2}.field>span,.section-label{color:var(--text3);font-size:8px;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--bg);outline:none}.field input,.field select{height:30px;padding:0 8px}.field textarea{height:48px;resize:vertical;padding:7px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}.toggle-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.toggle{height:30px;min-width:34px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text3);font-weight:700}.toggle.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 60%,var(--border));background:var(--accentSoft)}.color-field{display:grid;grid-template-columns:34px 1fr;gap:5px}.color-field input[type=color]{padding:3px}.anchors{display:grid;grid-template-columns:repeat(3,26px);gap:3px;justify-content:start}.anchors button{width:26px;height:22px;border:1px solid var(--border);border-radius:5px;background:var(--bg);position:relative}.anchors button::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--text3);left:50%;top:50%;transform:translate(-50%,-50%)}.anchors button.active{border-color:var(--accent);background:var(--accentSoft)}.anchors button.active::after{background:var(--accent)}.image-pick{display:flex;align-items:center;gap:8px;min-height:48px;padding:7px;border:1px dashed var(--border);border-radius:8px;background:var(--bg)}.image-pick img{width:38px;height:38px;object-fit:contain;border-radius:6px;background:var(--muted)}.image-pick span{min-width:0;flex:1;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.image-pick button,.reset{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--control)}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}.footer-row small{color:var(--text3)}.hidden{display:none!important}@media(max-width:520px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.field.span2{grid-column:span 2}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><i>W</i><span><strong>水印大师</strong><small>本地全分辨率渲染 · 不覆盖原图</small></span></div><span id="status" class="status">等待图片</span></header>
  <section class="preview"><canvas id="preview"></canvas><div id="empty" class="empty"><strong>连接一张原始图片</strong><span>将图片节点连接到左侧输入端，然后设置文字水印或图片水印。</span></div></section>
  <section class="panel">
    <div class="tabs"><button id="tabText" class="active" type="button">文字水印</button><button id="tabImage" type="button">图片水印</button></div>
    <div id="textFields" class="fields">
      <label class="field wide"><span>水印文字</span><textarea id="text" maxlength="500" spellcheck="false"></textarea></label>
      <label class="field span2"><span>字体</span><select id="fontFamily"><option value="Anton" style="font-family:Anton,sans-serif">Anton</option><option>Microsoft YaHei UI</option><option>PingFang SC</option><option>SimHei</option><option>Arial</option><option>Georgia</option><option>Impact</option><option>monospace</option></select></label>
      <div class="field span2"><span>字形</span><div class="toggle-row"><button id="bold" class="toggle" type="button">B</button><button id="italic" class="toggle" type="button"><em>I</em></button><button id="horizontal" class="toggle" type="button">水平</button><button id="vertical" class="toggle" type="button">垂直</button></div></div>
      <label class="field"><span>字号</span><input id="fontSize" type="number" min="4" max="1000" step="1"></label><label class="field"><span>字号单位</span><select id="fontUnit"><option value="px">像素</option><option value="percent">% 宽度</option></select></label>
      <label class="field"><span>行高</span><input id="lineHeight" type="number" min="0.5" max="5" step="0.05"></label><label class="field"><span>字间距</span><input id="letterSpacing" type="number" min="-50" max="300" step="0.5"></label>
      <div class="field span2"><span>文字对齐</span><div class="toggle-row"><button class="toggle align" data-value="left" type="button">左</button><button class="toggle align" data-value="center" type="button">中</button><button class="toggle align" data-value="right" type="button">右</button></div></div>
      <label class="field"><span>文字颜色</span><div class="color-field"><input id="color" type="color"><input id="colorText" maxlength="9"></div></label><label class="field"><span>背景颜色</span><div class="color-field"><input id="background" type="color"><button id="backgroundEnabled" class="toggle" type="button">启用</button></div></label>
    </div>
    <div id="imageFields" class="fields hidden">
      <div class="field wide"><span>水印图片</span><div class="image-pick"><img id="watermarkThumb" alt="水印图片预览"><span id="watermarkName">尚未选择，可使用 PNG / JPG / WebP / SVG</span><button id="chooseWatermark" type="button">选择图片</button></div></div>
      <label class="field span2"><span>水印宽度</span><input id="imageWidth" type="number" min="1" max="4000" step="1"></label><label class="field span2"><span>尺寸单位</span><select id="imageUnit"><option value="percent">% 图片宽度</option><option value="px">像素</option></select></label>
    </div>
    <div class="fields">
      <label class="field"><span>透明度 %</span><input id="opacity" type="number" min="0" max="100" step="1"></label><label class="field"><span>旋转角度</span><input id="rotation" type="number" min="-360" max="360" step="1"></label>
      <label class="field"><span>边距 X</span><input id="marginX" type="number" min="0" max="4000" step="1"></label><label class="field"><span>边距 Y</span><input id="marginY" type="number" min="0" max="4000" step="1"></label>
      <div class="field span2"><span>九宫格位置</span><div id="anchors" class="anchors"></div></div>
      <div class="field span2"><span>分布</span><div class="toggle-row"><button id="tile" class="toggle" type="button">满屏平铺</button><button id="reset" class="reset" type="button">重置参数</button></div></div>
      <label class="field span2"><span>输出格式</span><select id="outputFormat"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></label><label class="field span2"><span>JPG / WebP 质量</span><input id="quality" type="number" min="10" max="100" step="1"></label>
    </div>
    <div class="footer-row"><small>设置会自动保存；使用画布节点上的“运行”生成完整分辨率图片。</small></div>
  </section>
</main>
<script>
(()=>{'use strict';
const PROTOCOL='hios-plugin-node/v1',PLUGIN='watermark-master',$=id=>document.getElementById(id);
const defaults={mode:'text',text:'LIANG·VISUAL',fontFamily:'Anton',fontSize:64,fontUnit:'px',bold:true,italic:false,direction:'horizontal',align:'center',lineHeight:1.25,letterSpacing:2,opacity:.7,rotation:0,anchor:'bottom-right',marginX:24,marginY:24,color:'#ffffff',background:'#000000',backgroundEnabled:false,tile:false,imageWidth:20,imageUnit:'percent',outputFormat:'png',quality:.92,watermarkSource:'',watermarkName:''};
const state={...defaults},runtime={nodeId:'',pluginId:PLUGIN,source:'',sourceObject:'',inputImage:new Image(),watermarkImage:new Image(),inputReady:false,watermarkReady:false,renderTimer:0,fileRequest:'',assetRequests:new Map(),lastWidth:0,lastHeight:0};
const preview=$('preview'),empty=$('empty'),status=$('status');
function post(type,payload={}){parent.postMessage({protocol:PROTOCOL,nodeId:runtime.nodeId,pluginId:runtime.pluginId,type,payload},'*')}
function sourceFrom(v){if(Array.isArray(v))return sourceFrom(v[0]);if(typeof v==='string')return v.trim();if(v&&typeof v==='object')return sourceFrom(v.source||v.dataUrl||v.url||v.value||'');return''}
function setStatus(text,kind=''){status.textContent=text;status.className=`status ${kind}`.trim()}
function applyTheme(theme){if(!theme||typeof theme!=='object')return;document.documentElement.dataset.theme=theme.mode==='light'?'light':'dark';const t=theme.tokens||{},m={background:'--bg',surface:'--surface',muted:'--muted',control:'--control',text:'--text',textSecondary:'--text2',textMuted:'--text3',border:'--border',accent:'--accent',accentSoft:'--accentSoft',positive:'--positive',negative:'--negative'};Object.entries(m).forEach(([k,v])=>{if(typeof t[k]==='string')document.documentElement.style.setProperty(v,t[k])})}
function emitState(){post('state',{state:{...state}})}
function schedule(save=true){clearTimeout(runtime.renderTimer);runtime.renderTimer=setTimeout(()=>void renderPreview(),55);syncControls();if(save)emitState()}
function loadImage(image,source){return new Promise((resolve,reject)=>{image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('图片加载失败'));image.crossOrigin='anonymous';image.src=source})}
function readAsset(source){if(!/^hios-asset:/i.test(source))return Promise.resolve(source);const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{runtime.assetRequests.delete(requestId);reject(new Error('读取画布原图超时'))},30000);runtime.assetRequests.set(requestId,{resolve,reject,timer});post('asset-read',{requestId,source})})}
async function ensureFont(){if(state.mode!=='text'||!document.fonts?.load)return;try{await document.fonts.load(`32px "${state.fontFamily}"`)}catch{}}
async function loadInput(source){runtime.source=source;runtime.inputReady=false;empty.hidden=false;if(!source){setStatus('等待图片');return}setStatus('正在读取原图…');try{let readable=source;try{readable=await readAsset(source)}catch{}await loadImage(runtime.inputImage,readable);runtime.inputReady=true;runtime.lastWidth=runtime.inputImage.naturalWidth;runtime.lastHeight=runtime.inputImage.naturalHeight;empty.hidden=true;setStatus(`${runtime.lastWidth} × ${runtime.lastHeight}`,'ok');await renderPreview();post('loaded',{ready:true})}catch{setStatus('原图读取失败','error');post('error',{message:'无法读取连接的原始图片'})}}
async function loadWatermark(source,name=''){state.watermarkSource=source;state.watermarkName=name;runtime.watermarkReady=false;$('watermarkName').textContent=name||'尚未选择，可使用 PNG / JPG / WebP / SVG';$('watermarkThumb').removeAttribute('src');if(!source){schedule();return}try{await loadImage(runtime.watermarkImage,source);runtime.watermarkReady=true;$('watermarkThumb').src=source;schedule()}catch{setStatus('水印图片读取失败','error')}}
function measureSpaced(ctx,text,spacing){return [...text].reduce((n,ch,i)=>n+ctx.measureText(ch).width+(i?spacing:0),0)}
function drawSpaced(ctx,text,x,y,spacing,align){const width=measureSpaced(ctx,text,spacing);let cursor=align==='center'?x-width/2:align==='right'?x-width:x;for(const ch of [...text]){ctx.fillText(ch,cursor,y);cursor+=ctx.measureText(ch).width+spacing}}
function watermarkMetrics(ctx,w,h,scale){
  if(state.mode==='image'){if(!runtime.watermarkReady)return null;const width=state.imageUnit==='percent'?w*Number(state.imageWidth)/100:Number(state.imageWidth)*scale;return{kind:'image',width:Math.max(1,width),height:Math.max(1,width*runtime.watermarkImage.naturalHeight/runtime.watermarkImage.naturalWidth)}}
  const size=state.fontUnit==='percent'?w*Number(state.fontSize)/100:Number(state.fontSize)*scale;ctx.font=`${state.italic?'italic ':''}${state.bold?'700 ':'400 '}${Math.max(4,size)}px "${state.fontFamily}",sans-serif`;ctx.textBaseline='alphabetic';const lines=String(state.text||'').split(/\r?\n/);const spacing=Number(state.letterSpacing)*scale,line=Number(state.lineHeight)*size;
  if(state.direction==='vertical'){const columns=lines.map(v=>[...v]);return{kind:'vertical',columns,size,spacing,line,width:columns.length*line,height:Math.max(1,...columns.map(v=>v.length))*(size+spacing)-spacing}}
  const widths=lines.map(v=>measureSpaced(ctx,v,spacing));return{kind:'text',lines,size,spacing,line,width:Math.max(1,...widths),height:Math.max(size,lines.length*line)}
}
function anchorPoint(w,h,ww,wh,scale){const mx=Number(state.marginX)*scale,my=Number(state.marginY)*scale;const [v,hor]=state.anchor.split('-');let x=hor==='left'?mx:hor==='right'?w-ww-mx:(w-ww)/2;let y=v==='top'?my:v==='bottom'?h-wh-my:(h-wh)/2;return{x,y}}
function paintMark(ctx,metric,cx,cy){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,Number(state.opacity)));ctx.translate(cx,cy);ctx.rotate(Number(state.rotation)*Math.PI/180);const x=-metric.width/2,y=-metric.height/2;
  if(metric.kind==='image')ctx.drawImage(runtime.watermarkImage,x,y,metric.width,metric.height);else{if(state.backgroundEnabled){ctx.fillStyle=state.background;const pad=metric.size*.28;ctx.beginPath();ctx.roundRect(x-pad,y-pad,metric.width+pad*2,metric.height+pad*2,Math.max(3,metric.size*.16));ctx.fill()}ctx.fillStyle=state.color;if(metric.kind==='vertical'){metric.columns.forEach((col,ci)=>col.forEach((ch,ri)=>ctx.fillText(ch,x+ci*metric.line+(metric.line-metric.size)/2,y+(ri+1)*(metric.size+metric.spacing)-metric.spacing)))}else metric.lines.forEach((line,i)=>drawSpaced(ctx,line,x+(state.align==='center'?metric.width/2:state.align==='right'?metric.width:0),y+metric.size+i*metric.line,metric.spacing,state.align))}ctx.restore()}
function renderTo(canvas,maxEdge=0){if(!runtime.inputReady)throw new Error('请先连接原始图片');const iw=runtime.inputImage.naturalWidth,ih=runtime.inputImage.naturalHeight,ratio=maxEdge?Math.min(1,maxEdge/Math.max(iw,ih)):1,w=Math.max(1,Math.round(iw*ratio)),h=Math.max(1,Math.round(ih*ratio));canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(runtime.inputImage,0,0,w,h);const metric=watermarkMetrics(ctx,w,h,ratio);if(!metric||(state.mode==='text'&&!String(state.text||'').trim()))return{width:w,height:h};const pos=anchorPoint(w,h,metric.width,metric.height,ratio);if(state.tile){const gapX=Math.max(metric.width*.55,40*ratio),gapY=Math.max(metric.height*.7,40*ratio);for(let y=-metric.height;y<h+metric.height;y+=metric.height+gapY)for(let x=-metric.width;x<w+metric.width;x+=metric.width+gapX)paintMark(ctx,metric,x+metric.width/2+((Math.round(y/(metric.height+gapY))%2)*(metric.width+gapX)/2),y+metric.height/2)}else paintMark(ctx,metric,pos.x+metric.width/2,pos.y+metric.height/2);return{width:w,height:h}}
async function renderPreview(){if(!runtime.inputReady)return;try{await ensureFont();renderTo(preview,1400)}catch(e){setStatus(e.message||String(e),'error')}}
function setToggle(id,on){$(id).classList.toggle('active',Boolean(on))}
function syncControls(){
  $('tabText').classList.toggle('active',state.mode==='text');$('tabImage').classList.toggle('active',state.mode==='image');$('textFields').classList.toggle('hidden',state.mode!=='text');$('imageFields').classList.toggle('hidden',state.mode!=='image');
  ['text','fontFamily','fontSize','fontUnit','lineHeight','letterSpacing','color','background','imageWidth','imageUnit','rotation','marginX','marginY','outputFormat'].forEach(id=>{if($(id).value!==String(state[id]))$(id).value=String(state[id])});$('colorText').value=state.color;$('opacity').value=String(Math.round(state.opacity*100));$('quality').value=String(Math.round(state.quality*100));
  setToggle('bold',state.bold);setToggle('italic',state.italic);setToggle('horizontal',state.direction==='horizontal');setToggle('vertical',state.direction==='vertical');setToggle('backgroundEnabled',state.backgroundEnabled);setToggle('tile',state.tile);document.querySelectorAll('.align').forEach(b=>b.classList.toggle('active',b.dataset.value===state.align));document.querySelectorAll('#anchors button').forEach(b=>b.classList.toggle('active',b.dataset.value===state.anchor));
}
function bindValue(id,key,convert=v=>v){$(id).addEventListener('input',()=>{state[key]=convert($(id).value);schedule()})}
const anchorValues=['top-left','top-center','top-right','center-left','center-center','center-right','bottom-left','bottom-center','bottom-right'];anchorValues.forEach(v=>{const b=document.createElement('button');b.type='button';b.dataset.value=v;b.title=v;b.addEventListener('click',()=>{state.anchor=v;schedule()});$('anchors').appendChild(b)});
$('tabText').onclick=()=>{state.mode='text';schedule()};$('tabImage').onclick=()=>{state.mode='image';schedule()};$('bold').onclick=()=>{state.bold=!state.bold;schedule()};$('italic').onclick=()=>{state.italic=!state.italic;schedule()};$('horizontal').onclick=()=>{state.direction='horizontal';schedule()};$('vertical').onclick=()=>{state.direction='vertical';schedule()};$('backgroundEnabled').onclick=()=>{state.backgroundEnabled=!state.backgroundEnabled;schedule()};$('tile').onclick=()=>{state.tile=!state.tile;schedule()};document.querySelectorAll('.align').forEach(b=>b.onclick=()=>{state.align=b.dataset.value;schedule()});
bindValue('text','text');bindValue('fontFamily','fontFamily');bindValue('fontSize','fontSize',Number);bindValue('fontUnit','fontUnit');bindValue('lineHeight','lineHeight',Number);bindValue('letterSpacing','letterSpacing',Number);bindValue('color','color');bindValue('colorText','color',v=>/^#[0-9a-f]{6,8}$/i.test(v)?v:state.color);bindValue('background','background');bindValue('imageWidth','imageWidth',Number);bindValue('imageUnit','imageUnit');bindValue('opacity','opacity',v=>Number(v)/100);bindValue('rotation','rotation',Number);bindValue('marginX','marginX',Number);bindValue('marginY','marginY',Number);bindValue('outputFormat','outputFormat');bindValue('quality','quality',v=>Number(v)/100);
$('chooseWatermark').onclick=()=>{runtime.fileRequest=crypto.randomUUID();post('request-file',{requestId:runtime.fileRequest,accept:'image/png,image/jpeg,image/webp,image/svg+xml,.png,.jpg,.jpeg,.webp,.svg',multiple:false})};
$('reset').onclick=()=>{const keep={mode:state.mode,watermarkSource:state.watermarkSource,watermarkName:state.watermarkName};Object.assign(state,defaults,keep);schedule()};
async function output(){if(!runtime.inputReady)throw new Error('请先连接原始图片');if(state.mode==='image'&&!runtime.watermarkReady)throw new Error('请先选择水印图片');await ensureFont();const canvas=document.createElement('canvas'),size=renderTo(canvas,0),mime=state.outputFormat==='jpeg'?'image/jpeg':state.outputFormat==='webp'?'image/webp':'image/png',source=canvas.toDataURL(mime,state.quality);post('output',{output:{kind:'image',portId:'image',source,dataUrl:source,name:`水印图片.${state.outputFormat==='jpeg'?'jpg':state.outputFormat}`,mime,width:size.width,height:size.height,metadata:{watermarkMode:state.mode}}});setStatus('输出已生成','ok')}
async function hydrate(payload){runtime.nodeId=String(payload.nodeId||runtime.nodeId);runtime.pluginId=String(payload.pluginId||runtime.pluginId||PLUGIN);applyTheme(payload.theme);Object.assign(state,defaults,payload.state||{});syncControls();if(state.watermarkSource&&state.watermarkSource!==runtime.watermarkImage.src)void loadWatermark(state.watermarkSource,state.watermarkName);const source=sourceFrom((payload.inputs||{}).image);if(source!==runtime.source)await loadInput(source);else if(runtime.inputReady)post('loaded',{ready:true})}
window.addEventListener('message',event=>{const m=event.data;if(!m||m.protocol!==PROTOCOL)return;if(m.type==='asset-result'){const pending=runtime.assetRequests.get(m.payload?.requestId);if(!pending)return;clearTimeout(pending.timer);runtime.assetRequests.delete(m.payload.requestId);if(m.payload.error)pending.reject(new Error(m.payload.error));else if(m.payload.dataUrl)pending.resolve(m.payload.dataUrl);else pending.reject(new Error('原图数据为空'));return}if(m.type==='init')void hydrate(m.payload||{});if(m.type==='run')void hydrate(m.payload||{}).then(output).catch(e=>{setStatus(e.message||String(e),'error');post('error',{message:e.message||String(e)})});if(m.type==='file-result'&&m.payload?.requestId===runtime.fileRequest){const f=m.payload.files?.[0];if(f)void loadWatermark(sourceFrom(f),f.name||'水印图片').then(emitState)}});
syncControls();post('ready',{version:'0.1.1'});
})();
