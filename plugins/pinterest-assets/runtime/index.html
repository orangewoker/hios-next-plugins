<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest 素材库</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#253043}body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.bar{display:flex;gap:7px;padding:9px;background:#fff;border-bottom:1px solid #dce3eb}.logo{width:34px;height:34px;display:grid;place-items:center;color:#fff;background:#e60023;border-radius:50%;font:bold 20px Georgia}.bar input{min-width:0;flex:1;height:34px;padding:0 11px;border:1px solid #cbd5e1;border-radius:9px}.bar button,.footer button{height:34px;padding:0 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;cursor:pointer}.bar .primary,.footer .primary{color:#fff;background:#e60023;border-color:#e60023}.bar button:disabled,.footer button:disabled{opacity:.45}.status{padding:7px 11px;color:#6b778b;background:#fafbfc;border-bottom:1px solid #e2e8f0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{min-height:0;overflow:auto;padding:12px}.empty{height:100%;display:grid;place-content:center;gap:7px;text-align:center;color:#748095}.empty strong{color:#344054}.gallery{columns:5 145px;column-gap:10px}.card{position:relative;width:100%;margin:0 0 10px;padding:0;overflow:hidden;break-inside:avoid;border:2px solid transparent;border-radius:12px;background:#e9edf2;cursor:pointer}.card.selected{border-color:#e60023;box-shadow:0 0 0 2px rgba(230,0,35,.13)}.card img{width:100%;min-height:110px;display:block;object-fit:cover}.card span{position:absolute;top:6px;right:6px;min-width:24px;padding:3px 6px;color:#fff;background:rgba(0,0,0,.62);border-radius:6px;font-size:10px}.footer{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #dce3eb}.footer span{min-width:0;margin-right:auto;color:#68758a;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;z-index:20;left:50%;bottom:60px;transform:translateX(-50%);padding:8px 12px;color:#fff;background:rgba(20,28,40,.92);border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(prefers-color-scheme:dark){html,body{background:#111827;color:#e5edf7}.bar,.footer{background:#182231;border-color:#2d3b4d}.bar input,.bar button,.footer button{color:#e5edf7;background:#202c3b;border-color:#344459}.status{color:#9eacc0;background:#151f2c;border-color:#2d3b4d}.empty strong{color:#e5edf7}.card{background:#202c3b}}
</style></head><body>
<header class="bar"><span class="logo">P</span><input id="link" placeholder="粘贴 Pinterest Pin、图板或 pin.it 分享链接"><button id="parse" class="primary">解析</button></header>
<div id="status" class="status">Tauri 兼容模式：解析公开 Pinterest 链接，不再依赖 Electron webview。</div>
<main id="content" class="content"><div class="empty"><strong>粘贴公开 Pinterest 链接</strong><span>自动查找 pinimg originals 原图并加入画布。</span></div></main>
<footer class="footer"><span id="selection">尚未选择图片</span><button id="outputAll" hidden>全部加入画布</button><button id="output" class="primary" disabled>所选原图到画布</button></footer><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const P='hios-plugin-node/v1',$=id=>document.getElementById(id);let nodeId='',pluginId='pinterest-assets',selected=null,items=[],lastInput='';const pending=new Map;
const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const request=payload=>new Promise((resolve,reject)=>{const requestId=crypto.randomUUID();pending.set(requestId,{resolve,reject});post('network-request',{requestId,...payload});setTimeout(()=>{if(pending.delete(requestId))reject(Error('网络请求超时'))},45000)});const toast=text=>{const e=$('toast');e.textContent=text;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)};const clean=value=>String(value||'').replace(/\\u002F/gi,'/').replace(/\\u0026/gi,'&').replace(/\\\//g,'/').replace(/&amp;/g,'&');
function normalizedLink(text){const match=String(text||'').match(/https?:\/\/[^\s]+/i);if(!match)throw Error('请粘贴有效的 Pinterest 分享链接');const url=match[0].replace(/[，。；、)）\]}]+$/g,'');const host=new URL(url).hostname;if(!/(^|\.)pinterest\.[a-z.]+$|(^|\.)pin\.it$|(^|\.)pinimg\.com$/i.test(host))throw Error('仅支持 Pinterest、pin.it 或 pinimg.com 链接');return url}
function candidate(raw,base){let url='';try{url=new URL(clean(raw),base).href}catch{return null}if(!/^https?:/i.test(url)||!/(^|\.)pinimg\.com$/i.test(new URL(url).hostname))return null;const originals=url.replace(/\/(?:60x60|75x75_RS|136x136|170x|236x|474x|564x|736x|1200x)\//i,'/originals/');const fallback=url.replace(/\/(?:60x60|75x75_RS|136x136|170x|236x|474x|564x|736x|originals)\//i,'/1200x/');return{source:originals,fallback}}
function extract(html,url){const doc=new DOMParser().parseFromString(html,'text/html'),map=new Map;const title=(doc.querySelector('meta[property="og:title"]')?.content||doc.querySelector('meta[name="twitter:title"]')?.content||doc.title||'Pinterest').trim();const add=raw=>{const item=candidate(raw,url);if(item&&!map.has(item.source))map.set(item.source,{...item,title,pinUrl:url})};doc.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"],img').forEach(e=>{add(e.content||e.getAttribute('src')||e.getAttribute('data-src'));String(e.getAttribute('srcset')||'').split(',').forEach(v=>add(v.trim().split(/\s+/)[0]))});const decoded=clean(html);for(const match of decoded.matchAll(/https?:\/\/[^"'<>\s\\]+pinimg\.com[^"'<>\s\\]*/gi))add(match[0]);for(const match of decoded.matchAll(/["'](?:url|url_4k|url_1200x|url_736x|image_url)["']\s*:\s*["']([^"']+)["']/gi))add(match[1]);return{title,images:[...map.values()].slice(0,100)}}
function render(result){items=result.images;selected=null;$('content').replaceChildren();const grid=document.createElement('div');grid.className='gallery';items.forEach((item,index)=>{const b=document.createElement('button');b.className='card';b.type='button';const img=document.createElement('img');img.src=item.source;img.alt=`第 ${index+1} 张`;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{if(item.fallback&&img.src!==item.fallback)img.src=item.fallback};const n=document.createElement('span');n.textContent=String(index+1);b.append(img,n);b.onclick=()=>{selected={...item,source:img.currentSrc||item.source};grid.querySelectorAll('.card').forEach(x=>x.classList.toggle('selected',x===b));$('selection').textContent=`已选择第 ${index+1} 张：${result.title}`;$('output').disabled=false};grid.append(b)});$('content').append(grid);$('outputAll').hidden=items.length<2;if(items.length){grid.querySelector('.card')?.click();$('status').textContent=`已解析 ${items.length} 张 pinimg 图片 · ${result.title}`}else{$('content').innerHTML='<div class="empty"><strong>没有找到公开图片</strong><span>链接可能失效、需要登录或站点暂时限制访问。</span></div>';$('status').textContent='没有提取到图片'}}
async function parse(){let url;try{url=normalizedLink($('link').value)}catch(error){toast(String(error.message||error));return}$('parse').disabled=true;$('status').textContent='正在读取 Pinterest 页面…';try{if(/pinimg\.com$/i.test(new URL(url).hostname)){render({title:'Pinterest 原图',images:[{...(candidate(url,url)||{source:url,fallback:url}),title:'Pinterest 原图',pinUrl:url}]});return}const response=await request({url,method:'GET',headers:{accept:'text/html,application/xhtml+xml;q=0.9,*/*;q=0.7','accept-language':'zh-CN,zh;q=0.9,en;q=0.7','user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}});if(!response?.ok)throw Error(`页面返回 ${response?.status||'未知状态'}`);const finalUrl=response.url||url;render(extract(String(response.body||''),finalUrl));post('state',{state:{query:finalUrl,shareLink:finalUrl}})}catch(error){$('status').textContent='解析失败：'+String(error.message||error);toast(String(error.message||error))}finally{$('parse').disabled=false}}
function emit(item){if(!item)return;post('output',{kind:'image',portId:'image',source:item.source,url:item.source,name:(item.title||'pinterest')+'.jpg',metadata:{fallbackUrl:item.fallback,pinUrl:item.pinUrl,referer:item.pinUrl,addToCanvas:true}})}function output(){if(selected){emit(selected);toast('Pinterest 原图已加入画布')}}function outputAll(){items.forEach(emit);toast(`已输出 ${items.length} 张原图`)}
$('parse').onclick=()=>void parse();$('link').onkeydown=e=>e.key==='Enter'&&parse();$('output').onclick=output;$('outputAll').onclick=outputAll;addEventListener('message',event=>{const m=event.data;if(!m||m.protocol!==P)return;if(m.type==='network-result'){const payload=m.payload||{},job=pending.get(payload.requestId);if(job){pending.delete(payload.requestId);payload.error?job.reject(Error(payload.error)):job.resolve(payload.result)}return}if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;const value=String(m.payload?.inputs?.query||m.payload?.state?.shareLink||m.payload?.state?.query||'');if(value&&value!==lastInput){lastInput=value;$('link').value=value;if(/https?:\/\//i.test(value))void parse()}post('loaded',{ready:true})}if(m.type==='run'){selected?output():parse()}});post('ready',{version:'0.4.0'});
})();
</script></body></html>
