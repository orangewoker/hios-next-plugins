<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest 素材库</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:45px 25px 1fr}.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.logo{width:29px;height:29px;display:grid;place-items:center;color:#fff;background:#e60023;border-radius:8px;font:bold 18px Georgia}.nav,.bar>button{height:30px;min-width:30px;border:1px solid #cbd6df;border-radius:7px;background:#fff;color:#475569}.search{min-width:0;flex:1;height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#253143}.go{padding:0 12px!important;color:#fff!important;background:#e60023!important;border-color:#e60023!important}.status{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:#748193;background:#f8fafc;border-bottom:1px solid #dbe3ea;font-size:9px}.status small{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;min-height:0;background:#fff}.stage webview{width:100%;height:100%;display:flex}.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#6b7788;background:#edf2f6;text-align:center}.cover.hidden{display:none}.cover strong{color:#334155}.cover span{max-width:430px;font-size:10px;line-height:1.5}.toast{position:absolute;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);max-width:80%;padding:8px 11px;color:#fff;background:rgba(25,35,48,.9);border-radius:8px;font-size:10px;box-shadow:0 8px 22px #0004;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style></head><body><header class="bar"><span class="logo">P</span><button id="back" class="nav" title="后退">←</button><button id="forward" class="nav" title="前进">→</button><button id="reload" class="nav" title="刷新">↻</button><input id="query" class="search" placeholder="搜索 Pinterest 图片、设计灵感或作者"><button id="go" class="go">搜索</button><button id="home" title="首页">⌂</button></header><div class="status"><span id="message">右键 Pin 图片即可输出 originals 原图</span><small id="url">https://www.pinterest.com/</small></div><main class="stage"><webview id="view" src="https://www.pinterest.com/" partition="persist:hios-pinterest" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"></webview><div id="cover" class="cover"><strong>正在打开 Pinterest…</strong><span>登录状态会保存在插件的独立浏览器会话中。页面载入后，在图片上点击右键即可采集原图。</span></div><div id="toast" class="toast"></div></main><script>
(()=>{const P='hios-plugin-node/v1',HOME='https://www.pinterest.com/',$=s=>document.getElementById(s),v=$('view');let nodeId='',pluginId='pinterest-assets',ready=false,lastInput='',zoom=1;const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const msg=s=>$('message').textContent=s;const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};const nav=()=>{try{$('url').textContent=v.getURL()||HOME;$('back').disabled=!v.canGoBack();$('forward').disabled=!v.canGoForward()}catch{}};const setZoom=()=>{if(!ready||!v.isConnected)return;const z=Math.round(Math.max(.55,Math.min(1,v.getBoundingClientRect().width/900))*100)/100;if(Math.abs(z-zoom)>.01){zoom=z;try{v.setZoomFactor(z)}catch{}}};const extract=(x,y,src,title,link)=>`(()=>{const pick=(u)=>{if(!u)return'';try{return new URL(u,location.href).href}catch{return''}};let e=document.elementFromPoint(${x},${y}),img=e?.closest?.('img')||e?.querySelector?.('img');if(!img&&${JSON.stringify(src)})img=[...document.images].find(i=>i.currentSrc===${JSON.stringify(src)}||i.src===${JSON.stringify(src)});const candidates=[];if(img){candidates.push(img.currentSrc,img.src);for(const p of String(img.srcset||'').split(',')){const u=p.trim().split(/\\s+/)[0];if(u)candidates.push(u)}}candidates.push(${JSON.stringify(src)});let u=candidates.map(pick).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||'';const fallback=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/1200x/');u=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/originals/');const a=img?.closest?.('a[href*="/pin/"]')||e?.closest?.('a[href*="/pin/"]');return{source:u,fallback,title:(img?.alt||${JSON.stringify(title)}||document.title||'Pinterest').trim(),pinUrl:a?.href||${JSON.stringify(link)}||location.href,width:img?.naturalWidth||0,height:img?.naturalHeight||0}})()`;v.addEventListener('dom-ready',()=>{ready=true;$('cover').classList.add('hidden');setZoom();nav();msg('页面已载入，右键任意 Pin 图片即可采集原图')});v.addEventListener('did-stop-loading',()=>{ready=true;$('cover').classList.add('hidden');setZoom();nav()});v.addEventListener('did-navigate',nav);v.addEventListener('did-navigate-in-page',nav);v.addEventListener('did-fail-load',e=>{if(e.errorCode!==-3)msg('页面载入失败：'+(e.errorDescription||e.errorCode))});v.addEventListener('context-menu',async e=>{e.preventDefault();const p=e.params||{},ratio=Math.max(1,devicePixelRatio||1);msg('正在解析 Pin 原图…');try{const r=await v.executeJavaScript(extract(p.x/ratio,p.y/ratio,p.srcURL||'',p.altText||p.titleText||'',p.linkURL||p.pageURL||v.getURL()),true);if(!r?.source)throw Error('没有识别到图片，请在 Pin 大图上右键');post('output',{kind:'image',portId:'image',source:r.source,url:r.source,name:(r.title||'pinterest')+'.jpg',width:r.width,height:r.height,metadata:{fallbackUrl:r.fallback,pinUrl:r.pinUrl}});msg('已输出 Pinterest originals 原图');toast('原图已输出，可连接到其他画布节点')}catch(e){msg(String(e.message||e));toast(String(e.message||e))}});new ResizeObserver(setZoom).observe(v);$('back').onclick=()=>v.canGoBack()&&v.goBack();$('forward').onclick=()=>v.canGoForward()&&v.goForward();$('reload').onclick=()=>v.reload();$('home').onclick=()=>v.loadURL(HOME);const search=()=>{const q=$('query').value.trim();if(q)v.loadURL('https://www.pinterest.com/search/pins/?q='+encodeURIComponent(q));post('state',{state:{query:q}})};$('go').onclick=search;$('query').onkeydown=e=>e.key==='Enter'&&search();addEventListener('message',e=>{const m=e.data;if(!m||m.protocol!==P)return;if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;const q=String(m.payload?.inputs?.query||m.payload?.state?.query||'');$('query').value=q;post('loaded',{ready:true});if(q&&q!==lastInput){lastInput=q;search()}}if(m.type==='run')search()});post('ready',{version:'0.2.0'})})();
</script></body></html>
