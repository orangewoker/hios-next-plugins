<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest 素材库</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:45px 25px 1fr}.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.logo{width:29px;height:29px;display:grid;place-items:center;color:#fff;background:#e60023;border-radius:8px;font:bold 18px Georgia}.nav,.bar>button{height:30px;min-width:30px;border:1px solid #cbd6df;border-radius:7px;background:#fff;color:#475569}.search{min-width:0;flex:1;height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#253143}.go{padding:0 12px!important;color:#fff!important;background:#e60023!important;border-color:#e60023!important}.status{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:#748193;background:#f8fafc;border-bottom:1px solid #dbe3ea;font-size:9px}.status small{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;min-height:0;background:#fff}.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#6b7788;background:#edf2f6;text-align:center}.cover.hidden{display:none}.cover strong{color:#334155}.cover span{max-width:430px;font-size:10px;line-height:1.5}.toast{position:absolute;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);max-width:80%;padding:8px 11px;color:#fff;background:rgba(25,35,48,.9);border-radius:8px;font-size:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style></head><body><header class="bar"><span class="logo">P</span><button id="back" class="nav">←</button><button id="forward" class="nav">→</button><button id="reload" class="nav">↻</button><input id="query" class="search" placeholder="搜索 Pinterest 图片、设计灵感或作者"><button id="go" class="go">搜索</button><button id="home">⌂</button></header><div class="status"><span id="message">右键 Pin 图片即可输出 originals 原图</span><small id="url">https://www.pinterest.com/</small></div><main class="stage"><div id="cover" class="cover"><strong>正在打开 Pinterest…</strong><span>浏览器由 HIOS 通用插件浏览器接口提供，登录状态独立保存。</span></div><div id="toast" class="toast"></div></main><script>
(()=>{const P='hios-plugin-node/v1',HOME='https://www.pinterest.com/',$=s=>document.getElementById(s);let nodeId='',pluginId='pinterest-assets',opened=false,lastInput='',zoom=1;const pending=new Map;const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const command=(command,payload={})=>new Promise((resolve,reject)=>{const requestId=crypto.randomUUID();pending.set(requestId,{resolve,reject});post('browser-command',{requestId,command,...payload});setTimeout(()=>{if(pending.delete(requestId))reject(Error('浏览器命令超时'))},20000)});const msg=s=>$('message').textContent=s;const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};const nav=p=>{$('url').textContent=p.url||HOME;$('back').disabled=!p.canGoBack;$('forward').disabled=!p.canGoForward};const setZoom=()=>{const z=Math.round(Math.max(.55,Math.min(1,innerWidth/900))*100)/100;if(Math.abs(z-zoom)>.01){zoom=z;void command('set-zoom',{factor:z}).catch(()=>{})}};const extract=p=>`(()=>{const pick=u=>{if(!u)return'';try{return new URL(u,location.href).href}catch{return''}};let e=document.elementFromPoint(${p.x/Math.max(1,devicePixelRatio||1)},${p.y/Math.max(1,devicePixelRatio||1)}),img=e?.closest?.('img')||e?.querySelector?.('img');if(!img&&${JSON.stringify(p.srcURL||'')})img=[...document.images].find(i=>i.currentSrc===${JSON.stringify(p.srcURL||'')}||i.src===${JSON.stringify(p.srcURL||'')});const c=[];if(img){c.push(img.currentSrc,img.src);for(const x of String(img.srcset||'').split(',')){const u=x.trim().split(/\\s+/)[0];if(u)c.push(u)}}c.push(${JSON.stringify(p.srcURL||'')});let u=c.map(pick).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||'';const fallback=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/1200x/');u=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/originals/');const a=img?.closest?.('a[href*="/pin/"]')||e?.closest?.('a[href*="/pin/"]');return{source:u,fallback,title:(img?.alt||${JSON.stringify(p.altText||p.titleText||'')}||document.title||'Pinterest').trim(),pinUrl:a?.href||${JSON.stringify(p.linkURL||p.pageURL||'')}||location.href,width:img?.naturalWidth||0,height:img?.naturalHeight||0}})()`;const search=()=>{const q=$('query').value.trim();if(q)void command('load-url',{url:'https://www.pinterest.com/search/pins/?q='+encodeURIComponent(q)});post('state',{state:{query:q}})};$('back').onclick=()=>void command('back');$('forward').onclick=()=>void command('forward');$('reload').onclick=()=>void command('reload');$('home').onclick=()=>void command('load-url',{url:HOME});$('go').onclick=search;$('query').onkeydown=e=>e.key==='Enter'&&search();addEventListener('resize',setZoom);addEventListener('message',async e=>{const m=e.data;if(!m||m.protocol!==P)return;if(m.type==='browser-result'){const p=m.payload||{},job=pending.get(p.requestId);if(job){pending.delete(p.requestId);p.error?job.reject(Error(p.error)):job.resolve(p.result)}return}if(m.type==='browser-event'){const p=m.payload||{};if(p.event==='dom-ready'||p.event==='did-stop-loading'){$('cover').classList.add('hidden');setZoom();msg('页面已载入，右键任意 Pin 图片即可采集原图')}if(p.event==='navigation')nav(p);if(p.event==='did-fail-load'&&p.errorCode!==-3)msg('页面载入失败：'+(p.errorDescription||p.errorCode));if(p.event==='context-menu'){msg('正在解析 Pin 原图…');try{const r=await command('execute-js',{code:extract(p.params||{})});if(!r?.source)throw Error('没有识别到图片，请在 Pin 大图上右键');post('output',{kind:'image',portId:'image',source:r.source,url:r.source,name:(r.title||'pinterest')+'.jpg',width:r.width,height:r.height,metadata:{fallbackUrl:r.fallback,pinUrl:r.pinUrl}});msg('已输出 Pinterest originals 原图');toast('原图已输出，可连接到其他节点')}catch(err){msg(String(err.message||err));toast(String(err.message||err))}}return}if(m.type==='init'){nodeId=m.nodeId||nodeId;pluginId=m.pluginId||pluginId;const q=String(m.payload?.inputs?.query||m.payload?.state?.query||'');$('query').value=q;if(!opened){opened=true;post('browser-open',{src:HOME,userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',bounds:{top:70,right:0,bottom:0,left:0}})}post('loaded',{ready:true});if(q&&q!==lastInput){lastInput=q;search()}}if(m.type==='run')search()});post('ready',{version:'0.2.1'})})();
</script></body></html>
