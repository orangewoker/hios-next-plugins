<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest 素材库</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#edf2f6;color:#253143}body{display:grid;grid-template-rows:45px 25px minmax(0,1fr) 42px}.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #cbd6df}.logo{width:29px;height:29px;display:grid;place-items:center;color:#fff;background:#e60023;border-radius:8px;font:bold 18px Georgia}.nav,.bar>button{height:30px;min-width:30px;border:1px solid #cbd6df;border-radius:7px;background:#fff;color:#475569}.search{min-width:0;flex:1;height:31px;padding:0 10px;border:1px solid #cbd6df;border-radius:8px;background:#fff;color:#253143}.go,.footer button{color:#fff!important;background:#e60023!important;border-color:#e60023!important}.go{padding:0 12px!important}.status{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:#748193;background:#f8fafc;border-bottom:1px solid #dbe3ea;font-size:9px}.status small{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;min-height:0;background:#fff}.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#6b7788;background:#edf2f6;text-align:center}.cover.hidden{display:none}.cover strong{color:#334155}.cover span{max-width:430px;font-size:10px;line-height:1.5}.toast{position:absolute;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);max-width:80%;padding:8px 11px;color:#fff;background:rgba(25,35,48,.9);border-radius:8px;font-size:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.footer{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f8fafc;border-top:1px solid #cbd6df}.footer span{min-width:0;margin-right:auto;overflow:hidden;color:#6c7888;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.footer button{height:30px;padding:0 13px;border:1px solid;border-radius:8px;font-weight:700}.footer button:disabled{opacity:.45}.settings{position:absolute;z-index:20;top:43px;right:8px;width:min(430px,calc(100% - 16px));display:none;padding:10px;background:rgba(248,250,252,.98);border:1px solid #cbd6df;border-radius:10px;box-shadow:0 16px 40px rgba(25,38,53,.25)}.settings.open{display:grid;gap:8px}.settings label{display:grid;gap:4px;color:#647184;font-size:9px}.settings textarea{min-height:85px;resize:vertical;padding:8px;border:1px solid #cbd6df;border-radius:7px;background:#fff;font:9px/1.45 Consolas,monospace}.settings small{color:#84909f;font-size:8px;line-height:1.5}.settings-actions{display:flex;justify-content:flex-end;gap:7px}.settings-actions button{height:30px;padding:0 12px;border:1px solid #cbd6df;border-radius:7px;background:#fff}.settings-actions .save{color:#fff;background:#e60023;border-color:#e60023}
</style></head><body><header class="bar"><span class="logo">P</span><button id="back" class="nav">←</button><button id="forward" class="nav">→</button><button id="reload" class="nav">↻</button><input id="query" class="search" placeholder="搜索 Pinterest 图片、设计灵感或作者"><button id="go" class="go">搜索</button><button id="home">⌂</button><button id="settingsTrigger" title="登录与 Cookie 设置">⚙</button></header><div class="status"><span id="message">右键 Pin 图片可选择并保存 originals 原图</span><small id="url">https://www.pinterest.com/</small></div><main class="stage"><div id="cover" class="cover"><strong>正在打开 Pinterest…</strong><span>可直接网页登录，也可以在设置中导入 Cookie。</span></div><div id="toast" class="toast"></div></main><footer class="footer"><span id="selectedLabel">尚未选择图片，请先在图片上右键</span><button id="outputSelected" disabled>输出所选原图到画布</button></footer><section id="settings" class="settings"><label>Cookie 登录<textarea id="cookie" placeholder="粘贴 Cookie 请求头，例如 _auth=...; _pinterest_sess=..."></textarea></label><small>Cookie 只写入本插件独立的 Pinterest 浏览器会话。也可以关闭设置后直接在网页中正常登录。</small><div class="settings-actions"><button id="clearCookie">清除会话</button><button id="applyCookie" class="save">导入 Cookie 并登录</button></div></section><script>
(()=>{'use strict';const P='hios-plugin-node/v1',HOME='https://www.pinterest.com/',$=id=>document.getElementById(id);let nodeId='',pluginId='pinterest-assets',opened=false,lastInput='',zoom=1,selected=null;const pending=new Map;const post=(type,payload={})=>parent.postMessage({protocol:P,nodeId,pluginId,type,payload},'*');const command=(command,payload={})=>new Promise((resolve,reject)=>{const requestId=crypto.randomUUID();pending.set(requestId,{resolve,reject});post('browser-command',{requestId,command,...payload});setTimeout(()=>{if(pending.delete(requestId))reject(Error('浏览器命令超时'))},20000)});const msg=text=>$('message').textContent=text;const toast=text=>{const target=$('toast');target.textContent=text;target.classList.add('show');setTimeout(()=>target.classList.remove('show'),2400)};const nav=payload=>{$('url').textContent=payload.url||HOME;$('back').disabled=!payload.canGoBack;$('forward').disabled=!payload.canGoForward};const setZoom=()=>{const factor=Math.round(Math.max(.55,Math.min(1,innerWidth/900))*100)/100;if(Math.abs(factor-zoom)>.01){zoom=factor;void command('set-zoom',{factor}).catch(()=>{})}};const extract=params=>`(()=>{const pick=u=>{if(!u)return'';try{return new URL(u,location.href).href}catch{return''}};let e=document.elementFromPoint(${params.x/Math.max(1,devicePixelRatio||1)},${params.y/Math.max(1,devicePixelRatio||1)}),img=e?.closest?.('img')||e?.querySelector?.('img');if(!img&&${JSON.stringify(params.srcURL||'')})img=[...document.images].find(i=>i.currentSrc===${JSON.stringify(params.srcURL||'')}||i.src===${JSON.stringify(params.srcURL||'')});const c=[];if(img){c.push(img.currentSrc,img.src);for(const x of String(img.srcset||'').split(',')){const u=x.trim().split(/\\s+/)[0];if(u)c.push(u)}}c.push(${JSON.stringify(params.srcURL||'')});let u=c.map(pick).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||'';const fallback=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/1200x/');u=u.replace(/\\/(?:236x|474x|564x|736x|1200x)\\//,'/originals/');const a=img?.closest?.('a[href*="/pin/"]')||e?.closest?.('a[href*="/pin/"]');return{source:u,fallback,title:(img?.alt||${JSON.stringify(params.altText||params.titleText||'')}||document.title||'Pinterest').trim(),pinUrl:a?.href||${JSON.stringify(params.linkURL||params.pageURL||'')}||location.href,width:img?.naturalWidth||0,height:img?.naturalHeight||0}})()`;const parse=async params=>{const result=await command('execute-js',{code:extract(params||{})});if(!result?.source)throw Error('没有识别到图片，请在 Pin 大图上右键');selected=result;$('selectedLabel').textContent=`已选择：${result.title||'Pinterest 原图'}`;$('outputSelected').disabled=false;msg('已选择 Pinterest originals 原图，可点击右下角输出');return result};const emit=result=>{if(!result)return;post('output',{kind:'image',portId:'image',source:result.source,url:result.source,name:(result.title||'pinterest')+'.jpg',width:result.width,height:result.height,metadata:{fallbackUrl:result.fallback,pinUrl:result.pinUrl,addToCanvas:true}});msg('已将 Pinterest originals 原图输出到画布');toast('原图已加入画布')};const search=()=>{const query=$('query').value.trim();if(query)void command('load-url',{url:'https://www.pinterest.com/search/pins/?q='+encodeURIComponent(query)});post('state',{state:{query}})};$('back').onclick=()=>void command('back');$('forward').onclick=()=>void command('forward');$('reload').onclick=()=>void command('reload');$('home').onclick=()=>void command('load-url',{url:HOME});$('go').onclick=search;$('query').onkeydown=event=>event.key==='Enter'&&search();$('outputSelected').onclick=()=>emit(selected);$('settingsTrigger').onclick=()=>$('settings').classList.toggle('open');$('cookie').value=localStorage.getItem('pinterest.cookie')||'';$('applyCookie').onclick=async()=>{const cookies=$('cookie').value.trim();if(!cookies){toast('请先粘贴 Cookie');return}try{localStorage.setItem('pinterest.cookie',cookies);const result=await command('set-cookies',{url:HOME,cookies,reload:true});$('settings').classList.remove('open');toast(`已导入 ${result?.count||0} 条 Cookie`);msg('Cookie 已导入，正在刷新登录状态')}catch(error){toast(String(error.message||error))}};$('clearCookie').onclick=async()=>{try{localStorage.removeItem('pinterest.cookie');$('cookie').value='';const result=await command('clear-cookies',{url:HOME,reload:true});toast(`已清除 ${result?.count||0} 条 Cookie`)}catch(error){toast(String(error.message||error))}};addEventListener('resize',setZoom);addEventListener('message',async event=>{const message=event.data;if(!message||message.protocol!==P)return;if(message.type==='browser-result'){const payload=message.payload||{},job=pending.get(payload.requestId);if(job){pending.delete(payload.requestId);payload.error?job.reject(Error(payload.error)):job.resolve(payload.result)}return}if(message.type==='browser-event'){const payload=message.payload||{};if(payload.event==='dom-ready'||payload.event==='did-stop-loading'){$('cover').classList.add('hidden');setZoom();msg('页面已载入，右键 Pin 图片进行选择')}if(payload.event==='navigation')nav(payload);if(payload.event==='did-fail-load'&&payload.errorCode!==-3)msg('页面载入失败：'+(payload.errorDescription||payload.errorCode));if(payload.event==='context-menu'){try{await parse(payload.params||{})}catch(error){msg(String(error.message||error))}}if(payload.event==='context-action'&&payload.action==='save-original'){try{emit(await parse(payload.params||{}))}catch(error){toast(String(error.message||error))}}return}if(message.type==='init'){nodeId=message.nodeId||nodeId;pluginId=message.pluginId||pluginId;const query=String(message.payload?.inputs?.query||message.payload?.state?.query||'');$('query').value=query;if(!opened){opened=true;post('browser-open',{src:HOME,userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',bounds:{top:70,right:0,bottom:42,left:0}})}post('loaded',{ready:true});if(query&&query!==lastInput){lastInput=query;search()}}if(message.type==='run'){selected?emit(selected):search()}});post('ready',{version:'0.3.0'})})();
</script></body></html>
